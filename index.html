/* ================= PAGE ================= */

body{

/* ================= BOITE ================= */

p{

input{

border-radius:12px;

border:1px solid #ccc;

font-size:16px;

outline:none;

}

border-color:#1f4cff;

}

/* ================= BOUTON ================= */

button{

padding:15px;

border:none;

border-radius:12px;

font-size:16px;

cursor:pointer;

background:#1f4cff;

color:white;

transition:.3s;

}

button:hover{

transform:scale(1.03);

}

/* ================= NOUVEL UTILISATEUR ================= */

#newUser{

display:none;

flex-direction:column;

gap:10px;

}

/* ================= ANIMATION ================= */

@keyframes show{

from{

opacity:0;
transform:translateY(30px);

}

to{

opacity:1;
transform:translateY(0);

}

}
/* ================= TELEPHONE ================= */

/* ================= TELEPHONE STYLE WHATSAPP ================= */

.phone-box{

display:flex;

align-items:center;

gap:10px;

width:100%;

overflow:hidden;

}

.phone-box select{

padding:14px;

outline:none;

width:0;

padding:14px;

border-radius:12px;

border:1px solid #ccc;

font-size:16px;

}

/* ================= BOUTON INTELLIGENT ================= */

#continueBtn{

opacity:.5;

filter:blur(.5px);

pointer-events:none;

transition:.4s;

}


/* bouton actif */

#continueBtn.active{

opacity:1;

filter:none;

pointer-events:auto;

}


/* input valide */

.validInput{

border:2px solid #1f4cff!important;

}


/* animation validation */

@keyframes pulseValid{

0%{

transform:scale(1);

}

50%{

transform:scale(1.03);

}

100%{

transform:scale(1);

}

}

.validInput{

animation:
pulseValid .5s;

}

/* CHARGEMENT */
/* ================= LOADER ================= */

#loader{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:
rgba(255,255,255,.95);

z-index:9999;

justify-content:center;
align-items:center;
flex-direction:column;

gap:15px;

}

/* cercle animation */

.spinner{

width:50px;
height:50px;

border:5px solid #ddd;

border-top:5px solid #1f4cff;

border-radius:50%;

animation:
spin 1s linear infinite;

}

@keyframes spin{

0%{

transform:
rotate(0deg);

}

100%{

transform:
rotate(360deg);

}

}

#loader p{

color:#1f4cff;

font-weight:bold;

}

<script>

console.log("SCRIPT CHARGÉ");


// ================= FIREBASE =================

const firebaseConfig={

apiKey:"#",

authDomain:"multi-ecole.firebaseapp.com",

databaseURL:"https://multi-ecole-default-rtdb.europe-west1.firebasedatabase.app",

projectId:"multi-ecole",

storageBucket:"multi-ecole.firebasestorage.app",

messagingSenderId:"421233691634",

appId:"1:421233691634:web:c6884b8250c8cd1b7b796b"

};


// démarrer Firebase

firebase.initializeApp(
firebaseConfig
);


// base données

const db=
firebase.database();
// mémoire temporaire utilisateurs école

let schoolUsersCache=[];




// ================= LOADER SECURISE =================

function showLoader(){

let loader=
document.getElementById(
"loader"
);


// si n'existe pas → créer automatiquement

if(!loader){

let div=
document.createElement(
"div"
);

div.id=
"loader";

div.innerHTML=`

<div class="spinner"></div>

<p>

Chargement...

</p>

`;

div.style.cssText=`

display:flex;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,255,255,.95);
z-index:9999;
justify-content:center;
align-items:center;
flex-direction:column;
gap:15px;

`;

document.body.appendChild(
div
);

loader=div;

}


// afficher

loader.style.display=
"flex";

}



function hideLoader(){

let loader=
document.getElementById(
"loader"
);

if(loader){

loader.style.display=
"none";

}

}

// ================= CONNEXION =================

// ================= CONNEXION =================

function checkPhone(){

let code=

document
.getElementById(
"countryCode"
)
.value;


let number=

document
.getElementById(
"phone"
)
.value;


let phone=
code+number;

// mémoriser utilisateur connecté

window.currentPhone=
phone;


// afficher chargement

showLoader();


// chercher utilisateur

db.ref(
"users/"+phone
)

.once("value")

.then(snapshot=>{


// utilisateur existe

if(snapshot.exists()){

let user=
snapshot.val();


// attendre un peu pour effet app

setTimeout(()=>{

hideLoader();


// directeur

if(
user.role==="admin"
){

openAdmin();

}


// enseignant

else if(
user.role==="teacher"
){

openTeacher();

}


// parent

else if(
user.role==="parent"
){

openParent();

}


// élève

else if(
user.role==="student"
){

openStudent();

}

},1500);

}


// utilisateur inexistant

else{

hideLoader();


// cacher écran connexion

document
.querySelector("h1")
.style.display="none";

document
.querySelector("p")
.style.display="none";

document
.querySelector(".phone-box")
.style.display="none";

document
.querySelector(
"#continueBtn"
)
.style.display="none";


// afficher page choix

document
.getElementById(
"page2"
)
.style.display=
"flex";

}

})

.catch(error=>{

hideLoader();

alert(
error.message
);

});

}

function createSchool(){

.getElementById(
"page2"
)
.innerHTML=`

<h2 style="
text-align:center;
color:#1f4cff;
">

Inscription école

</h2>


<input
type="text"
id="schoolName"
placeholder="Nom de l'école"
>

<input
type="text"
id="directorName"

>

>

// ================= ENREGISTRER ECOLE =================

function registerSchool(){

let schoolName=

document
.getElementById(
"schoolName"
)
.value;


let directorName=

document
.getElementById(
"directorName"
)
.value;


let email=

document
.getElementById(
"email"
)
.value;


let schoolAddress=

document
.getElementById(
"schoolAddress"
)
.value;


// vérifier champs

if(

schoolName==="" ||

directorName==="" ||

email==="" ||

schoolAddress===""

){

alert(
"Compléter tous les champs"
);

return;

}


// créer école

// récupérer numéro utilisé au début

let phone=

document
.getElementById(
"countryCode"
).value+

document
.getElementById(
"phone"
).value;


// créer école

let schoolRef=

db.ref(
"schools"
).push();


// enregistrer école

schoolRef.set({

schoolName:
schoolName,

directorName:
directorName,

email:
email,

address:
schoolAddress,

createdAt:
new Date()
.toISOString()

})

.then(()=>{


// enregistrer directeur comme admin

return db.ref(
"users/"+phone
)

.set({

phone:phone,

schoolId:
schoolRef.key,

role:"admin",

name:
directorName,

createdAt:
new Date()
.toISOString()

});

})

.then(()=>{


// créer code invitation

let invitationCode=

Math.random()
.toString(36)
.substring(2,8)
.toUpperCase();


// enregistrer invitation

return db.ref(

"invitations/"+invitationCode

)

.set({

schoolId:
schoolRef.key,

role:"student"

})

.then(()=>{

document
.getElementById(
"page2"
)
.innerHTML=`

<h2 style="
color:#1f4cff;
text-align:center;
">

École créée

</h2>

<p>

Code invitation :

</p>

<div style="

font-size:35px;
font-weight:bold;
text-align:center;
color:#1f4cff;

">

${invitationCode}

</div>

<p>

Vous êtes administrateur

</p>

<button onclick="openAdmin()">

Entrer

</button>

`;

});

})



.catch(error=>{

alert(
error.message
);

});

}


function joinSchool(){

document.getElementById("page2").innerHTML = `

<h2 style="text-align:center;color:#1f4cff;">
Rejoindre une école
</h2>

<input type="text" id="inviteCode" placeholder="Code d'invitation">

}

// ================= VALIDATION TELEPHONE =================

function validatePhone(){

let input=
document.getElementById(
"phone"
);

let number=
input.value.replace(
/\D/g,
''
);


// maximum 10 caractères

number=
number.substring(
0,
10
);


// si RDC +243 et numéro commence par 0

if(

document
.getElementById(
"countryCode"
)
.value==="+243"

&&

number.length===10

&&

number.startsWith(
"0"
)

){

number=
number.substring(
1
);

}


// remettre dans champ

input.value=
number;


// récupérer bouton

let btn=
document.getElementById(
"continueBtn"
);

let status=
document.getElementById(
"phoneStatus"
);


// validation

if(number.length===9){

btn.disabled=
false;

btn.classList.add(
"active"
);

input.classList.add(
"validInput"
);

status.innerHTML=
"✓ Numéro valide";

status.style.color=
"green";

}

else{

btn.disabled=
true;

btn.classList.remove(
"active"
);

input.classList.remove(
"validInput"
);

status.innerHTML=
"Numéro incomplet";

status.style.color=
"#777";

}

}

// ================= FINALISER =================

// ================= FINALISER INSCRIPTION =================

function finishJoin(){

let name=

document
.getElementById(
"fullName"
)
.value
.trim();


let email=

document
.getElementById(
"userEmail"
)
.value
.trim();


// vérification

if(
name==="" ||
email===""
){

alert(
"Complétez tous les champs"
);

return;

}


// téléphone connecté

let phone=
window.currentPhone;


// invitation mémorisée

let invite=
window.currentInvite;


showLoader();


// enregistrer utilisateur

db.ref(
"users/"+phone
)

.set({

name:name,

email:email,

phone:phone,

schoolId:
invite.schoolId,

role:
invite.role,

createdAt:
new Date()
.toISOString()

})

.then(()=>{


// marquer invitation utilisée

return db.ref(
"invitations"
)

.orderByChild(
"schoolId"
)

.once(
"value"
);

})

.then(()=>{

hideLoader();


// ouvrir espace selon rôle

if(
invite.role==="teacher"
){

openTeacher();

}

else if(
invite.role==="parent"
){

openParent();

}

else{

openStudent();

}

})

.catch(error=>{

hideLoader();

alert(
error.message
);

});

}


// ================= DASHBOARD ADMIN =================

function openAdmin(){

let phone=
window.currentPhone;


db.ref(
"users/"+phone
)

.once("value")

.then(userSnap=>{

let user=
userSnap.val();

return db.ref(

.querySelector(

.innerHTML=`

<p>

</p>


<select
id="roleType"
style="

"
>

</option>

</option>

<option value="student">

Élève

</option>

</select>


<button
onclick="generateInvite()"
>

Générer invitation

</button>

<button onclick="openMembers()">

Membres de l'école

</button>

<div
id="generatedInvite"
style="
display:none;
padding:15px;
background:#f2f5ff;
border-radius:12px;

"

// ================= OUVRIR MEMBRES AVEC VRAI CHARGEMENT =================

function openMembers(){

// afficher chargement

showLoader();


// ouvrir membres

showMembers();

}

// ================= GENERER INVITATION =================

function generateInvite(){

let phone=
window.currentPhone;

let role=
document
.getElementById(
"roleType"
)
.value;


db.ref(
"users/"+phone
)

.once("value")

.then(snapshot=>{

let admin=
snapshot.val();

let schoolId=
admin.schoolId;


// code propre

let random=

Math.random()
.toString(36)
.substring(2,6)
.toUpperCase();


// exemple : STU-X7K2

let inviteCode=

role.substring(
0,
3
)
.toUpperCase()

+

random;


// enregistrer

return db.ref(
"invitations/"+inviteCode
)

.set({

schoolId:
admin.schoolId,

role:
role,

used:false,

createdAt:
new Date()
.toISOString()

})

.then(()=>{


document
.getElementById(
"generatedInvite"
)
.style.display=
"block";


document
.getElementById(
"generatedInvite"
)
.innerHTML=`

<p>

Code ${role}

</p>

<h2 style="
color:#1f4cff;
">

${inviteCode}

</h2>

`;

});

});

}


// ================= REJOINDRE ECOLE =================

function confirmJoin(){

let code=

document
.getElementById(
"inviteCode"
)
.value
.trim()
.toUpperCase();


// vide

if(code===""){

alert(
"Entrez un code"
);

return;

}


showLoader();


db.ref(
"invitations/"+code
)

.once("value")

.then(snapshot=>{

hideLoader();


// introuvable

if(!snapshot.exists()){

alert(
"Code invalide"
);

return;

}


let invite=
snapshot.val();


// déjà utilisé

if(
invite.used===true
){

alert(
"Code déjà utilisé"
);

return;

}


// mémoriser

window.currentInvite=
invite;


// formulaire final

document
.getElementById(
"page2"
)
.innerHTML=`

<h2 style="
text-align:center;
color:#1f4cff;
">

Compléter profil

</h2>

<input
id="fullName"
placeholder="Nom complet"
>

<input
id="userEmail"
placeholder="Email"
>

<button
onclick="finishJoin()"
>

Terminer

</button>

`;

})

.catch(error=>{

hideLoader();

alert(
error.message
);

});

}

// ================= MEMBRES ECOLE =================

// ================= MEMBRES ECOLE RAPIDE =================

function showMembers(reload=true){

let phone=
window.currentPhone;


// utiliser cache si déjà chargé

if(
reload===false
&&
schoolUsersCache.length>0
){

drawMembers();

return;

}


// récupérer admin

db.ref(
"users/"+phone
)

.once("value")

.then(snapshot=>{

let admin=
snapshot.val();

let schoolId=
admin.schoolId;


// vider cache

schoolUsersCache=[];


// charger utilisateurs

return db.ref(
"users"
)

.orderByChild(
"schoolId"
)

.once("value")

.then(users=>{

users.forEach(user=>{

let data=
user.val();

if(
data.schoolId===
schoolId
){

schoolUsersCache.push(
data
);

}

});


// afficher

drawMembers();

});

});

}

// ================= DESSINER MEMBRES =================

// ================= DESSINER MEMBRES PRO =================

function drawMembers(){

let students=0;
let teachers=0;
let parents=0;
let admins=0;


// compter

schoolUsersCache.forEach(data=>{

if(
data.role==="student"
){
students++;
}

else if(
data.role==="teacher"
){
teachers++;
}

else if(
data.role==="parent"
){
parents++;
}

else if(
data.role==="admin"
){
admins++;
}

});


// total

let total=

students+
teachers+
parents+
admins;



document
.querySelector(
".login-box"
)
.innerHTML=`

<h2 style="
text-align:center;
color:#1f4cff;
margin-bottom:5px;
">

Membres école

</h2>

<p style="
text-align:center;
color:gray;
margin-top:0;
margin-bottom:20px;
">

${total} membres enregistrés

</p>


<div style="

display:grid;

grid-template-columns:
1fr 1fr;

gap:15px;

">


<!-- Direction -->

<div
onclick="showRoleUsers('admin')"

style="

background:white;

border-radius:20px;

padding:20px;

cursor:pointer;

box-shadow:
0 5px 15px rgba(0,0,0,.08);

text-align:center;

transition:.3s;

border-left:
5px solid gold;

"

>

<div style="
font-size:35px;
">

👑

</div>

<b>

Direction

</b>

<p style="
font-size:22px;
font-weight:bold;
color:#1f4cff;
">

${admins}

</p>

</div>



<!-- Enseignants -->

<div
onclick="showRoleUsers('teacher')"

// ================= PERSONNES PAR ROLE =================

// ================= PERSONNES PAR ROLE PRO =================

function showRoleUsers(role){

// titre selon rôle

let roleName=role;

if(role==="student"){
roleName="🎓 Élèves";
}

else if(role==="teacher"){
roleName="📚 Enseignants";
}

else if(role==="parent"){
roleName="👨‍👩‍👦 Parents";
}

else if(role==="admin"){
roleName="👑 Direction";
}


// début interface

let html=`

<h2 style="
text-align:center;
color:#1f4cff;
margin-bottom:20px;
">

${roleName}

</h2>


<div style="
display:flex;
flex-direction:column;
gap:12px;
max-height:420px;
overflow:auto;
padding:5px;
">

`;


// créer cartes utilisateurs

schoolUsersCache.forEach(data=>{

if(data.role===role){

// première lettre du nom

let letter=
(data.name||"U")
.charAt(0)
.toUpperCase();

html+=`

<div style="

background:white;

border-radius:18px;

padding:15px;

display:flex;

align-items:center;

justify-content:space-between;

box-shadow:
0 4px 12px rgba(0,0,0,.08);

border-left:
5px solid #1f4cff;

animation:show .5s;

">

<div style="
display:flex;
align-items:center;
gap:12px;
">

<!-- avatar -->

<div style="

width:50px;
height:50px;

border-radius:50%;

background:#1f4cff;

color:white;

display:flex;

justify-content:center;
align-items:center;

font-size:20px;
font-weight:bold;

">

${letter}

</div>


<div>

<b style="
font-size:16px;
">

${data.name||"Sans nom"}

</b>

<br>

<span style="
font-size:13px;
color:gray;
">

${data.phone||""}

</span>

</div>

</div>


<!-- badge -->

<div style="

padding:8px 12px;

border-radius:20px;

background:#f2f5ff;

font-size:13px;

font-weight:bold;

color:#1f4cff;

">

${role}

</div>

</div>

`;

}

});


// bouton retour

html+=`

</div>

<button
onclick="showMembers(false)"
style="

margin-top:15px;

background:#1f4cff;

">

</button>

`;


// afficher

document
.querySelector(

)

html;

}

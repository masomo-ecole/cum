function checkPhone(){

    let code = document.getElementById("countryCode").value;
    let number = document.getElementById("phone").value.trim();

    // Accès spécial MASOMO (avant normalisation)
    if(number === "994044329"){
        window.currentPhone = "243994044329";
        openControleMasomo();
        return;
    }

    let phone = normalizePhone(code + number);

    // NE PAS sauvegarder la session ici
    window.currentPhone = phone;

    showLoader();

    db.ref("users/" + phone)
    .once("value")
    .then(snapshot => {

        hideLoader();

        if(snapshot.exists()){

            let user = snapshot.val();

            window.loginUserData = user;

            document.getElementById("loginPassword").style.display = "block";

            document.getElementById("continueBtn").innerText = "Se connecter";

            document.getElementById("continueBtn").onclick = loginUser;

            document.getElementById("page2").style.display = "flex";

        }

    })
    .catch(error => {

        hideLoader();

        alert(error.message);

    });

}

function chargerNotesClasse(){

let classe=document.getElementById(
"classeConsultation"
).value;

let resultat=document.getElementById(
"resultatNotes"
);

resultat.innerHTML="";

if(!classe)return;

showLoader();

db.ref(
"schools/"+window.currentSchoolId+"/notes"
)

.once("value")

.then(snapshot=>{

hideLoader();

let html="";

let trouve=false;

snapshot.forEach(eleveSnap=>{

let notesEleve=[];

let total=0;

let nombre=0;

eleveSnap.forEach(noteSnap=>{

let note=noteSnap.val();

if(note.classe!==classe)return;

trouve=true;

notesEleve.push(note);

total+=Number(note.note)||0;

nombre++;

});

if(notesEleve.length===0)return;

let moyenne=(total/nombre).toFixed(2);

html+=`

<div style="
background:white;
padding:15px;
margin-bottom:15px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,.10);
">

<h3 style="
margin:0;
color:#1f4cff;
">

👨‍🎓 ${notesEleve[0].nom}

</h3>

<br>

`;

notesEleve.forEach(n=>{

html+=`

<div style="
padding:8px 0;
border-bottom:1px solid #eee;
">

<b>${n.cours}</b>

<br>

${n.note}/${n.coteMax}

&nbsp;&nbsp;

(${Number(n.pourcentage).toFixed(1)}%)

&nbsp;&nbsp;

${n.mention}

</div>

`;

});

html+=`

<br>

<div style="
font-size:17px;
font-weight:bold;
color:#00c853;
text-align:right;
">

Moyenne : ${moyenne}

</div>

</div>

`;

});

if(!trouve){

html=`

<p style="
text-align:center;
color:gray;
">

Aucune note trouvée.

</p>

`;

}

resultat.innerHTML=html;

})

.catch(error=>{

hideLoader();

alert(error.message);

});

}

function enregistrerNotes(){

let classe=document.getElementById("classeNotes").value;

let cours=document.getElementById("coursNotes").value;


let periode=document.getElementById("periodeNotes").value;

let coteMax=parseFloat(
document.getElementById("coteMax").value
);

let dateEvaluation=document.getElementById("dateEvaluation").value;

let coursNom=

document
.getElementById("coursNotes")

.options[
document.getElementById("coursNotes").selectedIndex
]

.getAttribute("data-name")||"";

if(!classe){

alert("Choisissez une classe.");

return;

}

if(!cours){

alert("Choisissez un cours.");

return;

}

if(!periode){

alert("Choisissez une période.");

return;

}

if(isNaN(coteMax)||coteMax<=0){

alert("Entrez une cotation valide.");

return;

}

showLoader();

let promesses=[];

db.ref(
"schools/"+window.currentSchoolId+
"/students"
)

.once("value")

.then(snapshot=>{

snapshot.forEach(item=>{

let eleve=item.val();

if(eleve.className!==classe)return;

let note=parseFloat(

document.getElementById(
"note_"+item.key
).value

);

if(isNaN(note))return;

let pourcentage=(note/coteMax)*100;

let mention="";

if(pourcentage>=80){

mention="Excellent";

}else if(pourcentage>=70){

mention="Très Bien";

}else if(pourcentage>=60){

mention="Bien";

}else if(pourcentage>=50){

mention="Satisfaisant";

}else{

mention="Échec";

}

let noteId="NOT-"+Date.now()+"-"+item.key;

promesses.push(

db.ref(

"schools/"+window.currentSchoolId+

"/notes/"+

item.key+

"/"+

noteId

).set({

id:noteId,

matricule:item.key,

nom:eleve.name,

classe:classe,

coursId:cours,

cours:coursNom,

periode:periode,

note:note,

coteMax:coteMax,

pourcentage:pourcentage,

mention:mention,

dateEvaluation:dateEvaluation,

enseignant:window.currentPhone,

timestamp:Date.now()

})

);

});

return Promise.all(promesses);

})

.then(()=>{

hideLoader();

alert("Les notes ont été enregistrées avec succès.");

ouvrirNotes();

})

.catch(error=>{

hideLoader();

alert(error.message);

});

}

function finishJoin(){

showLoader();

let invite=window.currentInvite;

if(!invite){
    hideLoader();
    alert("Invitation introuvable.");
    return;
}

let phone=normalizePhone(window.currentPhone);
let role=invite.role;
let schoolId=invite.schoolId;
let matricule="";

if(role=="parent"){

    matricule=document.getElementById("matricule")
    .value
    .trim()
    .toUpperCase();

    if(matricule==""){
        hideLoader();
        alert("Veuillez saisir le matricule de l'élève.");
        return;
    }

}

db.ref("invitations/"+invite.code)

.once("value")

.then(inviteSnap=>{

    if(!inviteSnap.exists()){
        throw new Error("Invitation introuvable.");
    }

    let inv=inviteSnap.val();

    if(inv.used){
        throw new Error("Ce code d'invitation a déjà été utilisé.");
    }

    return db.ref("users/"+phone).once("value");

})

.then(userSnap=>{

    if(userSnap.exists()){
        throw new Error("Ce numéro est déjà inscrit.");
    }

    // =======================
    // PARENT
    // =======================

    if(role=="parent"){

        return db.ref(
        "schools/"+schoolId+"/students/"+matricule
        )

        .once("value")

        .then(studentSnap=>{

            if(!studentSnap.exists()){
                throw new Error("Matricule élève introuvable.");
            }

            let eleve=studentSnap.val();

            let parent={

                phone:phone,

                role:"parent",

                schoolId:schoolId,
                
                mustChangePassword:true,
                
                password: invite.code,

                studentMatricule:matricule,

                studentName:eleve.name,

                name:"Parent de "+eleve.name,

                createdAt:Date.now()

            };

            return Promise.all([

                db.ref("users/"+phone).set(parent),

                db.ref(
                "schools/"+schoolId+"/members/"+phone
                ).set({

                    phone:phone,

                    role:"parent",

                    name:parent.name,

                    studentMatricule:matricule,

                    createdAt:Date.now()

                }),

                db.ref(
                "invitations/"+invite.code
                ).update({

                    used:true,

                    usedBy:phone,

                    usedAt:Date.now()

                })

            ]);

        })

        .then(()=>{

            hideLoader();

            alert("École rejointe avec succès.");

            openParent();

        });

    }

    // =======================
    // ENSEIGNANT
    // =======================

    if(role=="teacher"){

        return db.ref(
        "schools/"+schoolId+"/teachers"
        )

        .once("value")

        .then(snapshot=>{

            if(!snapshot.exists()){
                throw new Error("Aucun enseignant trouvé.");
            }

            let teacher=null;

            snapshot.forEach(child=>{

                let t=child.val();

                if(normalizePhone(t.telephone)==phone){
                    teacher=t;
                }

            });

            if(!teacher){
                throw new Error("Cet enseignant n'est pas enregistré dans cette école.");
            }

            // <<< LA SUITE EST DANS LA PARTIE 3B >>>
            
                        teacher.phone=phone;
            teacher.linked=true;

            return Promise.all([

                db.ref("users/"+phone).set(teacher),

                db.ref(
                "schools/"+schoolId+"/teachers/"+teacher.matricule
                ).update({
                    linked:true
                }),

                db.ref(
                "schools/"+schoolId+"/members/"+teacher.matricule
                ).update({
                    phone:phone,
                    linked:true
                }),

                db.ref(
                "invitations/"+invite.code
                ).update({

                    used:true,

                    usedBy:phone,

                    usedAt:Date.now()

                })

            ]);

        })

        .then(()=>{

            hideLoader();

            alert("École rejointe avec succès.");

            openTeacher();

        });

    }

    // =======================
    // ÉLÈVE
    // =======================

function afficherTempsRestant(school){

let abonnementActif=
school.subscriptionEnd &&
school.subscriptionEnd>Date.now();

let fin=abonnementActif
?school.subscriptionEnd
:school.trialEnd;

if(!fin) return "";

let restant=fin-Date.now();

if(restant<=0){

return `

<div style="
background:#D32F2F;
color:white;
padding:10px;
border-radius:12px;
margin-top:8px;
text-align:center;
">

<b>

${abonnementActif
?"⛔ Abonnement expiré"
:"⛔ Essai expiré"}

</b>

</div>

`;

}

let jours=Math.floor(restant/86400000);

let heures=Math.floor((restant%86400000)/3600000);

let minutes=Math.floor((restant%3600000)/60000);

let secondes=Math.floor((restant%60000)/1000);

let couleur=restant<=10*60*1000
?"#D32F2F"
:"#2E7D32";

return `

<div style="
background:${couleur};
color:white;
padding:10px;
border-radius:12px;
margin-top:8px;
text-align:center;
">

<div style="
font-size:16px;
font-weight:bold;
margin-bottom:8px;
">

${abonnementActif
?"💳 Abonnement restant"
:"🎁 Essai restant"}

</div>

<div id="compteurAbonnement"
data-fin="${fin}"
style="
font-size:22px;
font-family:monospace;
font-weight:bold;
letter-spacing:2px;
">

${String(jours).padStart(2,"0")} :
${String(heures).padStart(2,"0")} :
${String(minutes).padStart(2,"0")} :
${String(secondes).padStart(2,"0")}

</div>

<div style="
font-size:11px;
margin-top:5px;
opacity:.8;
">

J H M S

</div>

</div>

`;

}

function lancerCompteurExpiration(){

clearInterval(window.compteurExpiration);

window.compteurExpiration=setInterval(function(){

if(!window.adminCache) return;

let abonnementActif =
window.adminCache.subscriptionEnd &&
window.adminCache.subscriptionEnd > Date.now();

let fin = abonnementActif
? window.adminCache.subscriptionEnd
: window.adminCache.trialEnd;

if(!fin) return;

let restant=fin-Date.now();

if(restant<0){

clearInterval(window.compteurExpiration);

actualiserAdmin(true);

return;

}

let jours=Math.floor(restant/86400000);

restant%=86400000;

let heures=Math.floor(restant/3600000);

restant%=3600000;

let minutes=Math.floor(restant/60000);

restant%=60000;

let secondes=Math.floor(restant/1000);

let el=document.getElementById("compteurAbonnement");

if(el){

el.innerHTML=

jours.toString().padStart(2,"0")+

" : "+

heures.toString().padStart(2,"0")+

" : "+

minutes.toString().padStart(2,"0")+

" : "+

secondes.toString().padStart(2,"0");

}

},1000);

}

function confirmJoin(){

.value
.trim()
.toUpperCase();

    alert("Veuillez saisir le code d'invitation.");
    return;
}

.once("value")

.then(snapshot=>{

    hideLoader();

    if(!snapshot.exists()){
        alert("Code d'invitation invalide.");
        return;
    }

    let invite=snapshot.val();

    if(invite.used){
        alert("Ce code d'invitation a déjà été utilisé.");
        return;
    }

    // Vérifier que le rôle est valide
    if(
        invite.role!="teacher" &&
        invite.role!="student" &&
        invite.role!="parent"
    ){
        alert("Invitation invalide.");
        return;
    }

    invite.code=code;

    window.currentInvite=invite;

    // Parent : demander le matricule
    if(invite.role=="parent"){

        document.querySelector(".login-box").innerHTML=`

        <h2>Compléter le profil</h2>

        <input
        id="matricule"
        placeholder="Matricule de l'élève">

        <button onclick="finishJoin()">
        Terminer
        </button>

        `;

        return;

    }

    // Enseignant et élève
    finishJoin();

})

.catch(error=>{

    hideLoader();

    alert(error.message);

});

}

// ================= VALIDATION TELEPHONE =================

function validatePhone(){

const input=
document.getElementById("phone");

const country=
document.getElementById("countryCode");

const btn=
document.getElementById("continueBtn");

const status=
document.getElementById("phoneStatus");


if(
!input ||
!country ||
!btn ||
!status
){
return;
}


// garder uniquement chiffres

let number=
input.value.replace(/\D/g,"");


// traitement RDC

if(

country.value==="+243" &&
number.startsWith("0")

){

number=
number.substring(1);

}


// limites

const maxLength=

country.value==="+243"
?9
:15;

number=
number.substring(0,maxLength);

input.value=
number;


// validation

const isValid=

country.value==="+243"
?number.length===9
:number.length>=6;


// mise à jour interface

btn.disabled=!isValid;

btn.classList.toggle(
"active",
isValid
);

input.classList.toggle(
"validInput",
isValid
);


status.innerHTML=

isValid
?"✓ Numéro valide"
:"Numéro incomplet";


status.style.color=

isValid
?"green"
:"#777";

}

async function modifierEmploiTemps(id) {
    try {
        const snap = await db.ref("emploisTemps/" + id).once("value");

        if (!snap.exists()) {
            alert("Emploi du temps introuvable.");
            return;
        }

        const e = snap.val();

        const jour = prompt("Jour :", e.jour);
        if (jour === null) return;

        const heure = prompt("Heure :", e.heure);
        if (heure === null) return;

        const matiere = prompt("Matière :", e.matiere);
        if (matiere === null) return;

        const enseignant = prompt("Enseignant :", e.enseignant);
        if (enseignant === null) return;

        const salle = prompt("Salle :", e.salle || "");
        if (salle === null) return;

        await db.ref("emploisTemps/" + id).update({
            jour,
            heure,
            matiere,
            enseignant,
            salle
        });

        alert("Emploi du temps modifié avec succès.");

        if (typeof chargerEmploiTemps === "function") {
            chargerEmploiTemps();
        }

    } catch (err) {
        console.error(err);
        alert("Erreur lors de la modification.");
    }
}


async function supprimerEmploiTemps(id) {

    if (!confirm("Supprimer cet emploi du temps ?")) return;

    try {

        await db.ref("emploisTemps/" + id).remove();

        alert("Emploi du temps supprimé.");

        if (typeof chargerEmploiTemps === "function") {
            chargerEmploiTemps();
        }

    } catch (err) {
        console.error(err);
        alert("Erreur lors de la suppression.");
    }
}

function enregistrerEmploiTemps(){

let telephone=document.getElementById("enseignant").value;

if(telephone==""){

alert("Choisissez un enseignant.");

return;

}

// Correspondance des jours
const jours={

"Dimanche":0,

"Lundi":1,

"Mardi":2,

"Mercredi":3,

"Jeudi":4,

"Vendredi":5,

"Samedi":6

};

db.ref(
"schools/"+window.currentSchoolId+"/teachers"
)
.once("value")
.then(snapshot=>{

let enseignant=null;

snapshot.forEach(item=>{

let t=item.val();

if(t.telephone==telephone){

enseignant=t;

}

});

if(!enseignant){

alert("Enseignant introuvable.");

return;

}

let jourChoisi=document.getElementById("jour").value;

let debut=document.getElementById("heureDebut").value;

let fin=document.getElementById("heureFin").value;

let classe=document.getElementById("classe").value;

let salle=document.getElementById("salle").value;

let matiere=document.getElementById("matiere").value;

return db.ref(
"schools/"+window.currentSchoolId+"/emploisTemps"
)
.once("value")
.then(snap=>{

let conflit=false;

snap.forEach(item=>{

let c=item.val();

if(c.jourNumero!=null){

if(c.jourNumero!=jours[jourChoisi]) return;

}else{

if(c.jour!=jourChoisi) return;

}

// Vérifier le chevauchement des heures
if(

debut<c.heureFin &&

fin>c.heureDebut

){

if(c.enseignantPhone==enseignant.telephone){

alert("❌ Cet enseignant a déjà un cours à cette heure.");

conflit=true;

return;

}

if(c.classe==classe){

alert("❌ Cette classe a déjà un cours à cette heure.");

conflit=true;

return;

}

if(c.salle==salle){

alert("❌ Cette salle est déjà occupée à cette heure.");

conflit=true;

return;

}

}

});

if(conflit) return;

let id="EMP"+Date.now();

let data={

id:id,

enseignantPhone:enseignant.telephone,

enseignantNom:
enseignant.nom+" "+
enseignant.postnom+" "+
enseignant.prenom,

classe:classe,

matiere:matiere,

jour:jourChoisi,

jourNumero:jours[jourChoisi],

heureDebut:debut,

heureFin:fin,

salle:salle,

statut:"Programmé",

dateCreation:Date.now()

};

return db.ref(
"schools/"+window.currentSchoolId+
"/emploisTemps/"+id
)
.set(data);

});

})
.then(()=>{

alert("✅ Emploi du temps enregistré.");

ouvrirGestionEmploiTemps();

})
.catch(error=>{

alert(error.message);

});

}

async function telechargerPDF(){

let element=

document.getElementById(
"ficheDocument"
);

let canvas=

await html2canvas(
element
);

let image=

canvas.toDataURL(
"image/png"
);

const{

jsPDF

}=window.jspdf;

let pdf=

new jsPDF();

pdf.addImage(

image,

"PNG",

10,

10,

180,

0

);

pdf.save(
"fiche.pdf"
);

}

function telechargerWord(){

let contenu=

document.getElementById(
"ficheDocument"
).innerText;

const doc=

new docx.Document({

sections:[{

children:[

new docx.Paragraph({

text:contenu

})

]

}]

});

docx.Packer

.toBlob(doc)

.then(blob=>{

saveAs(

blob,

"fiche.docx"

);

});

}


function telechargerExcel(){

let texte=

document.getElementById(
"ficheDocument"
).innerText;

let lignes=

texte.split("\n");

let data=[];

lignes.forEach(l=>{

data.push({

Information:l

});

});

let feuille=

XLSX.utils.json_to_sheet(
data
);

let classeur=

XLSX.utils.book_new();

XLSX.utils.book_append_sheet(

classeur,

feuille,

"Fiche"

);

XLSX.writeFile(

classeur,

"fiche.xlsx"

);

}

        window.masomoUsers = users;

    if(!user.schoolId) return;

    // Regrouper les utilisateurs par école
    if(!window.schoolUsers[user.schoolId]){

    }

    window.schoolUsers[user.schoolId].push(user);

    // Statistiques

        window.schoolStats[user.schoolId] = {
            total:0,
            admins:0,
            teachers:0,
            parents:0,
            students:0
        };

    const s = window.schoolStats[user.schoolId];

    s.total++;

    switch(user.role){
        case "admin":
            s.admins++;
            break;
        case "teacher":
            s.teachers++;
            break;

            break;

async function validerEcole(schoolId){

if(!confirm("Valider cette école ?")) return;

showLoader();

try{

const schoolSnap = await db.ref("schools/"+schoolId).once("value");

const school = schoolSnap.val();

let data = {

status:"active",

paymentStatus:"paid",

verifiedBy:"MASOMO",

verifiedAt:Date.now()

};

// Première activation : pas encore d'essai
// Première activation → Essai de 30 minutes
if(!school.trialStart){

data.trialStart = Date.now();

data.trialEnd = Date.now() + (30*60*1000);

// 30 minutes

}else{

// Renouvellement → Abonnement de 10 minutes
data.subscriptionStart = Date.now();

data.subscriptionEnd = Date.now() + (10*60*1000);

// 10 minutes

data.subscriptionNumber = (school.subscriptionNumber || 0) + 1;

}

await db.ref("schools/"+schoolId).update(data);

hideLoader();

alert("École validée avec succès.");

openControleMasomo();

}
catch(error){

hideLoader();

alert(error.message);

}

}

function verifierEssai(school){

let abonnementActif =
    school.subscriptionEnd &&
    school.subscriptionEnd > Date.now();

let fin = abonnementActif
    ? school.subscriptionEnd
    : school.trialEnd;

if(!fin){
    return true;
}

if(Date.now() >= fin){
    afficherEssaiExpire(school);
    return false;
}

return true;

}

};

)

.once("value")

.then(snapshot=>{

let promises=[];

let ancienneMere=normalizePhone(ancienEleve.motherPhone||"");

ancienPere &&
ancienPere!=data.fatherPhone
){

promises.push(

db.ref(
"parents/"+ancienPere+"/children/"+matricule
).remove()

);

}

if(
ancienneMere &&
ancienneMere!=data.motherPhone
){

promises.push(

db.ref(
"parents/"+ancienneMere+"/children/"+matricule
).remove()

);

}

db.ref(
"schools/"+window.currentSchoolId+
"/students/"+matricule
).update(data)

);

return Promise.all(promises);

)

.update({

)

.update({

)

.set(enfant)

);

db.ref(

)

.set(enfant)

);

function updateTeacher(
matricule,
ancienTelephone
){

showLoader();

let telephone=

document
.getElementById("telephone")
.value
.replace(/\D/g,"");

if(
telephone.startsWith("0")
){
telephone=
telephone.substring(1);
}

if(
telephone &&
!telephone.startsWith("243")
){
telephone=
"243"+telephone;
}

telephone=
"+"+telephone;

let data={

nom:
document.getElementById("nom").value.trim(),

postnom:
document.getElementById("postnom").value.trim(),

prenom:
document.getElementById("prenom").value.trim(),

name:
document.getElementById("nom").value.trim()
+" "+
document.getElementById("postnom").value.trim()
+" "+
document.getElementById("prenom").value.trim(),

sexe:
document.getElementById("sexe").value,

dateNaissance:
document.getElementById("dateNaissance").value,

lieuNaissance:
document.getElementById("lieuNaissance").value,

dateEngagement:
document.getElementById("dateEngagement").value,

password:
document.getElementById("password").value,

classe:
document.getElementById("classeEns").value,

matiere:
document.getElementById("matiere").value,

telephone:
telephone,

adresse:
document.getElementById("adresse").value

};

db.ref(
"schools/"
+
window.currentSchoolId+
"/teachers/"
+
matricule
)

.update(data)

.then(()=>{

return db.ref(
"schools/"
+
window.currentSchoolId+
"/members/"
+
matricule
)

.update({

name:data.name,

phone:telephone

});

})

.then(()=>{

if(
ancienTelephone!=telephone
){

return db.ref(
"users/"
+
ancienTelephone
)

.once("value")

.then(snapshot=>{

let user=
snapshot.val();

if(user){

user.phone=
telephone;

user.name=
data.name;

return db.ref(
"users/"
+
telephone
)

.set(user)

.then(()=>{

return db.ref(
"users/"
+
ancienTelephone
)

.remove();

});

}

});

}

return db.ref(
"users/"
+
telephone
)

.update({

name:data.name,

phone:telephone,

password:data.password,

classe:data.classe



});

})

.then(()=>{

hideLoader();

alert(
"Enseignant modifié avec succès."
);

viewTeacher(
matricule
);

})

.catch(error=>{

hideLoader();

alert(
error.message
);

});

}

function normalizePhone(phone){

phone=(phone||"").replace(/\D/g,"");

if(phone.startsWith("0")){
phone=phone.substring(1);
}

if(phone && !phone.startsWith("243")){
phone="243"+phone;
}

return phone;

}

// Enregistre payement 

function enregistrerPaiement(matricule){

let type=document.getElementById("typePaiement").value;

let montant=parseFloat(
document.getElementById("montantPaiement").value
);

let date=document.getElementById("datePaiement").value;

let observation=document
.getElementById("observationPaiement")
.value.trim();

if(isNaN(montant)||montant<=0){
alert("Montant invalide.");
return;
}

if(!date){
alert("Choisissez une date.");
return;
}

showLoader();

let schoolId=window.currentSchoolId;

let paiementId="PAY-"+Date.now();

let numeroRecu="REC-"+Date.now();

let eleve=null;

let totalFrais=0;

let dejaPaye=0;

let nouveauTotal=0;

let reste=0;

let statut="🟡 Partiel";

db.ref(
"schools/"+schoolId+
"/students/"+matricule
)

.once("value")

.then(snapshot=>{

if(!snapshot.exists()){
throw new Error("Élève introuvable.");
}

eleve=snapshot.val();

return db.ref(
"schools/"+schoolId+
"/finances/paiementsEleves"
)

.orderByChild("matricule")
.equalTo(matricule)
.once("value");

})

.then(paySnap=>{

paySnap.forEach(item=>{

let p=item.val();

dejaPaye+=Number(p.montant)||0;

});

db.ref(
"schools/"+
schoolId+
"/finances/frais/"+
eleve.className
)

nouveauTotal=dejaPaye+montant;

reste=Math.max(
0,
totalFrais-nouveauTotal
);

if(totalFrais>0 && reste===0){
statut="🟢 Payé";
}
let paiement={

id:paiementId,

recu:numeroRecu,

matricule:matricule,

nom:eleve.name||"",

classe:eleve.className||"",

type:type,

montant:montant,

totalFrais:totalFrais,

totalPaye:nouveauTotal,

reste:reste,

statut:statut,

date:date,

observation:observation,

caissier:window.currentPhone,

timestamp:Date.now()

};


let recette={

id:paiementId,

numero:numeroRecu,

motif:"Paiement scolaire - "+(eleve.name||""),

categorie:type,

montant:montant,

observation:observation,

eleve:eleve.name||"",

matricule:matricule,

classe:eleve.className||"",

date:date,

heure:new Date().toLocaleTimeString(),

createdAt:Date.now(),

createdBy:window.currentPhone

};

let promesses=[];


// Enregistrer le paiement
promesses.push(

db.ref(
"schools/"+schoolId+
"/finances/paiementsEleves/"+
paiementId
).set(paiement)

);

// Ajouter dans les recettes générales
promesses.push(

db.ref(
"schools/"+schoolId+
"/finance/recettes/"+
paiementId
).set(recette)

);

// Mettre à jour la finance de l'élève
promesses.push(

db.ref(
"schools/"+schoolId+
"/students/"+
matricule+
"/finance"
).update({

totalPaye:nouveauTotal,

reste:reste,

statut:statut,

dernierPaiement:date

})

);


// Notification au père
if(eleve.fatherPhone){

promesses.push(

db.ref(
"schools/"+schoolId+
"/notifications/"+
eleve.fatherPhone+
"/"+
Date.now()
).set({

title:"💰 Paiement reçu",

message:
"Le paiement de "+
montant+
" FC pour "+
eleve.name+
" a été enregistré.\nReste à payer : "+
reste+
" FC.",

type:"paiement",

date:date,

read:false,

timestamp:Date.now()

})

);

}


// Notification à la mère
if(eleve.motherPhone){

promesses.push(

db.ref(
"schools/"+schoolId+
"/notifications/"+
eleve.motherPhone+
"/"+
(Date.now()+1)
).set({

title:"💰 Paiement reçu",

message:
"Le paiement de "+
montant+
" FC pour "+
eleve.name+
" a été enregistré.\nReste à payer : "+
reste+
" FC.",

type:"paiement",

date:date,

read:false,

timestamp:Date.now()

})

);

}

return Promise.all(promesses);

})
.then(()=>{

hideLoader();

alert(

"✅ Paiement enregistré avec succès.\n\n"+

"🧾 Reçu : "+numeroRecu+

"\n💵 Montant payé : "+montant+" FC"+

"\n📊 Total payé : "+nouveauTotal+" FC"+

"\n💰 Reste : "+reste+" FC"+

"\n📌 Statut : "+statut

);

paiementEleves();

})

.catch(error=>{

hideLoader();

console.error(error);

alert(

"Erreur : "+error.message

);

});

}

function enregistrerPaiementPersonnel(idPersonnel){

let salairePrevu=parseFloat(
document.getElementById("salairePrevu").value
)||0;

let prime=parseFloat(
document.getElementById("primePersonnel").value
)||0;

let avance=parseFloat(
document.getElementById("avancePersonnel").value
)||0;

let montantPaye=parseFloat(
document.getElementById("montantPersonnel").value
);

let date=document.getElementById("datePersonnel").value;

let observation=document
.getElementById("observationPersonnel")
.value.trim();

if(isNaN(montantPaye)||montantPaye<=0){

alert("Montant invalide.");
return;

}

showLoader();

db.ref(
"schools/"+window.currentSchoolId+
"/teachers/"+idPersonnel
)

.once("value")

.then(snapshot=>{

if(!snapshot.exists()){

throw new Error("Personnel introuvable.");

}

let personnel=snapshot.val();

let totalSalaire=salairePrevu+prime;

let reste=Math.max(
0,
totalSalaire-avance-montantPaye
);

// Toujours en attente tant que l'enseignant n'a pas confirmé
let statut="🟡 En attente de confirmation";

let paiementId="SAL-"+Date.now();

let paiement={

id:paiementId,

personnelId:idPersonnel,

name:personnel.name,

phone:personnel.telephone||"",

role:personnel.role||"Personnel",

salairePrevu:salairePrevu,

prime:prime,

avance:avance,

montantPaye:montantPaye,

reste:reste,

statut:statut,

date:date,

observation:observation,

timestamp:Date.now(),

caissier:window.currentPhone

};

let promesses=[];

// Historique des paiements
promesses.push(

db.ref(
"schools/"+window.currentSchoolId+
"/finances/paiementsPersonnel/"+
paiementId
).set(paiement)

);

// Historique personnel
promesses.push(

db.ref(
"schools/"+window.currentSchoolId+
"/teachers/"+
idPersonnel+
"/finance"
).update({

dernierPaiement:date,

montantPaye:montantPaye,

reste:reste,

statut:statut

})

);

let phonePersonnel=normalizePhone(personnel.telephone||"");

// Notification
if(phonePersonnel){

promesses.push(

db.ref(
"schools/"+window.currentSchoolId+
"/notifications/"+
phonePersonnel+
"/"+
Date.now()
).set({

title:"💰 Salaire enregistré",

message:
"Un paiement de "+
montantPaye+
" FC a été enregistré.\nVeuillez confirmer sa réception.",

type:"salaire",

paiementId:paiementId,

read:false,

confirmed:false,

status:"en_attente",

date:date,

timestamp:Date.now()

})

);

}

return Promise.all(promesses);

})

.then(()=>{

hideLoader();

alert("Paiement enregistré. En attente de confirmation de l'enseignant.");

paiementPersonnel();

})

.catch(error=>{

hideLoader();

alert(error.message);

});

}

function chargerDashboardFinance(){

let schoolId = window.currentSchoolId;

if(!schoolId){
    alert("École introuvable.");
    return;
}

Promise.all([

    db.ref(
    "schools/"+schoolId+"/finance/recettes"
    ).once("value"),

    db.ref(
    "schools/"+schoolId+"/finance/depenses"
    ).once("value")

])

.then(([recettesSnap,depensesSnap])=>{

    let totalRecettes = 0;
    let totalDepenses = 0;

    let historique = [];

    // ===== RECETTES =====

    recettesSnap.forEach(item=>{

        let data = item.val();

        let montant = Number(data.montant)||0;

        totalRecettes += montant;

        historique.push({

            type:"📥 Recette",

            montant:montant,

            date:data.date||"",

            motif:data.motif||""

        });

    });

    // ===== DEPENSES =====

    depensesSnap.forEach(item=>{

        let data = item.val();

        let montant = Number(data.montant)||0;

        totalDepenses += montant;

        historique.push({

            type:"📤 Dépense",

            montant:montant,

            date:data.date||"",

            motif:data.motif||""

        });

    });

    let solde = totalRecettes-totalDepenses;

    let budget = totalRecettes>0
        ? Math.round((totalDepenses/totalRecettes)*100)
        : 0;

    document.getElementById(
    "totalRecettes"
    ).innerHTML=
    totalRecettes.toLocaleString()+" FC";

    document.getElementById(
    "totalDepenses"
    ).innerHTML=
    totalDepenses.toLocaleString()+" FC";

    document.getElementById(
    "soldeFinance"
    ).innerHTML=
    solde.toLocaleString()+" FC";

    document.getElementById(
    "budgetPourcent"
    ).innerHTML=
    budget+" %";

    // Trier par date décroissante

Type:"DEPENSE",

Date:d.date||"",

Heure:d.heure||"",

Categorie:d.categorie||"",

Motif:d.motif||"",

Montant:montant,

Observation:d.observation||""

});

function chargerHistoriqueFinance(){

let schoolId=window.currentSchoolId;

Promise.all([

db.ref(
"schools/"+schoolId+"/finance/recettes"
).once("value"),

db.ref(
"schools/"+schoolId+"/finance/depenses"
).once("value")

])

.then(([recettesSnap,depensesSnap])=>{

let liste=[];

let recettes=0;

let depenses=0;

recettesSnap.forEach(item=>{

let d=item.val();

recettes+=Number(d.montant)||0;

liste.push({

type:"Recette",

icon:"📥",

color:"green",

...d

});

});

depensesSnap.forEach(item=>{

let d=item.val();

depenses+=Number(d.montant)||0;

liste.push({

type:"Dépense",

icon:"📤",

color:"red",

...d

});

});

liste.sort(function(a,b){

return (b.createdAt||0)-(a.createdAt||0);

});

document.getElementById("histRecettes").innerHTML=
recettes.toLocaleString()+" FC";

document.getElementById("histDepenses").innerHTML=
depenses.toLocaleString()+" FC";

document.getElementById("histSolde").innerHTML=
(recettes-depenses).toLocaleString()+" FC";

document.getElementById("histNombre").innerHTML=
liste.length;

let html="";

liste.forEach(op=>{

html+=`

<div class="historyItem">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
">

<div>

<h3>

${op.icon} ${op.type}

</h3>

<b>

${op.motif}

</b>

<br>

${op.categorie}

<br>

${op.date}

${op.heure}

</div>

<div class="${op.color}">

${Number(op.montant).toLocaleString()} FC

</div>

</div>

</div>

`;

});

if(html===""){

html="<center>Aucune opération enregistrée.</center>";

}

document.getElementById(

"financeHistoriqueListe"

).innerHTML=html;

})

.catch(error=>{

alert(error.message);

});

}

function envoyerReunionParents(){

const classe=document.getElementById("classeReunion").value;
const date=document.getElementById("dateReunion").value;
const heure=document.getElementById("heureReunion").value;
const lieu=document.getElementById("lieuReunion").value;
const objet=document.getElementById("objetReunion").value;

if(!classe){
    alert("Veuillez choisir une classe.");
    return;
}

showLoader();

db.ref("schools/"+currentSchoolId+"/students")
.orderByChild("className")
.equalTo(classe)
.once("value")
.then(snap=>{

    let taches=[];
    let compteur=0;

    snap.forEach(e=>{

        let eleve=e.val();

        let telephones=[
            eleve.parentPhone,
            eleve.fatherPhone,
            eleve.motherPhone
        ];

        let uniques=[...new Set(
            telephones
            .map(p=>normalizePhone(p||""))
            .filter(p=>p)
        )];

        uniques.forEach(phone=>{

            compteur++;

            taches.push(

                db.ref(
                    "schools/"+currentSchoolId+
                    "/notifications/"+phone
                ).push({

                    type:"meeting",
                    title:"📅 Réunion des parents",

                    message:
                    "Votre présence est demandée pour une réunion.\n\n"+
                    "Classe : "+classe+
                    "\nDate : "+date+
                    "\nHeure : "+heure+
                    "\nLieu : "+lieu+
                    "\n\n"+
                    objet,

                    date:new Date().toLocaleString("fr-FR"),
                    read:false

                })

            );

        });

    });

    return Promise.all(taches).then(()=>{

        hideLoader();

        alert("Réunion envoyée à "+compteur+" parent(s).");

        ouvrirReunions();

    });

})
.catch(err=>{

    hideLoader();
    console.error(err);
    alert(err.message);

});

}

async function verifierCours(){

try{

if(window.currentRole!="teacher") return;

const snap=await db.ref(

"schools/"+window.currentSchoolId+

"/emploisTemps"

).once("value");

if(!snap.exists()) return;

let maintenant=new Date();

let jourActuel=maintenant.getDay();

let aujourdhui=[

"Dimanche",

"Lundi",

"Mardi",

"Mercredi",

"Jeudi",

"Vendredi",

"Samedi"

][jourActuel];

let minutesActuelles=

maintenant.getHours()*60+

maintenant.getMinutes();

snap.forEach(item=>{

let cours=item.val();

// Vérification du jour
if(cours.jourNumero!=null){

if(cours.jourNumero!=jourActuel) return;

}else{

if((cours.jour||"").trim()!=aujourdhui) return;

}

// Vérification de l'enseignant
if(

normalizePhone(cours.enseignantPhone)!=

normalizePhone(window.currentPhone)

){

return;

}

if(!cours.heureDebut || !cours.matiere) return;

let h=cours.heureDebut.split(":");

let debut=

parseInt(h[0])*60+

parseInt(h[1]);

let difference=

debut-minutesActuelles;

// ===== 10 minutes avant =====

if(

difference<=10 &&

difference>0 &&

localStorage.getItem(

"rappel10_"+item.key

)!="1"

){

afficherAlerteCours(

"⏰ Cours bientôt",

"Bonjour 👋<br><br>Dans <b>"+difference+

" minute(s)</b> vous aurez cours de <b>"+

cours.matiere+

"</b><br><br>🏫 Classe : <b>"+

cours.classe+

"</b><br>🚪 Salle : <b>"+

(cours.salle || "Salle non définie")+

"</b>"

);

localStorage.setItem(

"rappel10_"+item.key,

"1"

);

}

// ===== Heure exacte =====

if(

difference===0 &&

localStorage.getItem(

"rappel0_"+item.key

)!="1"

){

afficherAlerteCours(

"📚 Cours à commencer",

"Il est l'heure de commencer le cours de <b>"+

cours.matiere+

"</b><br><br>🏫 Classe : <b>"+

cours.classe+

"</b><br>🚪 Salle : <b>"+

(cours.salle || "Salle non définie")+

"</b>"

);

localStorage.setItem(

"rappel0_"+item.key,

"1"

);

}

// ===== Retard jusqu'à 10 minutes =====

if(

difference<0 &&

difference>=-10 &&

cours.statut!="En cours" &&

localStorage.getItem(

"retard_"+item.key

)!="1"

){

afficherAlerteCours(

"⚠️ Cours en retard",

"Votre cours de <b>"+

cours.matiere+

"</b> devait commencer il y a <b>"+

Math.abs(difference)+

" minute(s)</b>.<br><br>Pensez à démarrer le cours."

);

localStorage.setItem(

"retard_"+item.key,

"1"

);

}

});

}catch(err){

console.log(err);

}

}

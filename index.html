function updateTeacher(matricule,ancienTelephone){

showLoader();

let telephone=document.getElementById("telephone").value.replace(/\D/g,"");

if(telephone.startsWith("0")){
telephone=telephone.substring(1);
}

if(telephone && !telephone.startsWith("243")){
telephone="243"+telephone;
}

telephone=normalizePhone(telephone);

let data={

nom:document.getElementById("nom").value.trim(),

postnom:document.getElementById("postnom").value.trim(),

prenom:document.getElementById("prenom").value.trim(),

name:
document.getElementById("nom").value.trim()+" "+
document.getElementById("postnom").value.trim()+" "+
document.getElementById("prenom").value.trim(),

sexe:document.getElementById("sexe").value,

dateNaissance:document.getElementById("dateNaissance").value,

lieuNaissance:document.getElementById("lieuNaissance").value,

dateEngagement:document.getElementById("dateEngagement").value,

classe:document.getElementById("classeEns").value,

matiere:document.getElementById("matiere").value,

telephone:telephone,

adresse:document.getElementById("adresse").value

};

Promise.all([

db.ref("schools/"+window.currentSchoolId+"/teachers/"+matricule).update(data),

db.ref("schools/"+window.currentSchoolId+"/members/"+matricule).update({

name:data.name,

phone:telephone,

classe:data.classe

})

])

.then(()=>{

if(ancienTelephone!=telephone){

return db.ref("users/"+ancienTelephone)

.once("value")

.then(snapshot=>{

let user=snapshot.val();

if(user){

user.phone=telephone;
user.name=data.name;
user.classe=data.classe;

return db.ref("users/"+telephone)

.set(user)

.then(()=>{

return db.ref("users/"+ancienTelephone).remove();

});

}

});

}

return db.ref("users/"+telephone).update({

name:data.name,

phone:telephone,

classe:data.classe

});

})

.then(()=>{

hideLoader();

alert("Enseignant modifié avec succès.");

viewTeacher(matricule);

})

.catch(error=>{

hideLoader();

alert(error.message);

});

}


function normalizePhone(phone){

phone=(phone||"").replace(/\D/g,"");

if(phone.startsWith("0")){
phone=phone.substring(1);
}

if(phone && !phone.startsWith("243")){
phone="243"+phone;
}

return phone;

}

db.ref(
"schools/"+
schoolId+
"/finances/frais/"+
eleve.className
)

nouveauTotal=dejaPaye+montant;

0,
totalFrais-nouveauTotal

function enregistrerPaiementPersonnel(idPersonnel){

let salairePrevu=parseFloat(
document.getElementById("salairePrevu").value
)||0;

let prime=parseFloat(
document.getElementById("primePersonnel").value
)||0;

let avance=parseFloat(
document.getElementById("avancePersonnel").value
)||0;

let montantPaye=parseFloat(
document.getElementById("montantPersonnel").value
);

let date=document.getElementById("datePersonnel").value;

.getElementById("observationPersonnel")
.value.trim();

if(isNaN(montantPaye)||montantPaye<=0){

return;

}

showLoader();

db.ref(
"schools/"+window.currentSchoolId+
"/teachers/"+idPersonnel
)

.once("value")

.then(snapshot=>{

if(!snapshot.exists()){

throw new Error("Personnel introuvable.");

}

let personnel=snapshot.val();

let totalSalaire=salairePrevu+prime;

let reste=Math.max(
0,
totalSalaire-avance-montantPaye
);

// Toujours en attente tant que l'enseignant n'a pas confirmé
let statut="🟡 En attente de confirmation";

let paiementId="SAL-"+Date.now();

let paiement={

id:paiementId,

personnelId:idPersonnel,

name:personnel.name,

phone:personnel.telephone||"",

role:personnel.role||"Personnel",

salairePrevu:salairePrevu,

prime:prime,

avance:avance,

montantPaye:montantPaye,

reste:reste,

statut:statut,

date:date,

observation:observation,

timestamp:Date.now(),

caissier:window.currentPhone

};

let promesses=[];

// Historique des paiements
promesses.push(

db.ref(
"schools/"+window.currentSchoolId+
"/finances/paiementsPersonnel/"+
paiementId
).set(paiement)

);

// Historique personnel
promesses.push(

db.ref(
"schools/"+window.currentSchoolId+
"/teachers/"+
idPersonnel+
"/finance"
).update({

dernierPaiement:date,

montantPaye:montantPaye,

reste:reste,

statut:statut

})

);

let phonePersonnel=normalizePhone(personnel.telephone||"");

// Notification
if(phonePersonnel){

promesses.push(

db.ref(
"schools/"+window.currentSchoolId+
"/notifications/"+
phonePersonnel+
"/"+
Date.now()
).set({

title:"💰 Salaire enregistré",

message:

type:"salaire",

paiementId:paiementId,

read:false,

confirmed:false,

status:"en_attente",

date:date,

timestamp:Date.now()

})

);

}

return Promise.all(promesses);

})

function chargerDashboardFinance(){

let schoolId = window.currentSchoolId;

if(!schoolId){
    alert("École introuvable.");
    return;
}

Promise.all([

    db.ref(
    "schools/"+schoolId+"/finance/recettes"
    ).once("value"),

    db.ref(
    "schools/"+schoolId+"/finance/depenses"
    ).once("value")

])

.then(([recettesSnap,depensesSnap])=>{

    let totalRecettes = 0;
    let totalDepenses = 0;

    let historique = [];

    // ===== RECETTES =====

    recettesSnap.forEach(item=>{

        let data = item.val();

        let montant = Number(data.montant)||0;

        totalRecettes += montant;

        historique.push({

            type:"📥 Recette",

            montant:montant,

            date:data.date||"",

            motif:data.motif||""

        });

    });

    // ===== DEPENSES =====

    depensesSnap.forEach(item=>{

        let data = item.val();

        let montant = Number(data.montant)||0;

        totalDepenses += montant;

        historique.push({

            type:"📤 Dépense",

            montant:montant,

            date:data.date||"",

            motif:data.motif||""

        });

    });

    let solde = totalRecettes-totalDepenses;

    let budget = totalRecettes>0
        ? Math.round((totalDepenses/totalRecettes)*100)
        : 0;

    document.getElementById(
    "totalRecettes"
    ).innerHTML=
    totalRecettes.toLocaleString()+" FC";

    document.getElementById(
    "totalDepenses"
    ).innerHTML=
    totalDepenses.toLocaleString()+" FC";

    document.getElementById(
    "soldeFinance"
    ).innerHTML=
    solde.toLocaleString()+" FC";

    document.getElementById(
    "budgetPourcent"
    ).innerHTML=
    budget+" %";

    // Trier par date décroissante

    historique.sort((a,b)=>{

        return new Date(b.date)-new Date(a.date);

    });

    let html="";

    historique.slice(0,5).forEach(op=>{

        html+=`

        <div style="
        padding:10px;
        margin:8px 0;
        border-radius:12px;
        background:#f4f7ff;
        ">

        <b>${op.type}</b><br>

        ${op.motif}<br>

        <span style="color:#1f4cff;">

        ${op.montant.toLocaleString()} FC

        </span>

        </div>

        `;

    });

    if(html===""){

        html="<center>Aucune opération.</center>";

    }

    document.getElementById(
    "financeHistory"
    ).innerHTML=html;

    // Créer le graphique

    dessinerGraphiqueFinance(
        totalRecettes,
        totalDepenses
    );

})

.catch(error=>{

    alert(error.message);

});

}

function saveDepense(){

let schoolId=window.currentSchoolId;

if(!schoolId){
alert("École introuvable.");
return;
}

let motif=document.getElementById("depenseMotif").value.trim();

let categorie=document.getElementById("depenseCategorie").value;

let montant=parseFloat(
document.getElementById("depenseMontant").value
);

let observation=document.getElementById("depenseObservation").value.trim();

if(motif==""||isNaN(montant)||montant<=0){

alert("Complétez correctement les informations.");

return;

}

showLoader();

let id=db.ref(
"schools/"+schoolId+"/finance/depenses"
).push().key;

let data={

id:id,

motif:motif,

categorie:categorie,

montant:montant,

observation:observation,

date:new Date().toLocaleDateString(),

heure:new Date().toLocaleTimeString(),

createdAt:Date.now(),

createdBy:window.currentPhone

};

db.ref(
"schools/"+schoolId+"/finance/depenses/"+id
)

.set(data)

.then(()=>{

hideLoader();

alert("Dépense enregistrée.");

document.getElementById("depenseMotif").value="";
document.getElementById("depenseMontant").value="";
document.getElementById("depenseObservation").value="";

chargerDepenses();

})

.catch(error=>{

hideLoader();

alert(error.message);

});

}

async function genererNumeroRecu(){

let schoolId=window.currentSchoolId;

let compteurRef=db.ref(
"schools/"+schoolId+"/finance/compteurRecus"
);

let snap=await compteurRef.once("value");

let numero=(snap.val()||0)+1;

return "REC-"+annee+"-"+String(numero).padStart(6,"0");

}

function chargerHistoriqueFinance(){

let schoolId=window.currentSchoolId;

).once("value"),

db.ref(
"schools/"+schoolId+"/finance/depenses"
).once("value")

])

.then(([recettesSnap,depensesSnap])=>{

let liste=[];

let recettes=0;

let depenses=0;

recettesSnap.forEach(item=>{

let d=item.val();

recettes+=Number(d.montant)||0;

liste.push({

type:"Recette",

icon:"📥",

color:"green",

...d

});

});

depensesSnap.forEach(item=>{

let d=item.val();

depenses+=Number(d.montant)||0;

liste.push({

type:"Dépense",

icon:"📤",

color:"red",

...d

});

});

liste.sort(function(a,b){

return (b.createdAt||0)-(a.createdAt||0);

});

document.getElementById("histRecettes").innerHTML=
recettes.toLocaleString()+" FC";

document.getElementById("histDepenses").innerHTML=
depenses.toLocaleString()+" FC";

document.getElementById("histSolde").innerHTML=
(recettes-depenses).toLocaleString()+" FC";

liste.length;

}

).innerHTML=html;

})

    );

// ============================================================
// FORMAT DATE : YYYY-MM-DD  →  DD-MM-YYYY
// ============================================================

function formaterDateFR(date) {

    if (!date) {
        return "";
    }

    const valeur = String(date).trim();

    // Déjà au format DD-MM-YYYY
    if (
        /^\d{2}-\d{2}-\d{4}$/.test(valeur)
    ) {
        return valeur;
    }

    // Format YYYY-MM-DD
    if (
        /^\d{4}-\d{2}-\d{2}$/.test(valeur)
    ) {

        const parties =
            valeur.split("-");

        return (
            parties[2] +
            "-" +
            parties[1] +
            "-" +
            parties[0]
        );
    }

    // Autre format : on essaie avec Date
    const d = new Date(valeur);

    if (!isNaN(d.getTime())) {

        const jour =
            String(
                d.getDate()
            ).padStart(2, "0");

        const mois =
            String(
                d.getMonth() + 1
            ).padStart(2, "0");

        const annee =
            d.getFullYear();

        return (
            jour +
            "-" +
            mois +
            "-" +
            annee
        );
    }

    return valeur;
}

function envoyerReunionParents(){

const classe=document.getElementById("classeReunion").value;
const date=document.getElementById("dateReunion").value;
const heure=document.getElementById("heureReunion").value;
const lieu=document.getElementById("lieuReunion").value;
const objet=document.getElementById("objetReunion").value;

if(!classe){
    alert("Veuillez choisir une classe.");
    return;
}

showLoader();

db.ref("schools/"+currentSchoolId+"/students")
.orderByChild("className")
.equalTo(classe)
.once("value")
.then(snap=>{

    let taches=[];
    let compteur=0;

    snap.forEach(e=>{

        let eleve=e.val();

        let telephones=[
            eleve.parentPhone,
            eleve.fatherPhone,
            eleve.motherPhone
        ];

        let uniques=[...new Set(
            telephones
            .map(p=>normalizePhone(p||""))
            .filter(p=>p)
        )];

        uniques.forEach(phone=>{

            compteur++;

            taches.push(

                db.ref(
                    "schools/"+currentSchoolId+
                    "/notifications/"+phone
                ).push({

                    type:"meeting",
                    title:"📅 Réunion des parents",

                    message:
                    "Votre présence est demandée pour une réunion.\n\n"+
                    "Classe : "+classe+
                    "\nDate : "+date+
                    "\nHeure : "+heure+
                    "\nLieu : "+lieu+
                    "\n\n"+
                    objet,

                    date:new Date().toLocaleString("fr-FR"),
                    read:false

                })

            );

        });

    });

    return Promise.all(taches).then(()=>{

        hideLoader();

        alert("Réunion envoyée à "+compteur+" parent(s).");

        ouvrirReunions();

    });

})
.catch(err=>{

    hideLoader();
    console.error(err);
    alert(err.message);

});

}

// Vérifie toutes les 30 secondes
window.emploiTimer=setInterval(

verifierCours,

30000

);

}


async function verifierCours(){

try{

if(window.currentRole!="teacher") return;

const snap=await db.ref(

"schools/"+window.currentSchoolId+

"/emploisTemps"

).once("value");

if(!snap.exists()) return;

let maintenant=new Date();

let jourActuel=maintenant.getDay();

let aujourdhui=[

"Dimanche",

"Lundi",

"Mardi",

"Mercredi",

"Jeudi",

"Vendredi",

"Samedi"

][jourActuel];

let minutesActuelles=

maintenant.getHours()*60+

maintenant.getMinutes();

snap.forEach(item=>{

let cours=item.val();

// Vérification du jour
if(cours.jourNumero!=null){

if(cours.jourNumero!=jourActuel) return;

}else{

if((cours.jour||"").trim()!=aujourdhui) return;

}

// Vérification de l'enseignant
if(

normalizePhone(cours.enseignantPhone)!=

normalizePhone(window.currentPhone)

){

return;

}

if(!cours.heureDebut || !cours.matiere) return;

let h=cours.heureDebut.split(":");

let debut=

parseInt(h[0])*60+

parseInt(h[1]);

let difference=

debut-minutesActuelles;

// ===== 10 minutes avant =====

if(

difference<=10 &&

difference>0 &&

localStorage.getItem(

"rappel10_"+item.key

)!="1"

){

afficherAlerteCours(

"⏰ Cours bientôt",

"Bonjour 👋<br><br>Dans <b>"+difference+

" minute(s)</b> vous aurez cours de <b>"+

cours.matiere+

"</b><br><br>🏫 Classe : <b>"+

cours.classe+

"</b><br>🚪 Salle : <b>"+

(cours.salle || "Salle non définie")+

"</b>"

);

localStorage.setItem(

"rappel10_"+item.key,

"1"

);

}

// ===== Heure exacte =====

if(

difference===0 &&

localStorage.getItem(

"rappel0_"+item.key

)!="1"

){

afficherAlerteCours(

"📚 Cours à commencer",

"Il est l'heure de commencer le cours de <b>"+

cours.matiere+

"</b><br><br>🏫 Classe : <b>"+

cours.classe+

"</b><br>🚪 Salle : <b>"+

(cours.salle || "Salle non définie")+

"</b>"

);

localStorage.setItem(

"rappel0_"+item.key,

"1"

);

}

// ===== Retard jusqu'à 10 minutes =====

if(

difference<0 &&

difference>=-10 &&

cours.statut!="En cours" &&

localStorage.getItem(

"retard_"+item.key

)!="1"

){

afficherAlerteCours(

"⚠️ Cours en retard",

"Votre cours de <b>"+

cours.matiere+

"</b> devait commencer il y a <b>"+

Math.abs(difference)+

" minute(s)</b>.<br><br>Pensez à démarrer le cours."

);

localStorage.setItem(

"retard_"+item.key,

"1"

);

}

});

}catch(err){

console.log(err);

}

}


function surveillerEssai(){

if(window.surveillanceEssai){

    clearInterval(window.surveillanceEssai);

}

window.surveillanceEssai = setInterval(()=>{

    if(!window.currentSchoolId) return;

    db.ref("schools/"+window.currentSchoolId)
    .once("value")
    .then(snapshot=>{

        if(!snapshot.exists()) return;

        let school = snapshot.val();

        window.adminCache = school;

        if(!verifierEssai(school)){

    clearInterval(window.surveillanceEssai);

    localStorage.removeItem(
        "adminData_"+window.currentSchoolId
    );

    return;

}

    });

},5000); // toutes les 30 secondes

}

function telechargerHoraireWord(){

    const zone =
        document.getElementById(
            "grilleEmploiTemps"
        );

    if(!zone){
        alert(
            "Aucun emploi du temps à télécharger."
        );
        return;
    }

    const nom =
        obtenirNomClasseHoraire();

    const contenu = `

        <html>

        <head>
            <meta charset="UTF-8">
        </head>

        <body>

            <h2 style="text-align:center;">
                📅 EMPLOI DU TEMPS
            </h2>

            ${zone.innerHTML}

        </body>

        </html>

    `;


    const blob =
        new Blob(
            ["\ufeff", contenu],
            {
                type:
                "application/msword"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const lien =
        document.createElement("a");

    lien.href = url;

    lien.download =
        nom + ".doc";

    document.body.appendChild(lien);

    lien.click();

    document.body.removeChild(lien);

    URL.revokeObjectURL(url);

}

async function ouvrirAffectationEnseignantsPrimaire() {

    try {

        const schoolId =
            window.currentSchoolId;

        if (!schoolId) {

            hideLoader();

            alert(
                "École introuvable."
            );

            return;
        }


        const schoolSnap =
            await db.ref(
                "schools/" +
                schoolId
            ).once("value");


        const teachersSnap =
            await db.ref(
                "schools/" +
                schoolId +
                "/teachers"
            ).once("value");


        const school =
            schoolSnap.val() || {};


        const levels =
            school.levels || {};


        const primaire =
            levels.primary === true;


        const secondaire =
            levels.secondary === true;


        /*
         * Déterminer la section
         */

        let section =
            "primaire";


        if (
            secondaire &&
            !primaire
        ) {

            section =
                "secondaire";

        }


        window.typeAffectationHoraire =
            section;


        /*
         * ================================
         * RÉCUPÉRER LES CLASSES
         * ================================
         */

        let classes =
            school.classes || [];


        if (!Array.isArray(classes)) {

            const classesObjet =
                classes;

            classes = [];

            Object.keys(
                classesObjet
            ).forEach(function(key) {

                if (
                    classesObjet[key]
                ) {

                    classes.push(
                        String(
                            classesObjet[key]
                        )
                    );

                }

            });

        }


        /*
         * Garder uniquement les classes
         * correspondant à la section
         */

        if (
            section === "secondaire"
        ) {

            const classesSecondaire =
                [];

            for (
                let i = 0;
                i < classes.length;
                i++
            ) {

                const classe =
                    String(
                        classes[i]
                    );


                let trouve =
                    false;


                if (
                    typeof secondaryYears !==
                    "undefined"
                ) {

                    for (
                        let j = 0;
                        j < secondaryYears.length;
                        j++
                    ) {

                        if (
                            String(
                                secondaryYears[j]
                            ) === classe
                        ) {

                            trouve =
                                true;

                            break;

                        }

                    }

                }


                if (trouve) {

                    classesSecondaire.push(
                        classe
                    );

                }

            }


            if (
                classesSecondaire.length > 0
            ) {

                classes =
                    classesSecondaire;

            }

        }


        /*
         * Supprimer doublons
         */

        const classesFinales =
            [];

        for (
            let i = 0;
            i < classes.length;
            i++
        ) {

            if (
                !classesFinales.includes(
                    String(classes[i])
                )
            ) {

                classesFinales.push(
                    String(classes[i])
                );

            }

        }


        classes =
            classesFinales;


        classes.sort(
            function(a,b) {

                return a.localeCompare(
                    b,
                    undefined,
                    {
                        numeric:true
                    }
                );

            }
        );


        /*
         * ================================
         * ENSEIGNANTS
         * ================================
         */

        const enseignants =
            [];


        teachersSnap.forEach(
            function(item) {

                const t =
                    item.val() || {};


                const telephone =
                    t.telephone ||
                    item.key;


                const nomComplet =
                    (
                        t.nom || ""
                    ) +
                    " " +
                    (
                        t.postnom || ""
                    ) +
                    " " +
                    (
                        t.prenom || ""
                    );


                enseignants.push({

                    id:
                        telephone,

                    nom:
                        nomComplet.trim() ||
                        telephone

                });

            }
        );


        /*
         * ================================
         * AFFECTATIONS EXISTANTES
         * ================================
         */

        let cheminAffectation =
            "affectationsPrimaire";


        if (
            section === "secondaire"
        ) {

            cheminAffectation =
                "affectationsSecondaire";

        }


        const affectSnap =
            await db.ref(
                "schools/" +
                schoolId +
                "/" +
                cheminAffectation
            ).once("value");


        const affectations =
            affectSnap.val() || {};


        hideLoader();


        /*
         * ================================
         * INTERFACE
         * ================================
         */

        let titre =
            section === "secondaire"
            ? "📚 Classes secondaires"
            : "📚 Classes primaires";


        let texte =
            section === "secondaire"
            ? "Affectez l'enseignant titulaire de chaque classe secondaire."
            : "Affectez l'enseignant titulaire de chaque classe primaire.";


        let html = `

        <button
            class="back-btn"
            onclick="ouvrirEmploiTemps()"
        >
            ⬅ Retour
        </button>


        <h2 style="
            text-align:center;
            color:#1f4cff;
            margin-top:15px;
            margin-bottom:5px;
        ">
            ${titre}
        </h2>


        <div style="
            text-align:center;
            color:#666;
            font-size:13px;
            margin-bottom:15px;
        ">
            ${texte}
        </div>


        <div id="listeClassesPrimaire">
        `;


        if (
            classes.length === 0
        ) {

            html += `

                <div style="
                    text-align:center;
                    padding:20px;
                    color:#777;
                    background:#f5f5f5;
                    border-radius:12px;
                ">
                    ⚠️ Aucune classe configurée.
                </div>

            `;

        }


        for (
            let index = 0;
            index < classes.length;
            index++
        ) {

            const classe =
                classes[index];


            const affectation =
                affectations[classe] ||
                {};


            html += `

            <div style="
                background:white;
                border:1px solid #ddd;
                border-radius:14px;
                padding:12px;
                margin-bottom:10px;
            ">

                <div style="
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:8px;
">

    <div style="
        font-size:15px;
        font-weight:bold;
        color:#1f4cff;
        flex:1;
    ">
        📚 ${escapeHtmlHoraire(classe)}
    </div>

    <button
        type="button"
        onclick="ouvrirHoraireClasseDepuisAffectation('${escapeHtmlHoraire(classe)}')"
        style="
            border:none;
            background:transparent;
            color:#000;
            font-size:30px;
            font-weight:bold;
            padding:0 4px;
            margin:0;
            line-height:1;
            cursor:pointer;
        "
        title="Ouvrir l'horaire"
    >
        ➜
    </button>

</div>

                <div style="
                    font-size:12px;
                    font-weight:bold;
                    color:#555;
                    margin-bottom:5px;
                ">
                    👨‍🏫 Enseignant titulaire
                </div>


                <select
                    id="enseignantClasse_${index}"
                    data-classe="${escapeHtmlHoraire(classe)}"
                    style="
                        width:100%;
                        padding:11px;
                        border-radius:9px;
                        border:1px solid #ccc;
                        box-sizing:border-box;
                        background:white;
                    "
                >

                    <option value="">
                        Choisir l'enseignant
                    </option>

            `;


            for (
                let j = 0;

            ) {

                const enseignant =

                const selected =
                    String(
                        affectation.enseignant || ""
                    ) ===
                    String(
                        enseignant.id
                    )
                    ? "selected"
                    : "";


                html += `

                    <option
                        value="${escapeHtmlHoraire(
                            enseignant.id
                        )}"
                        ${selected}
                    >
                        ${escapeHtmlHoraire(
                            enseignant.nom
                        )}

                `;

            }


            html += `

                ${
                    affectation.enseignantNom
                    ? `
                    <div style="
                        margin-top:6px;
                        font-size:11px;
                        color:#2e7d32;

                        ✅ Titulaire :
                        ${escapeHtmlHoraire(
                            affectation.enseignantNom
                        )}
                    </div>
                    `
                    : ""
                }


            </div>

            `;

        }


        html += `

        </div>


        <button
            onclick="enregistrerAffectationsPrimaire()"
            style="

                margin-top:5px;
                padding:13px;
                border-radius:12px;
                background:#1f4cff;
                color:white;
                font-weight:bold;
                border:none;
                cursor:pointer;
            "
        >
            💾 Enregistrer les affectations
        </button>

        `;


        document.querySelector(
            ".login-box"
        ).innerHTML =
            html;


    }
    catch(error) {

        hideLoader();

        console.error(
            "Erreur affectation enseignants :",
            error
        );

        alert(
            "Impossible de charger les classes et les enseignants."
        );

    }

}

function ouvrirHoraireClasseDepuisAffectation(classe) {

    var section =
        window.typeAffectationHoraire || "primaire";

    if (section === "secondaire") {

        if (
            typeof ouvrirHoraireClasseSecondaire ===
            "function"
        ) {

            ouvrirHoraireClasseSecondaire(
                classe
            );

            return;
        }

    }

    if (
        typeof ouvrirHoraireClassePrimaire ===
        "function"
    ) {

        ouvrirHoraireClassePrimaire(
            classe
        );

        return;
    }

    alert(
        "La fonction d'ouverture de l'horaire est introuvable."
    );

}

async function ouvrirCoursPrimaire(idHeure, jour) {

    const classe =
        window.classeHorairePrimaireActuelle;

    if (!classe) {
        alert("Classe introuvable.");
        return;
    }


    const schoolId =
        window.currentSchoolId;

    if (!schoolId) {
        alert("École introuvable.");
        return;
    }


    try {

        /*
         * ==========================================
         * RÉCUPÉRER LA PLAGE HORAIRE COMMUNE
         * ==========================================
         */

        const snapshot =
            await db.ref(
                "schools/" +
                schoolId +
                "/horairesCommuns/heures/" +
                idHeure
            ).once("value");


        if (!snapshot.exists()) {

            alert(
                "Plage horaire introuvable dans les horaires communs."
            );

            return;
        }


        const ligne =
            snapshot.val() || {};


        /*
         * ==========================================
         * SI C'EST UNE PAUSE
         * ==========================================
         */

        if (ligne.type === "pause") {

            alert(
                "Cette plage est une pause / récréation."
            );

            return;
        }


        /*
         * ==========================================
         * AFFICHER LE FORMULAIRE
         * ==========================================
         */

        const matiere =
            prompt(
                "Matière pour " +
                jour +
                " :"
            );


        if (matiere === null) {
            return;
        }


        if (!matiere.trim()) {

            alert(
                "Veuillez entrer une matière."
            );

            return;
        }


        /*
         * ==========================================
         * ENREGISTRER LE COURS
         *
         * Les heures restent communes.
         * Le cours appartient uniquement
         * à la classe actuellement ouverte.
         * ==========================================
         */

        await db.ref(
            "schools/" +
            schoolId +
            "/emploisTempsPrimaire/" +
            encodeURIComponent(classe) +
            "/cours/" +
            idHeure +
            "/jours/" +
            jour
        ).set({

            matiere:
                matiere.trim(),

            jour:
                jour,

            classe:
                classe,

            heureDebut:
                ligne.heureDebut || "",

            heureFin:
                ligne.heureFin || "",

            createdAt:
                Date.now()

        });


        /*
         * ==========================================
         * MESSAGE
         * ==========================================
         */

        alert(
            "✅ Cours enregistré pour " +
            classe +
            " — " +
            jour
        );


        /*
         * ==========================================
         * RECHARGER LE TABLEAU
         * ==========================================
         */

        await ouvrirHoraireClassePrimaire(
            classe
        );


    }
    catch (error) {

        console.error(
            "Erreur ajout cours primaire :",
            error
        );

        alert(
            "❌ Erreur lors de l'enregistrement du cours."
        );

    }

}


async function enregistrerAffectationsPrimaire() {

    const schoolId =
        window.currentSchoolId;


    if (!schoolId) {

        alert(
            "École introuvable."
        );

        return;
    }


    const selects =
        document.querySelectorAll(
            "#listeClassesPrimaire select"
        );


    const affectations =
        {};


    selects.forEach(
        function(select) {

            const classe =
                select.getAttribute(
                    "data-classe"
                );


            const enseignant =
                select.value;


            if (
                classe &&
                enseignant
            ) {

                const option =
                    select.options[
                        select.selectedIndex
                    ];


                let nom =
                    "";


                if (option) {

                    nom =
                        option.textContent.trim();

                }


                affectations[classe] = {

                    enseignant:
                        enseignant,

                    enseignantNom:
                        nom

                };

            }

        }
    );


    if (
        Object.keys(
            affectations
        ).length === 0
    ) {

        alert(
            "Aucune affectation à enregistrer."
        );

        return;
    }


    let chemin =
        "affectationsPrimaire";


    if (
        window.typeAffectationHoraire ===
        "secondaire"
    ) {

        chemin =
            "affectationsSecondaire";

    }


    showLoader();


    try {

        await db.ref(
            "schools/" +
            schoolId +
            "/" +
            chemin
        ).set(
            affectations
        );


        hideLoader();


        if (
            window.typeAffectationHoraire ===
            "secondaire"
        ) {

            alert(
                "✅ Les enseignants titulaires des classes secondaires ont été affectés."
            );

        }
        else {

            alert(
                "✅ Les enseignants titulaires des classes primaires ont été affectés."
            );

        }


    }
    catch(error) {

        hideLoader();

        console.error(
            "Erreur enregistrement affectations :",
            error
        );

        alert(
            "Erreur lors de l'enregistrement."
        );

    }

}

            for (

                i++

                const classe =

                    ];

                ) {

                    break;

                }

            }

        }


        hideLoader();


        /*
         * ==========================================

         * ==========================================
         */

        if (

        ) {

            window.classeHoraireEnseignant =
                classeSecondaire;


            await afficherMonHoraireEnseignantSecondaire(
                classeSecondaire
            );


            return;

        }


        /*

         * ==========================================
         */

        showLoader();


        const snapPrimaire =
            await db.ref(

                clesPrimaire[i];

                affectationsPrimaire[
                    classe
                ];

            ) {

        }


        hideLoader();


        if (!maClasse) {

            alert(

            );

            return;

        window.classeHoraireEnseignant =

        await afficherMonHoraireEnseignantPrimaire(

async function partagerHorairePrimaire() {

    const tableau =
        document.getElementById(
            "tableauHorairePrimaire"
        );


    if (!tableau) {

        alert(
            "Le tableau de l'horaire est introuvable."
        );

        return;
    }


    const classe =
        window.classeHorairePrimaireActuelle ||
        "Classe primaire";


    /*
     * Utiliser le partage Android
     * si le navigateur le permet.
     */

    if (
        navigator.share
    ) {

        try {

            await navigator.share({

                title:
                    "Emploi du temps - " +
                    String(classe),

                text:
                    "Voici l'emploi du temps de " +
                    String(classe) +
                    "."

            });

            return;

        }
        catch (error) {

            /*
             * L'utilisateur peut avoir
             * annulé le partage.
             */

            if (
                error &&
                error.name === "AbortError"
            ) {

                return;

            }

            console.error(
                "Erreur partage :",
                error
            );

        }

    }


    /*
     * Si le téléphone ne possède pas
     * Web Share API : copier le texte.
     */

    let texte =
        "EMPLOI DU TEMPS\n\n" +
        String(classe) +
        "\n\n";


    const lignes =
        tableau.querySelectorAll(
            "tr"
        );


    lignes.forEach(ligne => {

        const cellules =
            ligne.querySelectorAll(
                "th, td"
            );


        let ligneTexte = "";


        cellules.forEach(cellule => {

            const valeur =
                cellule.innerText.trim();


            if (ligneTexte) {

                ligneTexte +=
                    " | ";

            }


            ligneTexte +=
                valeur;

        });


        if (ligneTexte) {

            texte +=
                ligneTexte +
                "\n";

        }

    });


    try {

        await navigator.clipboard.writeText(
            texte
        );


        alert(
            "L'horaire a été copié. " +
            "Vous pouvez maintenant le coller dans WhatsApp, Messenger, etc."
        );

    }
    catch (error) {

        console.error(
            "Erreur copie :",
            error
        );


        alert(
            "Le partage n'est pas disponible sur cet appareil."
        );

    }

}

function obtenirDonneesListeElevesExport() {

    const eleves =

        [];

    const colonnes = [
        "N°",
        "Matricule",
        "Nom",
        "Postnom",
        "Prénom",
        "Date naissance",
        "Lieu naissance",
        "Sexe",
        "Classe",

        "Mère",
        "Tél. mère",
        "Nationalité",
        "Province",
        "Territoire",
        "Secteur",
        "Tél. élève"
    ];

    const lignes = eleves.map((e, index) => {

        const option =
            e.option ||
            e.optionEtude ||
            e.options ||
            "-";

        return [

            index + 1,

            e.matricule || "-",

            e.nom || "",

            e.postnom || "",

            formaterDateFR(e.dateNaissance) || "-",

            e.province || "-",

window.horaireCoursEnseignantSurlignes = false;

function basculerCoursEnseignant() {

    if (
        window.horaireCoursEnseignantSurlignes === true
    ) {

        window.horaireCoursEnseignantSurlignes = false;

    }
    else {

        window.horaireCoursEnseignantSurlignes = true;

    }


    var cellules =
        document.querySelectorAll(
            ".celluleCoursEnseignant"
        );


    for (
        var i = 0;
        i < cellules.length;
        i++
    ) {

        var cellule =
            cellules[i];

        var concerne =
            cellule.getAttribute(
                "data-concerne"
            );


        if (
            window.horaireCoursEnseignantSurlignes === true &&
            concerne === "oui"
        ) {

   ============================================================ */

async function verifierNotificationsCaissierResponsable(){

    try{

        var schools =
            await masomoDoubleGetSchoolsForUser();


        if(
            !schools ||
            schools.length === 0
        ){

            return;

        }


        var nonLues =
            false;


        for(
            var i = 0;
            i < schools.length;
            i++
        ){

            var schoolId =
                schools[i].schoolId;


            if(!schoolId){

                continue;

            }


            /*
             * Messages du caissier
             */

            var messagesSnap =
                await db.ref(
                    "schools/" +
                    schoolId +
                    "/responsableMessages"
                ).once("value");


            if(
                messagesSnap.exists()
            ){

                messagesSnap.forEach(
                    function(item){

                        var m =
                            item.val() || {};


                        if(
                            (
                                m.fromRole ==
                                "cashier" ||
                                m.senderRole ==
                                "cashier"
                            ) &&
                            (
                                m.read === false ||
                                m.lu === false
                            )
                        ){

                            nonLues =
                                true;

                        }

                    }
                );

            }


            /*
             * Dossiers du caissier
             */

            var dossiersSnap =
                await db.ref(
                    "schools/" +
                    schoolId +
                    "/dossiersResponsable"
                ).once("value");


            if(
                dossiersSnap.exists()
            ){

                dossiersSnap.forEach(
                    function(item){

                        var d =
                            item.val() || {};


                        if(
                            (
                                d.sharedByRole ==
                                "cashier" ||
                                d.role ==
                                "cashier"
                            ) &&
                            (
                                d.read === false ||
                                d.lu === false
                            )
                        ){

                            nonLues =
                                true;

                        }

                    }
                );

            }

        }


        var badge =
            document.getElementById(
                "responsableCaissierNotificationDot"
            );


        if(badge){

            badge.style.display =
                nonLues
                ? "block"
                : "none";

        }

    }
    catch(error){

        console.error(
            "Erreur notification caissier :",
            error
        );

    }

}

/* ============================================================
   ECOUTE TEMPS REEL CAISSIER
   ============================================================ */

function demarrerNotificationsCaissierResponsable(){

    /*
     * On utilise un petit intervalle de vérification.
     *
     * Cela permet de fonctionner même lorsque plusieurs
     * écoles sont liées au même responsable.
     */

    if(
        window.responsableCaissierNotificationTimer
    ){

        clearInterval(
            window.responsableCaissierNotificationTimer
        );

    }


    verifierNotificationsCaissierResponsable();


    window.responsableCaissierNotificationTimer =
        setInterval(
            function(){

                verifierNotificationsCaissierResponsable();

            },
            5000
        );

}

/* ============================================================
   ENVOYER RÉPONSE AU CAISSIER
   ============================================================ */

async function responsableEnvoyerReponseCaissier(
    messageId,
    schoolId
){

    try{

        var field =
            document.getElementById(
                "responsableReponseCaissierText"
            );


        if(!field){

            return;

        }


        var text =
            field.value.trim();


        if(!text){

            alert(
                "Veuillez écrire une réponse."
            );

            field.focus();

            return;

        }


        var originalSnap =
            await db.ref(
                "schools/" +
                schoolId +
                "/responsableMessages/" +
                messageId
            ).once("value");


        var original =
            originalSnap.val() || {};


        var caissier =
            original.from;


        if(!caissier){

            alert(
                "Le numéro du caissier est introuvable."
            );

            return;

        }


        var responseId =
            db.ref().push().key;


        var response = {

            id:
                responseId,

            parentMessageId:
                messageId,

            subject:
                "Réponse : " +
                (
                    original.subject ||
                    "Message"
                ),

            message:
                text,

            from:
                normalizePhone(
                    window.currentPhone
                ),

            fromRole:
                "responsable",

            senderRole:
                "responsable",

            to:
                caissier,

            toRole:
                "cashier",

            schoolId:
                schoolId,

            section:
                original.section ||
                "",

            createdAt:
                Date.now(),

            read:
                false,

            lu:
                false,

            status:
                "nouveau"

        };


        showLoader();


        /*
         * Réponse visible par le caissier
         */

        await db.ref(
            "schools/" +
            schoolId +
            "/cashierMessages/" +
            responseId
        ).set(
            response
        );


        /*
         * Marquer le message original comme lu
         */

        await db.ref(
            "schools/" +
            schoolId +
            "/responsableMessages/" +
            messageId
        ).update({

            read:
                true,

            lu:
                true,

            status:
                "lu"

        });


        hideLoader();


        var modal =
            document.getElementById(
                "responsableReponseCaissierModal"
            );


        if(modal){
            modal.remove();
        }


        alert(
            "✅ Réponse envoyée au caissier."
        );


        responsableOuvrirCommunicationCaissier();

    }
    catch(error){

        hideLoader();

        console.error(
            "Erreur envoi réponse caissier :",
            error
        );

        alert(
            error.message ||
            "Impossible d'envoyer la réponse."
        );

    }

}

/* ============================================================
   MARQUER COMMUNICATIONS CAISSIER COMME LUES
   ============================================================ */

async function responsableMarquerCaissierCommunicationsLues(){

    try{

        var schools =
            await masomoDoubleGetSchoolsForUser();


        for(
            var i = 0;
            i < schools.length;
            i++
        ){

            var schoolId =
                schools[i].schoolId;


            if(!schoolId){
                continue;
            }


            /*
             * Messages
             */

            var messageSnap =
                await db.ref(
                    "schools/" +
                    schoolId +
                    "/responsableMessages"
                ).once("value");


            var messageData =
                messageSnap.val() || {};


            var messageIds =
                Object.keys(
                    messageData
                );


            for(
                var j = 0;
                j < messageIds.length;
                j++
            ){

                var message =
                    messageData[
                        messageIds[j]
                    ] || {};


                if(
                    message.fromRole ==
                    "cashier" ||
                    message.senderRole ==
                    "cashier"
                ){

                    if(
                        message.read === false ||
                        message.lu === false
                    ){

                        await db.ref(
                            "schools/" +
                            schoolId +
                            "/responsableMessages/" +
                            messageIds[j]
                        ).update({

                            read:
                                true,

                            lu:
                                true,

                            status:
                                "lu"

                        });

                    }

                }

            }


            /*
             * Dossiers
             */

            var dossierSnap =
                await db.ref(
                    "schools/" +
                    schoolId +
                    "/dossiersResponsable"
                ).once("value");


            var dossierData =
                dossierSnap.val() || {};


            var dossierIds =
                Object.keys(
                    dossierData
                );


            for(
                var k = 0;
                k < dossierIds.length;
                k++
            ){

                var dossier =
                    dossierData[
                        dossierIds[k]
                    ] || {};


                if(
                    dossier.sharedByRole ==
                    "cashier" ||
                    dossier.role ==
                    "cashier"
                ){

                    if(
                        dossier.read === false ||
                        dossier.lu === false
                    ){

                        await db.ref(
                            "schools/" +
                            schoolId +
                            "/dossiersResponsable/" +
                            dossierIds[k]
                        ).update({

                            read:
                                true,

                            lu:
                                true

                        });

                    }

                }

            }

        }


        verifierNotificationsCaissierResponsable();

    }
    catch(error){

        console.error(
            "Erreur marquage communication :",
            error
        );

    }

}

async function enregistrerResponsableCoursSecondaire() {

    const schoolId =
        window.currentSchoolId;


    if (!schoolId) {

        alert(
            "École introuvable."
        );

        return;
    }


    const select =
        document.getElementById(
            "enseignantResponsableCours"
        );


    if (!select) {

        alert(
            "Enseignant introuvable."
        );

        return;
    }


    const enseignant =
        select.value;


    if (!enseignant) {

        alert(
            "Veuillez choisir un enseignant."
        );

        return;
    }


    const option =
        select.options[
            select.selectedIndex
        ];


    let enseignantNom =
        "";


    if (option) {

        enseignantNom =
            option.textContent.trim();

    }


    const cases =
        document.querySelectorAll(
            ".cours-responsable"
        );


    const selection =
        [];


    for (
        let i = 0;
        i < cases.length;
        i++
    ) {

        if (
            cases[i].checked
        ) {

            selection.push(
                cases[i].value
            );

        }

    }


    if (
        selection.length === 0
    ) {

        alert(
            "Sélectionnez au moins un cours."
        );

        return;
    }


    showLoader();


    try {

        const updates =
            {};


        for (
            let i = 0;
            i < selection.length;
            i++
        ) {

            const id =
                selection[i];


            updates[
                "schools/" +
                schoolId +
                "/emploisTemps/" +
                id +
                "/responsableEnseignant"
            ] =
                enseignant;


            updates[
                "schools/" +
                schoolId +
                "/emploisTemps/" +
                id +
                "/responsableEnseignantNom"
            ] =
                enseignantNom;


            updates[
                "schools/" +
                schoolId +
                "/emploisTemps/" +
                id +
                "/responsableCours"
            ] =
                true;


            updates[
                "schools/" +
                schoolId +
                "/emploisTemps/" +
                id +
                "/responsableCoursAt"
            ] =
                Date.now();

        }


        await db.ref().update(
            updates
        );


        hideLoader();


        alert(
            "✅ " +
            selection.length +
            " cours ont été attribués à " +
            enseignantNom +
            "."
        );


        ouvrirResponsableCoursSecondaire();

    }
    catch(error) {

        hideLoader();

        console.error(
            "Erreur attribution cours :",
            error
        );

        alert(
            "Erreur lors de l'attribution des cours."
        );

    }

}


async function ouvrirResponsableCoursSecondaire() {

async function ouvrirCoursSecondaire(idHeure, jour) {

    try {

        const snap =
            await db.ref(

        if (!snap.exists()) {

            ligne.type === "pause"

// ============================================================
// ESPACE RESPONSABLE DE L'ÉCOLE
// Compatible avec une ou plusieurs écoles
// Permet de choisir l'école à gérer
// ============================================================

async function ouvrirEspaceResponsable(){

    showLoader();

    try{

        var phone =
            normalizePhone(
                window.currentPhone
            );


        if(!phone){

            throw new Error(
                "Numéro du responsable introuvable."
            );

        }


        var userSnap =
            await db.ref(
                "users/" +
                phone
            ).once("value");


        if(!userSnap.exists()){

            throw new Error(
                "Compte responsable introuvable."
            );

        }


        var user =
            userSnap.val();


        if(
            user.role != "responsable"
        ){

            throw new Error(
                "Ce compte n'est pas responsable."
            );

        }


        // ========================================================
        // RÉCUPÉRER LES ÉCOLES
        // ========================================================

        var schoolsAccess =
            user.schoolsAccess ||
            {};


        /*
         * Compatibilité avec les anciens comptes
         * possédant uniquement schoolId.
         */

        var accessKeys =
            Object.keys(
                schoolsAccess
            );


        if(
            accessKeys.length === 0 &&
            user.schoolId
        ){

            schoolsAccess[
                user.schoolId
            ] = {

                schoolId:
                    user.schoolId,

                active:
                    true

            };

        }


        var schoolIds =
            Object.keys(
                schoolsAccess
            );


        if(
            schoolIds.length === 0
        ){

            throw new Error(
                "Aucune école associée à ce responsable."
            );

        }


        // ========================================================
        // CHARGER LES ÉCOLES
        // ========================================================

        var ecoles = [];


        for(
            var i = 0;
            i < schoolIds.length;
            i++
        ){

            var schoolId =
                schoolIds[i];


            var access =
                schoolsAccess[
                    schoolId
                ] || {};


            /*
             * Ne pas afficher un accès désactivé
             */

            if(
                access.active === false
            ){

                continue;

            }


            var schoolSnap =
                await db.ref(
                    "schools/" +
                    schoolId
                ).once("value");


            if(
                !schoolSnap.exists()
            ){

                continue;

            }


            var school =
                schoolSnap.val() ||
                {};


            // ====================================================
            // DÉTERMINER LA SECTION
            // ====================================================

            var section =
                school.section ||
                "";


            if(!section){

                if(
                    school.levels &&
                    school.levels.primary === true
                ){

                    section =
                        "primaire";

                }
                else if(
                    school.levels &&
                    school.levels.secondary === true
                ){

                    section =
                        "secondaire";

                }

            }


            ecoles.push({

                schoolId:
                    schoolId,

                school:
                    school,

                section:
                    section,

                access:
                    access

            });

        }


        if(
            ecoles.length === 0
        ){

            throw new Error(
                "Les écoles associées sont introuvables."
            );

        }


        // ========================================================
        // VARIABLES GLOBALES
        // ========================================================

        window.currentPhone =
            phone;

        window.currentRole =
            "responsable";


        window.ecolesResponsable =
            ecoles;


        hideLoader();


        // ========================================================
        // ZONE D'AFFICHAGE
        // ========================================================

        var zone =
            document.querySelector(
                ".login-box"
            );


        if(!zone){

            alert(
                "Zone d'affichage introuvable."
            );

            return;

        }


        var html = `

            <div style="
                background:white;
                border-radius:20px;
                padding:20px;
            ">

                <h2 style="
                    text-align:center;
                    color:#1f4cff;
                    margin-top:0;
                ">
                    👨‍💼 Espace Responsable
                </h2>

                <p style="
                    text-align:center;
                    color:#666;
                    font-size:13px;
                ">
                    Sélectionnez l'école que vous
                    souhaitez gérer.
                </p>

        `;


        // ========================================================
        // AFFICHER LES ÉCOLES
        // ========================================================

        for(
            var j = 0;
            j < ecoles.length;
            j++
        ){

            var item =
                ecoles[j];


            var school =
                item.school;


            var nom =
                school.schoolName ||
                school.name ||
                "École";


            var sectionTexte =
                item.section ||
                "école";


            var couleurSection =
                "#1f4cff";


            if(
                item.section ==
                "secondaire"
            ){

                couleurSection =
                    "#7b1fa2";

            }


            html += `

                <div style="
                    border:1px solid #ddd;
                    border-radius:15px;
                    padding:15px;
                    margin-top:12px;
                    background:#f9faff;
                ">

                    <div style="
                        font-weight:bold;
                        font-size:16px;
                        color:${couleurSection};
                    ">
                        🏫 ${
                            escapeHtmlHoraire(
                                nom
                            )
                        }
                    </div>


                    <div style="
                        display:inline-block;
                        margin-top:7px;
                        padding:5px 9px;
                        border-radius:20px;
                        background:${couleurSection};
                        color:white;
                        font-size:11px;
                        font-weight:bold;
                    ">
                        ${
                            escapeHtmlHoraire(
                                sectionTexte
                            )
                        }
                    </div>


                    <button
                        onclick="selectionnerEcoleResponsable('${item.schoolId}')"
                        style="
                            width:100%;
                            margin-top:12px;
                            padding:12px;
                            border:none;
                            border-radius:10px;
                            background:#1f4cff;
                            color:white;
                            font-weight:bold;
                            cursor:pointer;
                        "
                    >
                        Ouvrir cette école
                    </button>

                </div>

            `;

        }


        html += `

            </div>

        `;


        zone.innerHTML =
            html;


    }
    catch(error){

        hideLoader();

        console.error(
            "Erreur espace responsable :",
            error
        );

        alert(
            error.message ||
            "Impossible d'ouvrir l'espace responsable."
        );

    }

}

function responsableFormatMoney(montant){

    montant =
        Number(montant) || 0;

    return montant
        .toLocaleString("fr-FR")
        .replace(/\u202f/g, " ")
        + " FC";

}


/* ============================================================
   ECHAPPER TEXTE
   ============================================================ */

function responsableSafeText(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* ============================================================
   VERIFIER NOTIFICATIONS RESPONSABLE
   ============================================================ */

function verifierNotificationsResponsable(){

    var phone =
        normalizePhone(
            window.currentPhone
        );

    var schoolId =
        window.currentSchoolId;

    if(
        !phone ||
        !schoolId
    ){

        return;

    }


    db.ref(
        "schools/" +
        schoolId +
        "/notifications/" +
        phone
    )
    .once("value")

    .then(function(snapshot){

        var badge =
            document.getElementById(
                "responsableNotificationDot"
            );

        if(!badge){

            return;

        }

        /*
         * Par défaut :
         * pas de point vert
         */

        badge.style.display =
            "none";


        if(
            !snapshot.exists()
        ){

            return;

        }


        var nonLues =
            false;


        snapshot.forEach(
            function(item){

                var notification =
                    item.val() || {};


                /*
                 * Ton application utilise
                 * plusieurs noms selon les modules :
                 *
                 * read
                 * lu
                 *
                 * On accepte les deux.
                 */

                if(
                    notification.read === false ||
                    notification.lu === false
                ){

                    nonLues =
                        true;

                }

            }
        );


        if(nonLues){

            badge.style.display =
                "block";

        }

    })

    .catch(function(error){

        console.log(
            "Notification responsable :",
            error
        );

    });

}

function demarrerNotificationsResponsable(){

            window.currentPhone

        window.currentSchoolId;

    if(
        !phone ||
        !schoolId
    ){

        return;

    /*

     */

    if(
        window.responsableNotificationListener
    ){

        db.ref(
            "schools/" +
            schoolId +
            "/notifications/" +
            phone
        )
        .off(
            "value",
            window.responsableNotificationListener
        );

    }


    window.responsableNotificationSchoolId =
        schoolId;


    window.responsableNotificationListener =
        function(snapshot){

            var badge =
                document.getElementById(
                    "responsableNotificationDot"
                );

            if(!badge){

                return;

            }


            badge.style.display =
                "none";


            if(
                !snapshot.exists()
            ){

                return;

            }


            var nonLues =
                false;


            snapshot.forEach(
                function(item){

                    var n =
                        item.val() || {};


                    if(
                        n.read === false ||
                        n.lu === false
                    ){

                        nonLues =
                            true;

                    }

                }
            );


            if(nonLues){

                badge.style.display =
                    "block";

            }

        };


    db.ref(
        "schools/" +
        schoolId +
        "/notifications/" +
        phone
    )

        "value",

    );

}

/* ============================================================
   RECUPERER STATISTIQUES RESPONSABLE
   ============================================================ */

function chargerStatistiquesResponsable(
    schoolId,
    callback
){

    var studentsRef =
        db.ref(
            "schools/" +
            schoolId +
            "/students"
        );


    var teachersRef =
        db.ref(
            "schools/" +
            schoolId +
            "/teachers"
        );


    var recettesRef =
        db.ref(
            "schools/" +
            schoolId +
            "/finance/recettes"
        );


    var depensesRef =
        db.ref(
            "schools/" +
            schoolId +
            "/finance/depenses"
        );


    Promise.all([

        studentsRef.once("value"),

        teachersRef.once("value"),

        recettesRef.once("value"),

        depensesRef.once("value")

    ])

    .then(function(resultats){

        var studentsSnap =
            resultats[0];

        var teachersSnap =
            resultats[1];

        var recettesSnap =
            resultats[2];

        var depensesSnap =
            resultats[3];


        var totalEleves =
            studentsSnap.numChildren();


        var totalEnseignants =
            teachersSnap.numChildren();


        var recettes =
            0;


        var depenses =
            0;


        recettesSnap.forEach(
            function(item){

                var data =
                    item.val() || {};


                recettes +=
                    Number(
                        data.montant ||
                        data.amount ||
                        data.montantPaye ||
                        0
                    ) || 0;

            }
        );


        depensesSnap.forEach(
            function(item){

                var data =
                    item.val() || {};


                depenses +=
                    Number(
                        data.montant ||
                        data.amount ||
                        0
                    ) || 0;

            }
        );


        var solde =
            recettes -
            depenses;


        /*
         * Présence :
         * on cherche les présences du jour.
         */

        var presenceRef =
            db.ref(
                "schools/" +
                schoolId +
                "/presences"
            );


        presenceRef
        .once("value")

        .then(function(presenceSnap){

            var totalPresence =
                0;

            var totalPresent =
                0;


            /*
             * Les structures peuvent
             * varier selon les classes.
             *
             * On parcourt les données
             * de manière prudente.
             */

            if(
                presenceSnap.exists()
            ){

                presenceSnap.forEach(
                    function(classeSnap){

                        classeSnap.forEach(
                            function(eleveSnap){

                                eleveSnap.forEach(
                                    function(dateSnap){

                                        var p =
                                            dateSnap.val() ||
                                            {};


                                        var date =
                                            p.date ||
                                            "";


                                        var today =
                                            new Date()
                                            .toLocaleDateString();


                                        if(
                                            date ==
                                            today
                                        ){

                                            totalPresence++;


                                            var statut =
                                                String(
                                                    p.statut ||
                                                    ""
                                                ).toLowerCase();


                                            if(
                                                statut ==
                                                "present" ||
                                                statut ==
                                                "présent"
                                            ){

                                                totalPresent++;

                                            }

                                        }

                                    }
                                );

                            }
                        );

                    }
                );

            }


            var tauxPresence =
                0;


            if(
                totalPresence > 0
            ){

                tauxPresence =
                    Math.round(
                        (
                            totalPresent /
                            totalPresence
                        ) *
                        100
                    );

            }


            callback({

                eleves:
                    totalEleves,

                enseignants:
                    totalEnseignants,

                recettes:
                    recettes,

                depenses:
                    depenses,

                solde:
                    solde,

                tauxPresence:
                    tauxPresence

            });

        })

        .catch(function(){

            callback({

                eleves:
                    totalEleves,

                enseignants:
                    totalEnseignants,

                recettes:
                    recettes,

                depenses:
                    depenses,

                solde:

            "/teachers"
        ).once("value"),

            "schools/" +

// ============================================================
// CHARGER LES ÉCOLES DU RESPONSABLE
// ============================================================

function chargerEcolesResponsable(schoolIds){

    showLoader();

    var promesses = [];

    for(
        var i = 0;
        i < schoolIds.length;
        i++
    ){

        promesses.push(

            db.ref(
                "schools/" +
                schoolIds[i]
            ).once("value")

        );

    }


    Promise.all(promesses)

    .then(function(resultats){

        hideLoader();

        var ecoles = [];

        for(
            var i = 0;
            i < resultats.length;
            i++
        ){

            var snapshot =
                resultats[i];

            if(
                snapshot.exists()
            ){

                var school =
                    snapshot.val() || {};

                school.schoolId =
                    schoolIds[i];

                ecoles.push(
                    school
                );

            }

        }


        if(ecoles.length === 0){

            alert(
                "Les écoles associées à ce compte sont introuvables."
            );

            return;

        }


        window.ecolesResponsable =
            ecoles;


        afficherEspaceResponsable(
            ecoles
        );

    })

    .catch(function(error){

        hideLoader();

        console.error(
            "Erreur chargement écoles responsable :",
            error
        );

        alert(
            error.message ||
            "Impossible de charger les écoles."
        );

    });

}

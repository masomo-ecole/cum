function chargerPhoto(inputId,imageId){

let file=
document.getElementById(
inputId
).files[0];

if(!file)return;

let reader=
new FileReader();

reader.onload=function(e){

let image=
document.getElementById(
imageId
);

image.src=
e.target.result;

image.style.display=
"block";

if(cropper){

cropper.destroy();

}

cropper=
new Cropper(

image,

{

aspectRatio:1,

viewMode:1,

zoomable:true,

rotatable:true

}

);

};

reader.readAsDataURL(file);

}


function enregistrerPhoto(){

if(!cropper){

return "";

}

currentPhoto=

cropper
.getCroppedCanvas()

.toDataURL(
"image/png"
);

return currentPhoto;

}

"phone"

"users/"+phone

}

else if(

"#continueBtn"

"page2"

function saveTeacher(){

showLoader();

let telephone=

document.getElementById(
"telephone"
)
.value
.replace(/\D/g,"");


// retirer 0 RDC

if(
telephone.startsWith("0")
){

telephone=
telephone.substring(1);

}


// ajouter +243 automatiquement

if(
telephone &&
!telephone.startsWith("243")
){

telephone=
"243"+telephone;

}

telephone=
"+"+telephone;


// matricule enseignant

let matricule=

"ENS-"+Date.now();

let data={

matricule,

nom:
document.getElementById(
"nom"
).value.trim(),

postnom:
document.getElementById(
"postnom"
).value.trim(),

prenom:
document.getElementById(
"prenom"
).value.trim(),

name:

document.getElementById(
"nom"
).value.trim()

+" "+

document.getElementById(
"postnom"
).value.trim()

+" "+

document.getElementById(
"prenom"
).value.trim(),

role:"teacher",

sexe:
document.getElementById(
"sexe"
).value,

dateNaissance:
document.getElementById(
"dateNaissance"
).value,

lieuNaissance:
document.getElementById(
"lieuNaissance"
).value,

dateEngagement:
document.getElementById(
"dateEngagement"
).value,

matiere:
document.getElementById(
"matiere"
).value,

telephone:
telephone,

adresse:
document.getElementById(
"adresse"
).value,

schoolId:
window.currentSchoolId,

createdAt:
Date.now()

};


let promises=[];


// enregistrer fiche enseignant

promises.push(

db.ref(
"enseignants/"+matricule
)

.set(data)

);


// ajouter dans membres école

promises.push(

db.ref(
"schools/"
+
window.currentSchoolId+
"/members/"
+
matricule
)

.set({

name:
data.name,

phone:
telephone,

role:
"teacher",

matricule:
matricule,

createdAt:
Date.now()

})

);


// créer compte utilisateur connecté

if(telephone){

promises.push(

db.ref(
"users/"+telephone
)

.set({

phone:
telephone,

name:
data.name,

role:
"teacher",

schoolId:
window.currentSchoolId,

matricule:
matricule,

createdAt:
Date.now()

})

);

}


Promise.all(
promises
)

.then(()=>{

hideLoader();

alert(
"Enseignant enregistré avec succès"
);

teacherRecords();

})

.catch(error=>{

hideLoader();

alert(
error.message
);

});

function validatePhone(){

const input=
document.getElementById("phone");

const country=
document.getElementById("countryCode");

const btn=
document.getElementById("continueBtn");

const status=
document.getElementById("phoneStatus");


if(
!input ||
!country ||
!btn ||
!status
){
return;
}


// garder uniquement chiffres

let number=
input.value.replace(/\D/g,"");


// traitement RDC

if(

country.value==="+243" &&
number.startsWith("0")

){

number=
number.substring(1);

}


// limites

const maxLength=

country.value==="+243"
?9
:15;

number=
number.substring(0,maxLength);

input.value=
number;


// validation

const isValid=

country.value==="+243"
?number.length===9
:number.length>=6;


// mise à jour interface

btn.disabled=!isValid;

btn.classList.toggle(
"active",
isValid
);

input.classList.toggle(
"validInput",
isValid
);


status.innerHTML=

isValid
?"✓ Numéro valide"
:"Numéro incomplet";


status.style.color=

isValid
?"green"
:"#777";

}

async function telechargerPDF(){

let element=

document.getElementById(
"ficheDocument"
);

let canvas=

await html2canvas(
element
);

let image=

canvas.toDataURL(
"image/png"
);

const{

jsPDF

}=window.jspdf;

let pdf=

new jsPDF();

pdf.addImage(

image,

"PNG",

10,

10,

180,

0

);

pdf.save(
"fiche.pdf"
);

}

function telechargerWord(){

let contenu=

document.getElementById(
"ficheDocument"
).innerText;

const doc=

new docx.Document({

sections:[{

children:[

new docx.Paragraph({

text:contenu

})

]

}]

});

docx.Packer

.toBlob(doc)

.then(blob=>{

saveAs(

blob,

"fiche.docx"

);

});

}


function telechargerExcel(){

let texte=

document.getElementById(
"ficheDocument"
).innerText;

let lignes=

texte.split("\n");

let data=[];

lignes.forEach(l=>{

data.push({

Information:l

});

});

let feuille=

XLSX.utils.json_to_sheet(
data
);

let classeur=

XLSX.utils.book_new();

XLSX.utils.book_append_sheet(

classeur,

feuille,

"Fiche"

);

XLSX.writeFile(

classeur,

"fiche.xlsx"

);

}

function enregistrerModificationEnseignant(
matricule
){

db.ref(
"enseignants/"+matricule
)

.update({

matiere:
document.getElementById(
"matiere"
).value,

telephone:
document.getElementById(
"telephone"
).value

})

.then(()=>{

alert(
"Modification enregistrée"
);

voirFicheEnseignant(
matricule
);

});

}

function supprimerEnseignant(
matricule
){

if(
!confirm(
"Supprimer enseignant ?"
)
){
return;
}

db.ref(
"enseignants/"+matricule
)

.remove()

.then(()=>{

alert(
"Enseignant supprimé"
);

ouvrirListeEnseignants();

});

}

return;

}

function openMembers(){
    
    let cache=localStorage.getItem("membersCache");

if(cache){

    window.schoolUsersCache=JSON.parse(cache);

    schoolUsersCache=window.schoolUsersCache;

    drawMembers();

    showMembers(false);

    return;

}

    // Si les membres sont déjà en mémoire
    if(window.schoolUsersCache){

        schoolUsersCache = window.schoolUsersCache;

        drawMembers();

        showMembers(false);

        return;

    }

    showLoader();

    showMembers();

}
// ============================================================
// GÉNÉRER UNE INVITATION
//
// Enseignant : TEA + 4 caractères = 7 caractères
// Parent      : PAR + 4 caractères = 7 caractères
// Élève       : STU + 4 caractères = 7 caractères
// Caissier    : CAI + 7 caractères = 10 caractères
//
// Responsable : RES + 7 caractères = 10 caractères
//
// IMPORTANT :
// Pour le responsable, on ne crée JAMAIS son compte ici.
// Une demande est envoyée à MASOMO-ECOLE.
// Après validation, le code RES apparaît.
// Le futur responsable utilisera ensuite son propre numéro.
// ============================================================

async function generateInvite(){

    var phone =
        window.currentPhone;

    var roleElement =
        document.getElementById(
            "roleType"
        );


    if(!roleElement){

        alert(
            "Type d'invitation introuvable."
        );

        return;

    }


    var role =
        roleElement.value;


    if(!phone){

        alert(
            "Administrateur introuvable."
        );

        return;

    }


    showLoader();


    try{

        /*
         * =====================================================
         * VÉRIFIER L'ADMINISTRATEUR
         * =====================================================
         */

        var adminSnap =
            await db.ref(
                "users/" + phone
            ).once("value");


        if(!adminSnap.exists()){

            throw new Error(
                "Administrateur introuvable."
            );

        }


        var admin =
            adminSnap.val() || {};


        if(admin.role != "admin"){

            throw new Error(
                "Seul l'administrateur de l'école peut générer une invitation."
            );

        }


        var schoolId =
            admin.schoolId;


        if(!schoolId){

            throw new Error(
                "École introuvable."
            );

        }


        /*
         * =====================================================
         * RÉCUPÉRER L'ÉCOLE
         * =====================================================
         */

        var schoolSnap =
            await db.ref(
                "schools/" +
                schoolId
            ).once("value");


        if(!schoolSnap.exists()){

            throw new Error(
                "École introuvable."
            );

        }


        var school =
            schoolSnap.val() || {};


        /*
         * =====================================================
         * RESPONSABLE
         *
         * NE PAS CRÉER LE COMPTE
         *
         * On crée uniquement une demande pour
         * MASOMO-ECOLE.
         * =====================================================
         */

        if(role == "responsable"){

            /*
             * Vérifier s'il existe déjà une demande
             * en attente pour cette école.
             */

            var demandesSnap =
                await db.ref(
                    "responsableRequests"
                ).once("value");


            var demandeExistante =
                false;


            demandesSnap.forEach(
                function(item){

                    var demande =
                        item.val() || {};


                    if(
                        demande.schoolId ==
                        schoolId &&

                        demande.statut ==
                        "pending"
                    ){

                        demandeExistante =
                            true;

                    }

                }
            );


            if(demandeExistante){

                throw new Error(
                    "Une demande de responsable est déjà en attente pour cette école."
                );

            }


            /*
             * =================================================
             * DÉTERMINER LA SECTION
             * =================================================
             */

            var section =
                school.section || "";


            /*
             * Compatibilité anciennes écoles
             */

            if(!section){

                if(
                    school.levels &&
                    school.levels.primary === true
                ){

                    section =
                        "primaire";

                }
                else if(
                    school.levels &&
                    school.levels.secondary === true
                ){

                    section =
                        "secondaire";

                }

            }


            /*
             * =================================================
             * CRÉER LA DEMANDE
             * =================================================
             */

            var demandeRef =
                db.ref(
                    "responsableRequests"
                ).push();


            var demandeId =
                demandeRef.key;


            await demandeRef.set({

                demandeId:
                    demandeId,

                schoolId:
                    schoolId,

                schoolName:
                    school.schoolName ||
                    "",

                section:
                    section,

                role:
                    "responsable",

                demandePar:
                    phone,

                demandeParPhone:
                    phone,

                demandeParNom:
                    admin.name ||
                    admin.nom ||
                    admin.directorName ||
                    "",

                statut:
                    "pending",

                inviteCode:
                    "",

                createdAt:
                    Date.now(),

                validatedBy:
                    "",

                validatedAt:
                    0

            });


            hideLoader();


            /*
             * =================================================
             * AFFICHER L'ÉTAT EN ATTENTE
             * =================================================
             */

            var zone =
                document.getElementById(
                    "generatedInvite"
                );


            if(zone){

                zone.style.display =
                    "block";


                zone.innerHTML = `

                    <div style="
                        background:#fff8e1;
                        border:1px solid #ffcc80;
                        border-radius:12px;
                        padding:15px;
                        text-align:center;
                    ">

                        <h3 style="
                            color:#ef6c00;
                            margin-top:0;
                        ">
                            ⏳ Demande envoyée
                        </h3>


                        <p style="
                            font-size:13px;
                            color:#555;
                            line-height:1.5;
                        ">
                            La demande de responsable
                            de cette école a été envoyée
                            à MASOMO-ECOLE pour contrôle.
                        </p>


                        <p style="
                            font-size:13px;
                            color:#555;
                            margin-bottom:5px;
                        ">
                            École :
                            <b>
                                ${escapeHtmlHoraire(
                                    school.schoolName ||
                                    ""
                                )}
                            </b>
                        </p>


                        <p style="
                            font-size:13px;
                            color:#555;
                            margin-bottom:5px;
                        ">
                            Section :
                            <b>
                                ${escapeHtmlHoraire(
                                    section ||
                                    "Non définie"
                                )}
                            </b>
                        </p>


                        <p style="
                            font-size:12px;
                            color:#777;
                            margin-bottom:0;
                        ">
                            Le code RES apparaîtra ici
                            après validation par
                            MASOMO-ECOLE.
                        </p>

                    </div>

                `;

            }


            /*
             * =================================================
             * SURVEILLER LA VALIDATION
             * =================================================
             */

            surveillerValidationResponsable(
                demandeId
            );


            return;

        }


        /*
         * =====================================================
         * AUTRES RÔLES
         * =====================================================
         */

        var prefix =
            "INV";


        var longueur =
            7;


        if(role == "teacher"){

            prefix =
                "TEA";

            longueur =
                7;

        }
        else if(role == "parent"){

            prefix =
                "PAR";

            longueur =
                7;

        }
        else if(role == "student"){

            prefix =
                "STU";

            longueur =
                7;

        }
        else if(role == "cashier"){

            prefix =
                "CAI";

            longueur =
                10;

        }
        else{

            throw new Error(
                "Type d'invitation inconnu."
            );

        }


        /*
         * =====================================================
         * CARACTÈRES DU CODE
         * =====================================================
         */

        var caracteres =
            "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


        var inviteCode =
            prefix;


        while(
            inviteCode.length <
            longueur
        ){

            var index =
                Math.floor(
                    Math.random() *
                    caracteres.length
                );


            inviteCode +=
                caracteres.charAt(
                    index
                );

        }


        /*
         * =====================================================
         * VÉRIFIER L'UNICITÉ
         * =====================================================
         */

        var codeSnap =
            await db.ref(
                "invitations/" +
                inviteCode
            ).once("value");


        if(codeSnap.exists()){

            hideLoader();


            alert(
                "Un code identique existe déjà. " +
                "Veuillez générer à nouveau."
            );


            return;

        }


        /*
         * =====================================================
         * ENREGISTRER L'INVITATION
         * =====================================================
         */

        await db.ref(
            "invitations/" +
            inviteCode
        ).set({

            code:
                inviteCode,

            schoolId:
                schoolId,

            role:
                role,

            used:
                false,

            usedBy:
                "",

            usedAt:
                0,

            approved:
                true,

            createdAt:
                Date.now()

        });


        hideLoader();


        /*
         * =====================================================
         * AFFICHER LE CODE
         * =====================================================
         */

        var zone2 =
            document.getElementById(
                "generatedInvite"
            );


        if(zone2){

            zone2.style.display =
                "block";


            var nomRole =
                "";


            if(role == "teacher"){

                nomRole =
                    "Enseignant";

            }
            else if(role == "parent"){

                nomRole =
                    "Parent";

            }
            else if(role == "student"){

                nomRole =
                    "Élève";

            }
            else if(role == "cashier"){

                nomRole =
                    "Caissier";

            }


            zone2.innerHTML = `

                <div style="
                    background:#f5f7ff;
                    border:1px solid #dce3ff;
                    border-radius:12px;
                    padding:15px;
                    text-align:center;
                ">

                    <p style="
                        margin:0 0 8px 0;
                        font-weight:bold;
                    ">
                        Code ${nomRole}
                    </p>


                    <h2 style="
                        color:#1f4cff;
                        margin:8px 0;
                        letter-spacing:2px;
                    ">
                        ${inviteCode}
                    </h2>

                </div>

            `;

        }

    }
    catch(error){

        hideLoader();


        console.error(
            "Erreur génération invitation :",
            error
        );


        alert(
            error.message ||
            "Erreur lors de la génération."
        );

    }

}





function surveillerValidationResponsable(
    demandeId
){

    if(
        window.responsableValidationListener
    ){

        db.ref(
            "responsableRequests/" +
            window.responsableValidationListener
        ).off(
            "value"
        );

    }


    window.responsableValidationListener =
        demandeId;


    db.ref(
        "responsableRequests/" +
        demandeId
    ).on(
        "value",
        function(snapshot){

            if(
                !snapshot.exists()
            ){

                return;

            }


            const demande =
                snapshot.val();


            if(
                demande.statut !==
                "approved"
            ){

                return;

            }


            const code =
                demande.inviteCode;


            if(!code){

                return;

            }


            const zone =
                document.getElementById(
                    "generatedInvite"
                );


            if(!zone){

                return;

            }


            zone.style.display =
                "block";


            zone.innerHTML = `

                <div style="
                    background:#e8f5e9;
                    border:1px solid #81c784;
                    border-radius:12px;
                    padding:15px;
                    text-align:center;
                ">

                    <h3 style="
                        color:#2e7d32;
                        margin-top:0;
                    ">
                        ✅ Responsable autorisé
                    </h3>

                    <p style="
                        font-size:13px;
                        color:#555;
                    ">
                        Le contrôle MASOMO-ECOLE
                        a validé la demande.
                    </p>

                    <p style="
                        margin-bottom:5px;
                        font-weight:bold;
                    ">
                        Code à remettre au responsable :
                    </p>

                    <h2 style="
                        color:#1f4cff;
                        letter-spacing:3px;
                        margin:8px 0;
                    ">
                        ${code}
                    </h2>

                    <p style="
                        font-size:12px;
                        color:#777;
                    ">
                        Le futur responsable doit entrer
                        son propre numéro puis choisir
                        « Rejoindre une école ».
                    </p>

                </div>

            `;


            db.ref(
                "responsableRequests/" +
                demandeId
            ).off("value");

        }
    );

}

function confirmJoin(){

    const element =
        document.getElementById(
            "inviteCode"
        );

    if(!element){

        alert(
            "Champ du code introuvable."
        );

        return;
    }


    const code =
        element.value
        .trim()
        .toUpperCase();


    if(code == ""){

        alert(
            "Veuillez saisir le code d'invitation."
        );

        return;
    }


    showLoader();


    db.ref(
        "invitations/" +
        code
    )
    .once("value")
    .then(function(snapshot){

        hideLoader();


        if(!snapshot.exists()){

            alert(
                "Code d'invitation invalide."
            );

            return;
        }


        const invite =
            snapshot.val();


        if(invite.used){

            alert(
                "Ce code d'invitation a déjà été utilisé."
            );

            return;
        }


        if(
            invite.role != "teacher" &&
            invite.role != "student" &&
            invite.role != "parent" &&
            invite.role != "cashier" &&
            invite.role != "responsable"
        ){

            alert(
                "Invitation invalide."
            );

            return;
        }


        invite.code =
            code;


        window.currentInvite =
            invite;


        // ====================================================
        // PARENT
        // ====================================================

        if(invite.role == "parent"){

            document.querySelector(
                ".login-box"
            ).innerHTML = `

                <h2>
                    Compléter le profil
                </h2>

                <input
                    id="matricule"
                    placeholder="Matricule de l'élève"
                >

                <input
                    id="joinPassword"
                    type="password"
                    placeholder="Choisissez votre mot de passe"
                >

                <button
                    onclick="finishJoin()"
                >
                    Terminer
                </button>

            `;

            return;
        }


        // ====================================================
        // ENSEIGNANT
        // ====================================================

        if(invite.role == "teacher"){

            document.querySelector(
                ".login-box"
            ).innerHTML = `

                <h2>
                    Créer votre mot de passe
                </h2>

                <input
                    id="joinPassword"
                    type="password"
                    placeholder="Choisissez votre mot de passe"
                >

                <button
                    onclick="finishJoin()"
                >
                    Terminer
                </button>

            `;

            return;
        }


        // ====================================================
        // ÉLÈVE
        // ====================================================

        if(invite.role == "student"){

            document.querySelector(
                ".login-box"
            ).innerHTML = `

                <h2>
                    Créer votre mot de passe
                </h2>

                <input
                    id="joinPassword"
                    type="password"
                    placeholder="Choisissez votre mot de passe"
                >

                <button
                    onclick="finishJoin()"
                >
                    Terminer
                </button>

            `;

            return;
        }


        // ====================================================
        // RESPONSABLE / CAISSIER
        // ====================================================

        if(
            invite.role == "responsable" ||
            invite.role == "cashier"
        ){

            const titre =
                invite.role == "responsable"
                ? "👨‍💼 Rejoindre comme responsable"
                : "💰 Rejoindre comme caissier";


            document.querySelector(
                ".login-box"
            ).innerHTML = `

                <h2 style="
                    text-align:center;
                    color:#1f4cff;
                ">
                    ${titre}
                </h2>

                <p style="
                    text-align:center;
                    color:#666;
                ">
                    Vous allez rejoindre une école.
                </p>

                <input
                    id="joinPassword"
                    type="password"
                    placeholder="Créez votre mot de passe"
                >

                <button
                    onclick="finishJoin()"
                >
                    Continuer
                </button>

            `;

            return;
        }


        finishJoin();

    })
    .catch(function(error){

        hideLoader();

        console.error(

function validatePhone(){

    const input = document.getElementById("phone");
    const country = document.getElementById("countryCode");
    const btn = document.getElementById("continueBtn");
    const status = document.getElementById("phoneStatus");

    if(!input || !country || !btn || !status){
        return;
    }

    // Garder uniquement les chiffres
    let number = input.value.replace(/\D/g, "");

    // =========================
    // RDC : +243
    // =========================

    if(country.value === "+243"){

        // Si l'utilisateur écrit 0XXXXXXXXX
        // on retire automatiquement le 0
        if(number.startsWith("0")){
            number = number.substring(1);
        }

        // Maximum 9 chiffres
        number = number.substring(0, 9);

        input.value = number;

        // Exactement 9 chiffres
        if(number.length === 9){

    btn.disabled = false;

    btn.classList.add("active");

    btn.style.opacity = "1";
    btn.style.filter = "none";
    btn.style.pointerEvents = "auto";
    btn.style.cursor = "pointer";
    btn.style.background = "#1f4cff";

    status.innerHTML = "✓ Numéro valide";
    status.style.color = "green";

}else{

    btn.disabled = true;

    btn.classList.remove("active");

    btn.style.opacity = "0.5";
    btn.style.filter = "blur(.5px)";
    btn.style.pointerEvents = "none";
    btn.style.cursor = "not-allowed";
    btn.style.background = "#9bb5ff";

    status.innerHTML =
        "Entrez votre numéro (" +
        number.length +
        "/9)";

    status.style.color = "#777";
}

        return;
    }

    // =========================
    // Autres pays
    // =========================

    number = number.substring(0, 15);

    input.value = number;

    const valid = number.length >= 6;

    btn.disabled = !valid;

    btn.style.opacity = valid ? "1" : "0.5";
    btn.style.cursor = valid ? "pointer" : "not-allowed";
    btn.style.background =
        valid ? "#1f4cff" : "#9bb5ff";

    status.innerHTML =
        valid
        ? "✓ Numéro valide"
        : "Numéro incomplet";

    status.style.color =
        valid ? "green" : "#777";
}

// ============================================================
// CRÉATION D'UNE ÉCOLE
// Une école possède UNE SEULE section : primaire OU secondaire
// ============================================================

async function registerSchool(){

    try{

        showLoader();


        // ====================================================
        // RÉCUPÉRER LES CHAMPS
        // ====================================================

        function valeurChamp(id){

            var element =
                document.getElementById(id);

            if(!element){

                return "";

            }

            if(element.value){

                return element.value.trim();

            }

            return "";

        }


        var schoolName =
            valeurChamp("schoolName");

        var schoolMotto =
            valeurChamp("schoolMotto");

        var schoolPhone =
            valeurChamp("schoolPhone");

        var directorName =
            valeurChamp("directorName");

        var adminPassword =
            valeurChamp("adminPassword");

        var email =
            valeurChamp("email");

        var schoolAddress =
            valeurChamp("schoolAddress");

        var province =
            valeurChamp("province");

        var territoire =
            valeurChamp("territoire");

        var commune =
            valeurChamp("commune");

        var schoolYear =
            valeurChamp("schoolYear");


        // ====================================================
        // VÉRIFIER LES CHAMPS OBLIGATOIRES
        // ====================================================

        var missing = [];


        if(!schoolName){

            missing.push(
                "Nom école"
            );

        }


        if(!directorName){

            missing.push(
                "Nom directeur"
            );

        }


        if(!schoolPhone){

            missing.push(
                "Téléphone école"
            );

        }


        if(!schoolAddress){

            missing.push(
                "Adresse"
            );

        }


        if(!email){

            missing.push(
                "E-mail"
            );

        }


        if(!adminPassword){

            missing.push(
                "Mot de passe administrateur"
            );

        }


        if(missing.length > 0){

            hideLoader();

            alert(
                "Complétez :\n\n" +
                missing.join("\n")
            );

            return;

        }


        // ====================================================
        // NIVEAU DE L'ÉCOLE
        // UNE SEULE SECTION AUTORISÉE
        // ====================================================

        var primary = false;
        var secondary = false;


        var primaryElement =
            document.getElementById(
                "primaryLevel"
            );


        if(primaryElement){

            primary =
                primaryElement.checked;

        }


        var secondaryElement =
            document.getElementById(
                "secondaryLevel"
            );


        if(secondaryElement){

            secondary =
                secondaryElement.checked;

        }


        // ====================================================
        // EMPÊCHER PRIMAIRE + SECONDAIRE
        // ====================================================

        if(
            primary &&
            secondary
        ){

            hideLoader();

            alert(
                "Une école doit être créée avec une seule section.\n\n" +
                "Choisissez soit PRIMAIRE, soit SECONDAIRE."
            );

            return;

        }


        if(
            !primary &&
            !secondary
        ){

            hideLoader();

            alert(
                "Sélectionnez la section de l'école :\n\n" +
                "PRIMAIRE ou SECONDAIRE."
            );

            return;

        }


        // ====================================================
        // DÉTERMINER LA SECTION
        // ====================================================

        var section = "";


        if(primary){

            section =
                "primaire";

        }


        if(secondary){

            section =
                "secondaire";

        }


        // ====================================================
        // CLASSES
        // ====================================================

        var classes = [];


        if(primary){

            var classesPrimaires =
                document.querySelectorAll(
                    ".primaryClass:checked"
                );


            for(
                var i = 0;
                i < classesPrimaires.length;
                i++
            ){

                classes.push(
                    classesPrimaires[i].value
                );

            }

        }


        if(secondary){

            var classesSecondaires =
                document.querySelectorAll(
                    ".secondaryClass:checked"
                );


            for(
                var j = 0;
                j < classesSecondaires.length;
                j++
            ){

                classes.push(
                    classesSecondaires[j].value
                );

            }

        }


        if(classes.length === 0){

            hideLoader();

            alert(
                "Choisissez au moins une classe."
            );

            return;

        }


        // ====================================================
        // OPTIONS
        // ====================================================

        var options = [];


        if(secondary){

            var optionsSecondaires =
                document.querySelectorAll(
                    ".secondaryOption:checked"
                );


            for(
                var k = 0;
                k < optionsSecondaires.length;
                k++
            ){

                options.push(
                    optionsSecondaires[k].value
                );

            }

        }


        // ====================================================
        // NORMALISER LE NOM POUR LA COMPARAISON
        // ====================================================

        var nomRecherche =
            schoolName
            .toLowerCase()
            .trim();


        // ====================================================
        // VÉRIFIER SI LA MÊME ÉCOLE EXISTE
        //
        // Même nom + même province + même commune
        // + même section = REFUS
        //
        // Même nom mais section différente = AUTORISÉ
        // ====================================================

        const schoolsSnap =
            await db.ref(
                "schools"
            ).once("value");


        var existe = false;


        schoolsSnap.forEach(
            function(item){

                var school =
                    item.val();


                if(!school){

                    return;

                }


                var ancienNom =
                    school.schoolName ||
                    "";


                var ancienneProvince =
                    school.province ||
                    "";


                var ancienneCommune =
                    school.commune ||
                    "";


                var ancienneSection =
                    school.section ||
                    "";


                var nomIdentique =
                    ancienNom
                    .toLowerCase()
                    .trim() ===
                    nomRecherche;


                var provinceIdentique =
                    String(
                        ancienneProvince
                    ).toLowerCase().trim() ===
                    String(
                        province
                    ).toLowerCase().trim();


                var communeIdentique =
                    String(
                        ancienneCommune
                    ).toLowerCase().trim() ===
                    String(
                        commune
                    ).toLowerCase().trim();


                var sectionIdentique =
                    String(
                        ancienneSection
                    ).toLowerCase().trim() ===
                    String(
                        section
                    ).toLowerCase().trim();


                if(
                    nomIdentique &&
                    provinceIdentique &&
                    communeIdentique &&
                    sectionIdentique
                ){

                    existe = true;

                }

            }
        );


        if(existe){

            hideLoader();

            alert(
                "Une école avec ce nom existe déjà " +
                "dans cette même section.\n\n" +

                "Une école primaire et une école secondaire " +
                "peuvent avoir le même nom."
            );

            return;

        }


        // ====================================================
        // CODE ÉCOLE
        // ====================================================

        var schoolCode =

            schoolName
            .toUpperCase()
            .replace(/[^A-Z0-9 ]/g,"")
            .split(" ")
            .map(function(m){

                return m.substring(0,3);

            })
            .join("")
            .substring(0,10);


        // ====================================================
        // CRÉER L'ÉCOLE
        // ====================================================

        var schoolRef =
            db.ref("schools").push();


        await schoolRef.set({

            schoolName:
                schoolName,

            schoolCode:
                schoolCode,


            // IMPORTANT :
            // Primaire ou secondaire
            section:
                section,


            logo:
                enregistrerPhoto(),


            status:
                "pending",

            paymentStatus:
                "unpaid",

            paymentMethod:
                "",

            verifiedBy:
                "",

            verifiedAt:
                0,


            trialStart:
                0,

            trialEnd:
                0,


            subscriptionStart:
                0,

            subscriptionEnd:
                0,

            subscriptionNumber:
                0,


            motto:
                schoolMotto,

            phone:
                schoolPhone,

            directorName:
                directorName,

            email:
                email,

            address:
                schoolAddress,

            province:
                province,

            territoire:
                territoire,

            commune:
                commune,

            schoolYear:
                schoolYear,


            levels:{

                primary:
                    primary,

                secondary:
                    secondary

            },


            classes:
                classes,

            options:
                options,


            totalStudents:
                0,

            totalTeachers:
                0,

            totalParents:
                0,


            // Préparation pour responsable
            responsablePhone:
                "",

            responsableName:
                "",


            // Préparation pour caissier
            caissierPhone:
                "",

            caissierName:
                "",


            createdAt:
                Date.now()

        });


        // ====================================================
        // CRÉER LE COMPTE ADMINISTRATEUR
        // ====================================================

        var phone =
            normalizePhone(
                window.currentPhone
            );


        var adminData = {

            phone:
                phone,

            uid:
                auth.currentUser.uid,

            name:
                directorName,

            schoolId:
                schoolRef.key,

            email:
                email,

            role:
                "admin",

            createdAt:
                Date.now()

        };


        // ====================================================
        // ENREGISTRER UTILISATEUR
        // ====================================================

        await db
        .ref(
            "users/" +
            phone
        )
        .set(
            adminData
        );


        // ====================================================
        // LOGIN INDEX
        // ====================================================

        await db
        .ref(
            "loginIndex/" +
            phone
        )
        .set({

            email:
                email

        });


        // ====================================================
        // MEMBRE DE L'ÉCOLE
        // ====================================================

        await db
        .ref(
            "schools/" +
            schoolRef.key +
            "/members/" +
            phone.replace(/\D/g,"")
        )
        .set(
            adminData
        );


        // ====================================================
        // TERMINÉ
        // ====================================================

        hideLoader();


        alert(

            "Votre école " +
            section +
            " a été créée.\n\n" +

            "École : " +
            schoolName +
            "\n" +

            "Section : " +
            section +
            "\n\n" +

            "Effectuez maintenant le paiement " +
            "afin que MASOMO puisse valider votre école."

        );


        ouvrirPaiementEcole(
            schoolRef.key
        );


    }
    catch(error){

        hideLoader();

        console.error(
            error
        );


        alert(
            error.message ||
            "Impossible de créer l'école."
        );

    }

}

function saveStudent(){

showLoader();

const nom =
document.getElementById("nom").value.trim();

const postnom =
document.getElementById("postnom").value.trim();

const prenom =
document.getElementById("prenom").value.trim();

if(
!nom ||
!postnom ||
!prenom
){

hideLoader();

alert(
"Complétez tous les champs"
);

return;

}

// ================= NORMALISER TELEPHONES =================

let fatherPhone = normalizePhone(
document.getElementById("fatherPhone").value
);

let motherPhone = normalizePhone(
document.getElementById("motherPhone").value
);

let studentPhone = normalizePhone(
document.getElementById("studentPhone").value
);

if(
fatherPhone.startsWith("0")
){
fatherPhone =
fatherPhone.substring(1);
}

if(
motherPhone.startsWith("0")
){
motherPhone =
motherPhone.substring(1);
}

if(
studentPhone.startsWith("0")
){
studentPhone =
studentPhone.substring(1);
}

if(
fatherPhone &&
!fatherPhone.startsWith("243")
){
fatherPhone =
"243"+fatherPhone;
}

if(
motherPhone &&
!motherPhone.startsWith("243")
){
motherPhone =
"243"+motherPhone;
}

if(
studentPhone &&
!studentPhone.startsWith("243")
){
studentPhone =
"243"+studentPhone;
}

// ================= MATRICULE =================

let matricule="";

db.ref(
"schools/"+window.currentSchoolId
)

.once("value")

.then(snapshot=>{

let school=snapshot.val();

let codeEcole = (

    school.schoolName ||

    "ECOLE"

)

.toUpperCase()

.normalize("NFD")

.replace(/[\u0300-\u036f]/g,"")

.replace(/[^A-Z0-9]/g,"")

.substring(0,3);


// ================= CODE ELEVE =================

// 2 premières lettres du NOM
let codeNom = (

    nom || ""

)

.toUpperCase()

.normalize("NFD")

.replace(/[\u0300-\u036f]/g,"")

.replace(/[^A-Z]/g,"")

.substring(0,2);


// 2 premières lettres du POSTNOM
let codePostnom = (

    postnom || ""

)

.toUpperCase()

.normalize("NFD")

.replace(/[\u0300-\u036f]/g,"")

.replace(/[^A-Z]/g,"")

.substring(0,2);


// Exemple :
// Numbi + Kasongo
// NU + KA = NUKA

let codeEleve =
    codeNom +
    codePostnom;


// ================= NUMERO =================

return db.ref(
    "schools/"
    +
    window.currentSchoolId
    +
    "/lastStudentNumber"
)

.transaction(
    current => (current || 0) + 1
)

.then(result => {

    let numero =
        result.snapshot.val();


    // ================= MATRICULE FINAL =================

    matricule =

        codeEcole +
        "-" +
        codeEleve +
        "-" +
        String(numero).padStart(4,"0");

// ================= DONNEES ELEVE =================

let eleveData={

matricule,

photo:
enregistrerPhoto(),

nom,
postnom,
prenom,

name:
nom+
" "+
postnom+
" "+
prenom,

role:"student",

dateNaissance:
document.getElementById(
"dateNaissance"
).value,

lieuNaissance:
document.getElementById(
"lieuNaissance"
).value.trim(),

sexe:
document.getElementById(
"sexe"
).value,

className:
document.getElementById(
"studentClass"
).value,

fatherName:
document.getElementById(
"fatherName"
).value.trim(),

fatherPhone,

motherName:
document.getElementById(
"motherName"
).value.trim(),

motherPhone,

nationalite:
document.getElementById("nationalite").value.trim(),

province:
document.getElementById("province").value==="Autre"
?
document.getElementById("autreProvince").value.trim()
:
document.getElementById("province").value,

territoire:
document.getElementById(
"territoire"
).value.trim(),

secteur:
document.getElementById(
"secteur"
).value.trim(),

schoolId:
window.currentSchoolId,

phone: studentPhone,

level:
document.getElementById(
"studentLevel"
).value,

option:
document.getElementById(
"studentOption"
).value,

linked:false,

createdAt:
Date.now()

};

// ================= TOUTES LES SAUVEGARDES =================

let promises=[];

// enregistrer élève

promises.push(

db.ref(
"eleves/"+matricule
)

.set(eleveData)

);

// enregistrer école > élèves

promises.push(

db.ref(
"schools/"
+
window.currentSchoolId+
"/students/"
+
matricule
)

.set(eleveData)

);

// enregistrer membres

promises.push(

db.ref(
"schools/"
+
window.currentSchoolId+
"/members/"
+
matricule
)

.set({

nom:
eleveData.nom,

postnom:
eleveData.postnom,

prenom:
eleveData.prenom,

name:
eleveData.name,

role:
"student",

matricule,

className:
eleveData.className,

createdAt:
Date.now()

})

);

// ================= LIER PERE =================

if(fatherPhone){

promises.push(

db.ref(
"parents/"
+
fatherPhone+
"/children/"
+
matricule
)

.set({

matricule,

name:
eleveData.name,

className:
eleveData.className,

schoolId:
eleveData.schoolId,

role:
"student"

})

);

}

// ================= LIER MERE =================

if(motherPhone){

promises.push(

db.ref(
"parents/"
+
motherPhone+
"/children/"
+
matricule
)

.set({

matricule,

name:
eleveData.name,

className:
eleveData.className,

schoolId:
eleveData.schoolId,

role:
"student"

})

);

}

return Promise.all(
promises
);

});

})

.then(()=>{

hideLoader();

alert(

"Élève enregistré avec succès\n\n"+

"Matricule : "+matricule

);

studentRecords();

})

.catch(error=>{

hideLoader();

alert(error.message);

});

}

]);

async function modifierEmploiTemps(id) {

    try {

        const schoolId = window.currentSchoolId;

        if (!schoolId) {
            alert("École introuvable.");
            return;
        }

        const ref = db.ref(
            "schools/" +
            schoolId +
            "/emploisTemps/" +
            id
        );

        const snap = await ref.once("value");

        if (!snap.exists()) {
            alert("Emploi du temps introuvable.");
            return;
        }

        const e = snap.val();

        // Jour
        const jour = prompt(
            "Jour :",
            e.jour || ""
        );

        if (jour === null) return;

        // Heure début
        const heureDebut = prompt(
            "Heure de début :",
            e.heureDebut || ""
        );

        if (heureDebut === null) return;

        // Heure fin
        const heureFin = prompt(
            "Heure de fin :",
            e.heureFin || ""
        );

        if (heureFin === null) return;

        // Matière
        const matiere = prompt(
            "Matière :",
            e.matiere || ""
        );

        if (matiere === null) return;

        // Enseignant
        const enseignant = prompt(
            "Enseignant :",
            e.enseignantNom ||
            e.enseignant ||
            ""
        );

        if (enseignant === null) return;

        // Salle
        const salle = prompt(
            "Salle :",
            e.salle || ""
        );

        if (salle === null) return;


        // Vérification
        if (
            !jour.trim() ||
            !heureDebut.trim() ||
            !heureFin.trim() ||
            !matiere.trim()
        ) {

            alert(
                "Veuillez remplir le jour, les heures et la matière."
            );

            return;
        }


        await ref.update({

            jour: jour.trim(),

            heureDebut: heureDebut.trim(),

            heureFin: heureFin.trim(),

            matiere: matiere.trim(),

            enseignantNom: enseignant.trim(),

            // Garder également l'ancien champ
            // pour éviter de casser d'autres parties
            enseignant: enseignant.trim(),

            salle: salle.trim()

        });


        alert(
            "✅ Emploi du temps modifié avec succès."
        );


        // Recharger directement la grille
        if (
            typeof ouvrirGestionEmploiTemps ===
            "function"
        ) {

            ouvrirGestionEmploiTemps();

        }

    }

    catch (err) {

        console.error(
            "Erreur modification emploi du temps :",
            err
        );

        alert(
            "Erreur lors de la modification de l'emploi du temps."
        );

    }

}

async function supprimerEmploiTemps(id) {

    if (
        !confirm(
            "⚠️ Voulez-vous vraiment supprimer cet horaire ?"
        )
    ) {
        return;
    }


    try {

        const schoolId = window.currentSchoolId;

        if (!schoolId) {

            alert(
                "École introuvable."
            );

            return;
        }


        const ref = db.ref(
            "schools/" +
            schoolId +
            "/emploisTemps/" +
            id
        );


        const snap = await ref.once("value");


        if (!snap.exists()) {

            alert(
                "Cet horaire n'existe plus."
            );

            return;

        }


        await ref.remove();


        alert(
            "🗑️ Horaire supprimé avec succès."
        );


        // Recharger la grille
        if (
            typeof ouvrirGestionEmploiTemps ===
            "function"
        ) {

            ouvrirGestionEmploiTemps();

        }

    }

    catch (err) {

        console.error(
            "Erreur suppression emploi du temps :",
            err
        );

        alert(
            "Erreur lors de la suppression de l'horaire."
        );

    }

}

async function modifierHoraireCommunPrimaire(id) {

    const schoolId = window.currentSchoolId;

    if (!schoolId) {
        alert("École introuvable.");
        return;
    }

    try {

        const ref = db.ref(
            "schools/" +
            schoolId +
            "/horairesCommuns/heures/" +
            id
        );

        const snap = await ref.once("value");

        if (!snap.exists()) {
            alert("Plage horaire introuvable.");
            return;
        }

        const ligne = snap.val() || {};

        /*
         * ================================
         * HEURE DE DÉBUT
         * ================================
         */

        const debut = prompt(
            "Heure de début :\n\n" +
            "Exemple : 0730",
            (ligne.heureDebut || "")
                .replace("h", "")
        );

        if (debut === null) {
            return;
        }


        /*
         * ================================
         * HEURE DE FIN
         * ================================
         */

        const fin = prompt(
            "Heure de fin :\n\n" +
            "Exemple : 0820",
            (ligne.heureFin || "")
                .replace("h", "")
        );

        if (fin === null) {
            return;
        }


        /*
         * ================================
         * FORMATAGE
         * ================================
         */

        const heureDebut =
            formaterHeurePrimaire(debut);

        const heureFin =
            formaterHeurePrimaire(fin);


        if (!heureDebut) {
            alert(
                "❌ Heure de début incorrecte.\n\n" +
                "Exemple : 0730"
            );
            return;
        }


        if (!heureFin) {
            alert(
                "❌ Heure de fin incorrecte.\n\n" +
                "Exemple : 0820"
            );
            return;
        }


        /*
         * ================================
         * VÉRIFIER L'ORDRE
         * ================================
         */

        const debutMinutes =
            convertirHeureEnMinutes(
                heureDebut
            );

        const finMinutes =
            convertirHeureEnMinutes(
                heureFin
            );


        if (finMinutes <= debutMinutes) {

            alert(
                "❌ L'heure de fin doit être " +
                "supérieure à l'heure de début."
            );

            return;
        }


        /*
         * ================================
         * DEMANDER SI C'EST UNE PAUSE
         * ================================
         */

        const estPause = confirm(

            "Cette plage horaire est-elle une PAUSE / RÉCRÉATION ?\n\n" +

            "OK = Oui, c'est une pause\n\n" +

            "Annuler = Non, c'est une heure de cours"

        );


        /*
         * ================================
         * VÉRIFIER LES CHEVAUCHEMENTS
         * ================================
         */

        const toutes =
            await db.ref(
                "schools/" +
                schoolId +
                "/horairesCommuns/heures"
            ).once("value");


        const existantes =
            toutes.val() || {};


        let conflit = false;


        Object.keys(existantes).forEach(
            otherId => {

                if (otherId === id) {
                    return;
                }


                const autre =
                    existantes[otherId];


                if (
                    !autre ||
                    !autre.heureDebut ||
                    !autre.heureFin
                ) {
                    return;
                }


                const autreDebut =
                    convertirHeureEnMinutes(
                        autre.heureDebut
                    );


                const autreFin =
                    convertirHeureEnMinutes(
                        autre.heureFin
                    );


                if (
                    debutMinutes < autreFin &&
                    finMinutes > autreDebut
                ) {

                    conflit = true;

                }

            }
        );


        if (conflit) {

            alert(
                "❌ Cette plage chevauche " +
                "une autre plage horaire."
            );

            return;
        }


        /*
         * ================================
         * DONNÉES À MODIFIER
         * ================================
         */

        const donnees = {

            heureDebut:
                heureDebut,

            heureFin:
                heureFin,

            heure:
                heureDebut +
                "-" +
                heureFin,

            type:
                estPause
                ? "pause"
                : "cours",

            ordre:
                debutMinutes,

            updatedAt:
                Date.now()

        };


        /*
         * ================================
         * RÉCRÉATION
         * ================================
         */

        if (estPause) {

            donnees.titre =
                "RÉCRÉATION";

        } else {

            /*
             * Si on transforme une ancienne pause
             * en heure de cours, on retire le titre.
             */

            donnees.titre = null;

        }


        /*
         * ================================
         * ENREGISTRER
         * ================================
         */

        await ref.update(donnees);


        alert(
            estPause

            ? "✅ Plage transformée en RÉCRÉATION pour toutes les classes."

            : "✅ Plage enregistrée comme heure de cours pour toutes les classes."
        );


        /*
         * ================================
         * RECHARGER
         * ================================
         */

        const classe =
            window.classeHorairePrimaireActuelle;


        if (classe) {

            await ouvrirHoraireClassePrimaire(
                classe
            );

        }

    }
    catch (error) {

        console.error(
            "Erreur modification horaire commun :",
            error
        );

        alert(
            "❌ Erreur lors de la modification."
        );

    }

}

function convertirHeureEnMinutes(heure) {

    if (!heure) {
        return -1;
    }

    const morceaux = String(heure).split("h");

    if (morceaux.length !== 2) {
        return -1;
    }

    const heures = parseInt(
        morceaux[0],
        10
    );

    const minutes = parseInt(
        morceaux[1],
        10
    );

    if (
        isNaN(heures) ||
        isNaN(minutes)
    ) {
        return -1;
    }

    if (
        heures < 0 ||
        heures > 23 ||
        minutes < 0 ||
        minutes > 59
    ) {
        return -1;
    }

    return (
        heures * 60 +
        minutes
    );
}


function formaterHeurePrimaire(valeur) {

    const chiffres =
        String(valeur)
        .replace(/\D/g, "");

    if (chiffres.length !== 4) {
        return null;
    }

    const heures = parseInt(
        chiffres.substring(0, 2),
        10
    );

    const minutes = parseInt(
        chiffres.substring(2, 4),
        10
    );

    if (
        heures < 0 ||
        heures > 23 ||
        minutes < 0 ||
        minutes > 59
    ) {
        return null;
    }

    return (
        String(heures).padStart(2, "0") +
        "h" +
        String(minutes).padStart(2, "0")
    );
}

     */

    const debut = prompt(

    );

    if (debut === null) {

    /*

    const fin = prompt(

    /*

     */

    const heureDebut =

    if (!heureDebut) {

        alert(
            "❌ Heure de début incorrecte.\n\n" +

        );

    if (!heureFin) {

            "❌ Heure de fin incorrecte.\n\n" +
            "Utilisez 4 chiffres.\n" +
            "Exemple : 0820"
        );

    /*
     * ================================
     * VÉRIFIER QUE FIN > DÉBUT
     * ================================
     */

    const debutMinutes =
        convertirHeureEnMinutes(
            heureDebut
        );

    const finMinutes =
        convertirHeureEnMinutes(
            heureFin
        );


    if (finMinutes <= debutMinutes) {

        alert(
            "❌ L'heure de fin doit être " +
            "supérieure à l'heure de début."
        );

        return;
    }


    /*
     * ================================
     * CHOISIR LE TYPE
     * ================================
     */

    const estPause = confirm(

        "Quel type de plage voulez-vous créer ?\n\n" +

        "OK = PAUSE / RÉCRÉATION\n\n" +

        "Annuler = COURS"

    );


    const type =
        estPause
        ? "pause"
        : "cours";


    /*
     * ================================
     * RÉCUPÉRER LES HORAIRES COMMUNS
     * ================================
     */

    const ref =
        db.ref(
            "schools/" +
            schoolId +
            "/horairesCommuns/heures"
        );


    const snap =
        await ref.once("value");


    const heuresExistantes =
        snap.val() || {};


    /*
     * ================================
     * EMPÊCHER LES DOUBLONS
     * ================================
     */

    let conflit = false;


    Object.keys(
        heuresExistantes
    ).forEach(id => {

        const ancienne =
            heuresExistantes[id];


        if (
            !ancienne ||
            !ancienne.heureDebut ||
            !ancienne.heureFin
        ) {
            return;
        }


        const ancienDebut =
            convertirHeureEnMinutes(
                ancienne.heureDebut
            );


        const ancienFin =
            convertirHeureEnMinutes(
                ancienne.heureFin
            );


        /*
         * Vérification du chevauchement
         */

        if (
            debutMinutes < ancienFin &&
            finMinutes > ancienDebut
        ) {

            conflit = true;

        }

    });


    if (conflit) {

        alert(
            "❌ Cette plage horaire chevauche " +
            "une plage déjà enregistrée."
        );

        return;
    }


    /*
     * ================================
     * CRÉER L'ID
     * ================================
     */

    const id =
        ref.push().key;


    /*
     * ================================
     * DONNÉES COMMUNES
     * ================================
     */

    const donnees = {

        heureDebut:
            heureDebut,

        heureFin:
            heureFin,

        heure:
            heureDebut +
            "-" +
            heureFin,

        type:
            type,

        ordre:
            debutMinutes,

        createdAt:
            Date.now()

    };


    /*
     * ================================
     * SI C'EST UNE PAUSE
     * ================================
     */

    if (type === "pause") {

        donnees.titre =
            "RÉCRÉATION";

    }


    /*
     * ================================
     * ENREGISTRER DANS HORAIRES COMMUNS
     * ================================
     */

    try {

        await ref
            .child(id)
            .set(donnees);


        /*
         * ================================
         * MESSAGE
         * ================================
         */

        alert(

            type === "pause"

            ? "✅ Pause / récréation ajoutée.\n\n" +
              heureDebut +
              " - " +
              heureFin

            : "✅ Plage horaire ajoutée.\n\n" +
              heureDebut +
              " - " +
              heureFin

        );


        /*
         * ================================
         * ACTUALISER L'HORAIRE
         * ================================
         */

        if (
            typeof ouvrirHoraireClassePrimaire ===
            "function"
        ) {

            const classe =
                window.classeHorairePrimaireActuelle;


            if (classe) {

                ouvrirHoraireClassePrimaire(
                    classe
                );

            }

        }

    }
    catch (error) {

        console.error(
            "Erreur ajout horaire commun :",
            error
        );


        alert(
            "❌ Erreur lors de l'enregistrement " +
            "de la plage horaire."
        );

    }

}

function formaterHeurePrimaire(valeur) {

    let chiffres =
        String(valeur)
        .replace(/\D/g, "");


    if (chiffres.length !== 4) {
        return null;
    }


    const heures =
        parseInt(
            chiffres.substring(0, 2),
            10
        );

    const minutes =
        parseInt(
            chiffres.substring(2, 4),
            10
        );


    if (
        heures > 23 ||
        minutes > 59
    ) {
        return null;
    }


    return (
        String(heures).padStart(2, "0") +
        "h" +
        String(minutes).padStart(2, "0")
    );

}

function escapeHtmlHoraire(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

            String(e.classe) ===

            a.jourNumero ||

    .then(snapshot => {

        let enseignants = [];

        snapshot.forEach(item => {
            enseignants.push(item.val());
        });

        window.enseignantsCache = enseignants;

        dessinerListeEnseignants(
            enseignants
        );

        hideLoader();

    })
    .catch(error => {

        hideLoader();
        alert(error.message);

    });

}

// ============================================================
// FILTRER + TRIER
// ============================================================

function filtrerEnseignants() {

    const champRecherche =
        document.getElementById(
            "rechercheEns"
        );

    const texte =
        (
            champRecherche
                ? champRecherche.value
                : ""
        )
        .toLowerCase()
        .trim();


    const champClasse =
        document.getElementById(
            "filtreClasseEns"
        );

    const classe =
        champClasse
            ? champClasse.value
            : "";


    const champTri =
        document.getElementById(
            "triEnseignants"
        );

    const tri =
        champTri
            ? champTri.value
            : "nom";


    let resultat =
        (
            window.enseignantsCache ||
            []
        ).filter(e => {

            const recherche = [

                e.matricule,
                e.nom,
                e.postnom,
                e.prenom,
                e.name,
                e.sexe,
                e.dateNaissance,
                e.lieuNaissance,
                e.dateEngagement,
                e.matiere,
                e.classe,
                e.telephone,
                e.adresse

            ]
            .join(" ")
            .toLowerCase();


            const correspondRecherche =
                !texte ||
                recherche.includes(
                    texte
                );


            const correspondClasse =
                !classe ||
                e.classe === classe;


            return (
                correspondRecherche &&
                correspondClasse
            );

        });


    /*
     * TRI
     */

    if (tri === "alphabetique") {

        resultat.sort(
            (a, b) => {

                const nomA =
                    (
                        a.nom ||
                        a.name ||
                        ""
                    ).toLowerCase();

                const nomB =
                    (
                        b.nom ||
                        b.name ||
                        ""
                    ).toLowerCase();

                return nomA.localeCompare(
                    nomB,
                    "fr",
                    {
                        sensitivity: "base"
                    }
                );

            }
        );

    }

    else {

        resultat.sort(
            (a, b) => {

                let valeurA =
                    a[tri] || "";

                let valeurB =
                    b[tri] || "";


                return String(
                    valeurA
                ).localeCompare(
                    String(valeurB),
                    "fr",
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                );

            }
        );

    }


    afficherTableEnseignants(
        resultat
    );

}

    /*

    if (

    ) {

            typeof ouvrirEspaceAdmin ===

// ================= FILTRE =================

function filtrerEleves() {

    const eleves =
        window.listeElevesActuelle || [];


    // ============================================================
    // RECHERCHE
    // ============================================================

    const champRecherche =
        document.getElementById(
            "rechercheEleve"
        );

    const recherche =
        (
            champRecherche
                ? champRecherche.value
                : ""
        )
        .trim()
        .toLowerCase();


    // ============================================================
    // FILTRE CLASSE
    // ============================================================

    const champClasse =
        document.getElementById(
            "filtreClasse"
        );

    const classe =
        champClasse
            ? champClasse.value
            : "";


    // ============================================================
    // FILTRE OPTION
    // ============================================================

    const champOption =
        document.getElementById(
            "filtreOption"
        );

    const option =
        champOption
            ? champOption.value
            : "";


    // ============================================================
    // TRI
    // ============================================================

    const champTri =
        document.getElementById(
            "triEleves"
        );

    const tri =
        champTri
            ? champTri.value
            : "nom";


    /*
     * ==========================================
     * FILTRER
     * ==========================================
     */

    let resultat =
        eleves.filter(e => {

            const texte = [

                e.nom,
                e.postnom,
                e.prenom,
                e.sexe,
                e.className,
                e.option,
                e.optionEtude,
                e.province,
                e.studentPhone,
                e.telephone,
                e.phone,
                e.matricule

            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


            // Recherche

            if (
                recherche &&
                !texte.includes(recherche)
            ) {

                return false;

            }


            // Classe

            if (
                classe &&
                String(
                    e.className || ""
                ) !==
                String(classe)
            ) {

                return false;

            }


            // Option

            const optionEleve =
                e.option ||
                e.optionEtude ||
                e.options ||
                "";


            if (
                option &&
                String(optionEleve) !==
                String(option)
            ) {

                return false;

            }


            return true;

        });


    /*
     * ==========================================
     * TRI
     * ==========================================
     */

    resultat.sort(
        (a, b) => {

            let valeurA = "";
            let valeurB = "";


            if (tri === "nom") {

                valeurA =
                    a.nom || "";

                valeurB =
                    b.nom || "";

            }

            else if (tri === "postnom") {

                valeurA =
                    a.postnom || "";

                valeurB =
                    b.postnom || "";

            }

            else if (tri === "prenom") {

                valeurA =
                    a.prenom || "";

                valeurB =
                    b.prenom || "";

            }

            else if (tri === "classe") {

                valeurA =
                    a.className || "";

                valeurB =
                    b.className || "";

            }

            else if (tri === "province") {

                valeurA =
                    a.province || "";

                valeurB =
                    b.province || "";

            }

            else if (tri === "option") {

                valeurA =
                    a.option ||
                    a.optionEtude ||
                    a.options ||
                    "";

                valeurB =
                    b.option ||
                    b.optionEtude ||
                    b.options ||
                    "";

            }

            else if (tri === "sexe") {

                valeurA =
                    a.sexe || "";

                valeurB =
                    b.sexe || "";

            }

            else if (
                tri === "alphabetique"
            ) {

                valeurA =
                    (
                        (a.nom || "") +
                        " " +
                        (a.postnom || "") +
                        " " +
                        (a.prenom || "")
                    );

                valeurB =
                    (
                        (b.nom || "") +
                        " " +
                        (b.postnom || "") +
                        " " +
                        (b.prenom || "")
                    );

            }


            return String(
                valeurA
            ).localeCompare(
                String(valeurB),
                "fr",
                {
                    sensitivity: "base",
                    numeric: true
                }
            );

        }
    );


    /*
     * ==========================================
     * AFFICHER
     * ==========================================
     */

    afficherElevesTable(
        resultat
    );

}


function escapeHtmlListe(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

async function telechargerPDF(){

element
);

canvas.toDataURL(
"image/png"
);

}=window.jspdf;

new jsPDF();

pdf.addImage(

image,

"PNG",

10,

10,

180,

0

);

pdf.save(
"fiche.pdf"
);

}

function telechargerWord(){

).innerText;

const doc=

new docx.Document({

sections:[{

children:[

new docx.Paragraph({

text:contenu

})

]

}]

});

docx.Packer

.toBlob(doc)

.then(blob=>{

saveAs(

blob,

"fiche.docx"

);

});

}

async function saveAdminSchoolProfile(){

    try{

        const schoolId =
            window.currentSchoolId;

        if(!schoolId){

            alert(
                "École introuvable."
            );

            return;

        }


        const nameInput =
            document.getElementById(
                "newSchoolName"
            );


        if(!nameInput){

            alert(
                "Formulaire introuvable."
            );

            return;

        }


        const schoolName =
            nameInput.value.trim();


        if(!schoolName){

            alert(
                "Veuillez entrer le nom de l'école."
            );

            return;

        }


        showLoader();


        /*
         * Si une nouvelle photo a été choisie,
         * enregistrerPhoto() récupère le nouveau
         * logo recadré.
         */

        let nouveauLogo =
            enregistrerPhoto();


        /*
         * Préparer les modifications
         */

        const updates = {

            schoolName:
                schoolName

        };


        /*
         * Modifier le logo seulement
         * si l'administrateur en a choisi un nouveau.
         */

        if(nouveauLogo){

            updates.logo =
                nouveauLogo;

        }


        await db.ref(
            "schools/" +
            schoolId
        ).update(updates);


        /*
         * Mettre également le cache Admin
         * à jour pour que l'ancien logo
         * ne réapparaisse pas.
         */

        const cacheKey =
            "adminData_" +
            schoolId;


        const cache =
            localStorage.getItem(
                cacheKey
            );


        if(cache){

            try{

                const data =
                    JSON.parse(cache);


                if(data.school){

                    data.school.schoolName =
                        schoolName;


                    if(nouveauLogo){

                        data.school.logo =
                            nouveauLogo;

                    }

                }


                localStorage.setItem(
                    cacheKey,
                    JSON.stringify(data)
                );

            }catch(cacheError){

                console.warn(
                    "Cache non mis à jour :",
                    cacheError
                );

            }

        }


        hideLoader();


        alert(
            "✅ Profil de l'école modifié avec succès."
        );


        /*
         * Revenir à l'espace Admin
         */

        openAdmin();


    }catch(error){

        hideLoader();

        console.error(
            "Erreur modification profil école :",
            error
        );

        alert(
            "❌ Impossible de modifier le profil de l'école."
        );

    }

}

s.parents++;

function afficherDemandesResponsableMasomo(){

    var demandes =
        window.masomoResponsableRequests || {};

    var zone =
        document.querySelector(".login-box");

    if(!zone){
        return;
    }


    var ids =
        Object.keys(demandes);

    var pending = [];


    // ========================================================
    // RÉCUPÉRER UNIQUEMENT LES DEMANDES EN ATTENTE
    // ========================================================

    for(var i = 0; i < ids.length; i++){

        var id = ids[i];

        var demande =
            demandes[id];

        if(
            demande &&
            demande.statut === "pending"
        ){

            demande.demandeId =
                demande.demandeId || id;

            pending.push(demande);

        }

    }


    // ========================================================
    // SUPPRIMER L'ANCIEN BLOC
    // ========================================================

    var ancien =
        document.getElementById(
            "demandesResponsableMasomo"
        );


    if(ancien){

        ancien.remove();

    }


    // ========================================================
    // AUCUNE DEMANDE
    // ========================================================

    if(pending.length === 0){

        return;

    }


    // ========================================================
    // CRÉER LE BLOC
    // ========================================================

    var bloc =
        document.createElement("div");

/*
 * ============================================================
 * AUTORISER UN RESPONSABLE
 *
 * MASOMO-ECOLE ne transforme jamais le compte de
 * l'administrateur.
 *
 * MASOMO-ECOLE génère uniquement un code RES de 10 caractères.
 *
 * Le futur responsable utilisera ensuite son propre numéro
 * pour rejoindre l'école avec ce code.
 * ============================================================
 */

async function accepterResponsableMasomo(
    demandeId
){

    if(
        !confirm(
            "Autoriser cette demande de responsable ?"
        )
    ){

        return;

    }


    showLoader();


    try{

        const demandeSnap =
            await db.ref(
                "responsableRequests/" +
                demandeId
            ).once("value");


        if(
            !demandeSnap.exists()
        ){

            throw new Error(
                "Demande introuvable."
            );

        }


        const demande =
            demandeSnap.val();


        if(
            demande.statut !==
            "pending"
        ){

            throw new Error(
                "Cette demande a déjà été traitée."
            );

        }


        /*
         * =====================================================
         * GÉNÉRER LE CODE RES
         * 10 caractères au total
         * Aucun tiret
         * =====================================================
         */

        const caracteres =
            "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


        let inviteCode = "";


        for(
            let i = 0;
            i < 7;
            i++
        ){

            const index =
                Math.floor(
                    Math.random() *
                    caracteres.length
                );

            inviteCode +=
                caracteres[index];

        }


        inviteCode =
            "RES" +
            inviteCode;


        /*
         * Vérifier l'unicité du code
         */

        let codeExiste =
            await db.ref(
                "invitations/" +
                inviteCode
            ).once("value");


        if(
            codeExiste.exists()
        ){

            throw new Error(
                "Impossible de générer un code unique. Réessayez."
            );

        }


        /*
         * =====================================================
         * CRÉER L'INVITATION
         * =====================================================
         */

        await db.ref(
            "invitations/" +
            inviteCode
        ).set({

            code:
                inviteCode,

            schoolId:
                demande.schoolId,

            role:
                "responsable",

            used:
                false,

            usedBy:
                null,

            usedAt:

async function validerEcole(schoolId){

if(!confirm("Valider cette école ?")) return;

showLoader();

try{

const schoolSnap = await db.ref("schools/"+schoolId).once("value");

const school = schoolSnap.val();

let data = {

status:"active",

paymentStatus:"paid",

verifiedBy:"MASOMO",

verifiedAt:Date.now()

};

// Première activation : pas encore d'essai
// Première activation → Essai de 90 jours
if(!school.trialStart){

data.trialStart = Date.now();

data.trialEnd = Date.now() + (60*24*60*60*1000);

// 60 jours

}else{

// Renouvellement → Abonnement de 30 jours
data.subscriptionStart = Date.now();

data.subscriptionEnd = Date.now() + (30*24*60*60*1000);

// 30 jours

data.subscriptionNumber = (school.subscriptionNumber || 0) + 1;

}

await db.ref("schools/"+schoolId).update(data);

hideLoader();

alert("École validée avec succès.");

openControleMasomo();

}
catch(error){

hideLoader();

alert(error.message);

}

}

function verifierEssai(school){

let abonnementActif =
    school.subscriptionEnd &&
    school.subscriptionEnd > Date.now();

let fin = abonnementActif
    ? school.subscriptionEnd
    : school.trialEnd;

if(!fin){
    return true;
}

if(Date.now() >= fin){
    afficherEssaiExpire(school);
    return false;
}

return true;

}

<script>


/* ============================================================
   OUTILS
   ============================================================ */

function masomoDoubleEscape(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ============================================================
   SECTION DE L'ECOLE
   ============================================================ */

function masomoDoubleGetSection(school){

    if(!school){
        return "";
    }

    var section =
        school.section || "";

    section =
        String(section).toLowerCase();

    if(section){
        return section;
    }

    if(
        school.levels &&
        school.levels.primary === true
    ){
        return "primaire";
    }

    if(
        school.levels &&
        school.levels.secondary === true
    ){
        return "secondaire";
    }

    return "";

}


/* ============================================================
   SECTION OPPOSEE
   ============================================================ */

function masomoDoubleOppositeSection(section){

    section =
        String(section || "").toLowerCase();

    if(section == "primaire"){
        return "secondaire";
    }

    if(section == "secondaire"){
        return "primaire";
    }

    return "";

}


/* ============================================================
   RECUPERER LES ECOLES DU COMPTE
   ============================================================ */

async function masomoDoubleGetSchoolsForUser(){

    var phone =
        normalizePhone(
            window.currentPhone
        );

    if(!phone){

        throw new Error(
            "Numéro utilisateur introuvable."
        );

    }

    var userSnap =
        await db.ref(
            "users/" +
            phone
        ).once("value");

    if(!userSnap.exists()){

        throw new Error(
            "Utilisateur introuvable."
        );

    }

    var user =
        userSnap.val() || {};

    var access =
        user.schoolsAccess || {};

    /*
     * Compatibilité avec ancien compte
     */

    if(
        Object.keys(access).length === 0 &&
        user.schoolId
    ){

        access[user.schoolId] = {

            schoolId:
                user.schoolId,

            active:
                true

        };

    }

    var ids =
        Object.keys(access);

    var result = [];

    for(
        var i = 0;
        i < ids.length;
        i++
    ){

        var schoolId =
            ids[i];

        var accessData =
            access[schoolId] || {};

        if(
            accessData.active === false
        ){
            continue;
        }

        var schoolSnap =
            await db.ref(
                "schools/" +
                schoolId
            ).once("value");

        if(!schoolSnap.exists()){
            continue;
        }

        var school =
            schoolSnap.val() || {};

        result.push({

            schoolId:
                schoolId,

            school:
                school,

            section:
                masomoDoubleGetSection(
                    school
                ),

            access:
                accessData

        });

    }

    return result;

}


/* ============================================================
   VERIFIER SI LE COMPTE A LES 2 SECTIONS
   ============================================================ */

async function masomoDoubleHasTwoSections(){

    var schools =
        await masomoDoubleGetSchoolsForUser();

    var primary =
        false;

    var secondary =
        false;

    for(
        var i = 0;
        i < schools.length;
        i++
    ){

        if(
            schools[i].section ==
            "primaire"
        ){
            primary = true;
        }

        if(
            schools[i].section ==
            "secondaire"
        ){
            secondary = true;
        }

    }

    return (
        primary &&
        secondary
    );

}


/* ============================================================
   RECUPERER ECOLE ACTUELLE
   ============================================================ */

async function masomoDoubleGetCurrentSchool(){

    var schools =
        await masomoDoubleGetSchoolsForUser();

    var currentId =
        window.currentSchoolId || "";

    var first =
        null;

    for(
        var i = 0;
        i < schools.length;
        i++
    ){

        if(!first){
            first = schools[i];
        }

        if(
            currentId &&
            schools[i].schoolId ==
            currentId
        ){

            return schools[i];

        }

    }

    return first;

}


/* ============================================================
   VERIFICATION DU MOT DE PASSE
   ============================================================ */

async function masomoDoubleVerifyPassword(
    password
){

    if(!password){

        throw new Error(
            "Veuillez saisir votre mot de passe."
        );

    }

    if(
        !auth ||
        !auth.currentUser
    ){

        throw new Error(
            "Votre session n'est plus active. Veuillez vous reconnecter."
        );

    }

    var current =
        auth.currentUser;

    if(!current.email){

        throw new Error(
            "Adresse du compte introuvable."
        );

    }

    var credential =
        firebase.auth.EmailAuthProvider
        .credential(
            current.email,
            password
        );

    await current.reauthenticateWithCredential(
        credential
    );

    return true;

}


/* ============================================================
   AFFICHER / MASQUER MOT DE PASSE
   ============================================================ */

function masomoDoubleToggleEye(){

    var input =
        document.getElementById(
            "masomoDoubleLinkPassword"
        );

    var eye =
        document.getElementById(
            "masomoDoubleLinkEye"
        );

    if(!input){
        return;
    }

    if(
        input.type ==
        "password"
    ){

        input.type =
            "text";

        if(eye){
            eye.innerHTML =
                "🙈";
        }

    }
    else{

        input.type =
            "password";

        if(eye){
            eye.innerHTML =
                "👁️";
        }

    }

}


/* ============================================================
   OUVRIR "AJOUTER L'AUTRE ECOLE"
   ============================================================ */

async function masomoDoubleOpenAddSchool(){

    var schools =
        await masomoDoubleGetSchoolsForUser();

    var current =
        await masomoDoubleGetCurrentSchool();

    if(!current){

        alert(
            "École actuelle introuvable."
        );

        return;

    }

    var currentSection =
        current.section;

    var opposite =
        masomoDoubleOppositeSection(
            currentSection
        );

    if(!opposite){

        alert(
            "Impossible de déterminer la section."
        );

        return;

    }

    /*
     * Si les deux sont déjà là,
     * le bouton ne doit plus fonctionner.
     */

    var complete =
        await masomoDoubleHasTwoSections();

    if(complete){

        alert(
            "✅ Votre compte gère déjà le primaire et le secondaire."
        );

        ouvrirEspaceResponsable();

        return;

    }

    var old =
        document.getElementById(
            "masomoDoubleAddSchoolModal"
        );

    if(old){
        old.remove();
    }

    var div =
        document.createElement(
            "div"
        );

    div.id =
        "masomoDoubleAddSchoolModal";

    div.className =
        "masomo-double-modal-bg";

    div.innerHTML = `

        <div class="masomo-double-modal">

            <h2 style="
                margin-top:0;
                text-align:center;
                color:#1f4cff;
            ">
                ➕ Ajouter ${masomoDoubleEscape(opposite)}
            </h2>

            <p style="
                color:#666;
                font-size:13px;
                line-height:1.5;
                text-align:center;
            ">

                L'administrateur de l'école
                <b>
                    ${masomoDoubleEscape(opposite)}
                </b>
                doit d'abord demander une
                autorisation à MASOMO.

                Après validation, il reçoit un
                code d'invitation.

            </p>

            <label>
                <b>Mot de passe du responsable</b>
            </label>

            <div class="masomo-double-password">

                <input
                    id="masomoDoubleLinkPassword"
                    class="masomo-double-input"
                    type="password"
                    placeholder="Votre mot de passe"
                >

                <button
                    id="masomoDoubleLinkEye"
                    class="masomo-double-eye"
                    onclick="
                        masomoDoubleToggleEye()
                    "
                >
                    👁️
                </button>

            </div>

            <label style="
                display:block;
                margin-top:14px;
            ">
                <b>
                    Code validé par MASOMO
                </b>
            </label>

            <input
                id="masomoDoubleLinkCode"
                class="masomo-double-input"
                type="text"
                maxlength="12"
                placeholder="Ex : RESXXXXXXXX"
                style="
                    text-align:center;
                    text-transform:uppercase;
                    letter-spacing:3px;
                "
            >

            <button
                class="masomo-double-button masomo-double-blue"
                onclick="
                    masomoDoubleLinkSchool()
                "
            >
                🔗 Ajouter l'école
            </button>

            <button
                class="masomo-double-button masomo-double-grey"
                onclick="
                    document.getElementById(
                        'masomoDoubleAddSchoolModal'
                    ).remove()
                "
            >
                Annuler
            </button>

        </div>

    `;

    document.body.appendChild(
        div
    );

}


/* ============================================================
   LIER LA DEUXIEME ECOLE
   ============================================================ */

async function masomoDoubleLinkSchool(){

    try{

        var passwordElement =
            document.getElementById(
                "masomoDoubleLinkPassword"
            );

        var codeElement =
            document.getElementById(
                "masomoDoubleLinkCode"
            );

        var password =
            passwordElement
            ? passwordElement.value.trim()
            : "";

        var code =
            codeElement
            ? codeElement.value
                .trim()
                .toUpperCase()
            : "";

        if(!password){

            alert(
                "Veuillez saisir votre mot de passe."
            );

            return;

        }

        if(!code){

            alert(
                "Veuillez saisir le code validé par MASOMO."
            );

            return;

        }

        showLoader();

        /*
         * =====================================================
         * 1. MOT DE PASSE
         * =====================================================
         */

        await masomoDoubleVerifyPassword(
            password
        );

        /*
         * =====================================================
         * 2. COMPTE ACTUEL
         * =====================================================
         */

        var phone =
            normalizePhone(
                window.currentPhone
            );

        var userSnap =
            await db.ref(
                "users/" +
                phone
            ).once("value");

        if(!userSnap.exists()){

            throw new Error(
                "Compte utilisateur introuvable."
            );

        }

        var user =
            userSnap.val() || {};

        var role =
            user.role;

        if(
            role != "responsable" &&
            role != "cashier" &&
            role != "caissier"
        ){

            throw new Error(
                "Ce compte n'est ni responsable ni caissier."
            );

        }

        /*
         * =====================================================
         * 3. VERIFIER L'INVITATION MASOMO
         * =====================================================
         */

        var inviteSnap =
            await db.ref(
                "invitations/" +
                code
            ).once("value");

        if(!inviteSnap.exists()){

            throw new Error(
                "Code d'invitation introuvable."
            );

        }

        var invite =
            inviteSnap.val() || {};

        /*
         * Le code doit être approuvé par MASOMO.
         */

        if(
            invite.approved !== true
        ){

            throw new Error(
                "Ce code n'a pas encore été validé par MASOMO."
            );

        }

        if(
            invite.used === true
        ){

            throw new Error(
                "Ce code a déjà été utilisé."
            );

        }

        /*
         * =====================================================
         * 4. ROLE
         * =====================================================
         */

        var expectedRole =
            role == "responsable"
            ? "responsable"
            : "cashier";

        if(
            invite.role !=
            expectedRole
        ){

            throw new Error(
                "Ce code n'est pas destiné à votre rôle."
            );

        }

        /*
         * =====================================================
         * 5. ECOLE ACTUELLE
         * =====================================================
         */

        var current =
            await masomoDoubleGetCurrentSchool();

        if(!current){

            throw new Error(
                "École actuelle introuvable."
            );

        }

        var currentSection =
            current.section;

        /*
         * =====================================================
         * 6. ECOLE DU CODE
         * =====================================================
         */

        var targetSchoolId =
            invite.schoolId;

        if(!targetSchoolId){

            throw new Error(
                "Le code ne contient aucune école."
            );

        }

        if(
            targetSchoolId ==
            current.schoolId
        ){

            throw new Error(
                "Vous essayez d'ajouter la même école."
            );

        }

        var targetSnap =
            await db.ref(
                "schools/" +
                targetSchoolId
            ).once("value");

        if(!targetSnap.exists()){

            throw new Error(
                "L'école du code est introuvable."
            );

        }

        var targetSchool =
            targetSnap.val() || {};

        var targetSection =
            masomoDoubleGetSection(
                targetSchool
            );

        var expectedSection =
            masomoDoubleOppositeSection(
                currentSection
            );

        /*
         * =====================================================
         * 7. VERIFIER PRIMAIRE / SECONDAIRE
         * =====================================================
         */

        if(
            targetSection !=
            expectedSection
        ){

            throw new Error(
                "Ce code correspond à une école " +
                targetSection +
                ", alors que votre compte doit ajouter " +
                expectedSection +
                "."
            );

        }

        /*
         * =====================================================
         * 8. NE PAS AJOUTER UNE 3e ECOLE
         * =====================================================
         */

        var schools =
            await masomoDoubleGetSchoolsForUser();

        var alreadyTarget =
            false;

        for(
            var i = 0;
            i < schools.length;
            i++
        ){

            if(
                schools[i].section ==
                targetSection
            ){

                alreadyTarget =
                    true;

            }

        }

        if(alreadyTarget){

            throw new Error(
                "Votre compte possède déjà une école " +
                targetSection +
                "."
            );

        }

        /*
         * =====================================================
         * 9. SCHOOLS ACCESS
         * =====================================================
         */

        var access =
            user.schoolsAccess ||
            {};

        if(
            Object.keys(access).length === 0 &&
            user.schoolId
        ){

            access[user.schoolId] = {

                schoolId:
                    user.schoolId,

                role:
                    role,

                active:
                    true

            };

        }

        access[targetSchoolId] = {

            schoolId:
                targetSchoolId,

            role:
                role,

            active:
                true,

            linkedFrom:
                current.schoolId,

            linkedAt:
                Date.now(),

            validatedByMasomo:
                invite.validatedBy ||
                ""

        };

        /*
         * =====================================================
         * 10. ENREGISTRER LE COMPTE
         * =====================================================
         */

        await db.ref(
            "users/" +
            phone +
            "/schoolsAccess"
        ).set(
            access
        );

        /*
         * =====================================================
         * 11. AJOUTER LE MEMBRE DANS LA NOUVELLE ECOLE
         * =====================================================
         */

        await db.ref(
            "schools/" +
            targetSchoolId +
            "/members/" +
            phone
        ).set({

            phone:
                phone,

            role:
                role,

            linkedAccount:
                true,

            linkedFrom:
                current.schoolId,

            linkedAt:
                Date.now()

        });

        /*
         * =====================================================
         * 12. RESPONSABLE
         * =====================================================
         */

        if(
            role ==
            "responsable"
        ){

            await db.ref(
                "schools/" +
                targetSchoolId +
                "/responsable"
            ).set({

                phone:
                    phone,

                uid:
                    user.uid || "",

                email:
                    user.email || "",

                active:
                    true,

                linkedAccount:
                    true,

                linkedFrom:
                    current.schoolId,

                linkedAt:
                    Date.now()

            });

        }

        /*
         * =====================================================
         * 13. CAISSIER
         * =====================================================
         */

        if(
            role ==
            "cashier" ||
            role ==
            "caissier"
        ){

            await db.ref(
                "schools/" +
                targetSchoolId +
                "/caissier"
            ).set({

                phone:
                    phone,

                uid:
                    user.uid || "",

                email:
                    user.email || "",

                active:
                    true,

                linkedAccount:
                    true,

                linkedFrom:
                    current.schoolId,

                linkedAt:
                    Date.now()

            });

        }

        /*
         * =====================================================
         * 14. ENREGISTRER LA LIAISON
         * =====================================================
         */

        var pairId =
            current.schoolId +
            "_" +
            targetSchoolId;

        await db.ref(
            "schoolLinks/" +
            pairId
        ).set({

            schoolA:
                current.schoolId,

            sectionA:
                currentSection,

            schoolB:
                targetSchoolId,

            sectionB:
                targetSection,

            userPhone:
                phone,

            role:
                role,

            linkedAt:
                Date.now(),

            validatedByMasomo:
                invite.validatedBy ||
                ""

        });

        /*
         * =====================================================
         * 15. CODE UTILISE
         * =====================================================
         */

        await db.ref(
            "invitations/" +
            code
        ).update({

            used:
                true,

            usedBy:
                phone,

            usedAt:
                Date.now()

        });

        hideLoader();

        var modal =
            document.getElementById(
                "masomoDoubleAddSchoolModal"
            );

        if(modal){
            modal.remove();
        }

        alert(
            "✅ École " +
            targetSection +
            " ajoutée.\n\n" +
            "Votre compte gère maintenant " +
            "le primaire et le secondaire."
        );

        /*
         * Ouvrir le bon espace
         */

        if(
            role ==
            "responsable"
        ){

            ouvrirEspaceResponsable();

        }
        else{

            ouvrirEspaceCaissier();

        }

    }
    catch(error){

        hideLoader();

        console.error(
            "Erreur liaison Primaire/Secondaire :",
            error
        );

        alert(
            error.message ||
            "Impossible d'ajouter l'autre école."
        );

    }

}


/* ============================================================
   BLOC PRIMAIRE + SECONDAIRE
   ============================================================ */

        await masomoDoubleGetSchoolsForUser();

    var primary =
        null;

    var secondary =

        var i = 0;
        i < schools.length;
        i++
    ){

            "primaire"
        ){

            "secondaire"

                schools[i];

            class="masomo-double-card"
        >

            <div class="masomo-double-title">

    `;

    /*

     * LES DEUX ECOLES SONT LIEES
     * =========================================================
     */

        primary &&
        secondary
    ){

        html += `

            <div class="masomo-double-success">

                ✅ Votre compte gère maintenant
                les deux sections.

            </div>

            <div class="masomo-double-school">

                🏫
                <b style="
                    color:#1565c0;
                ">
                    Primaire
                </b>

                <br>

                ${
                    masomoDoubleEscape(
                        primary.school.schoolName ||
                        primary.school.name ||
                        primary.schoolId
                    )
                }

            </div>

            <div class="masomo-double-school">

                🏫
                <b style="
                    color:#7b1fa2;
                ">
                    Secondaire
                </b>

                <br>

                ${
                    masomoDoubleEscape(
                        secondary.school.schoolName ||
                        secondary.school.name ||
                        secondary.schoolId
                    )
                }

            </div>

        `;

        return (
            html +
            "</div>"

    }

    /*
     * =========================================================
     * UNE SEULE ECOLE
     * =========================================================
     */

    var current =
        primary ||
        secondary;

    if(current){

        var opposite =
            masomoDoubleOppositeSection(
                current.section
            );

        html += `

            <div style="
                font-size:13px;
                color:#666;
                line-height:1.5;
            ">

                École actuelle :

                <b>
                    ${masomoDoubleEscape(
                        current.section
                    )}

                Pour gérer les deux sections,

                <b>
                    ${masomoDoubleEscape(

                    )}

        `;

    }

    return html;

}


/* ============================================================
   ESPACE RESPONSABLE
   ============================================================ */

    showLoader();

    try{

        var phone =
            normalizePhone(
                window.currentPhone
            );

        if(!phone){

            throw new Error(
                "Numéro du responsable introuvable."
            );

        }

        var userSnap =
            await db.ref(
                "users/" +
                phone
            ).once("value");

        if(!userSnap.exists()){

            throw new Error(
                "Compte responsable introuvable."
            );

        }

        var user =
            userSnap.val() || {};

        if(
            user.role !=
            "responsable"
        ){

            throw new Error(
                "Ce compte n'est pas responsable."
            );

        }

        window.currentPhone =
            phone;

        window.currentRole =
            "responsable";

        var schools =
            await masomoDoubleGetSchoolsForUser();

        if(schools.length === 0){

            throw new Error(
                "Aucune école associée."
            );

        }

        var zone =
            document.querySelector(
                ".login-box"
            );

        if(!zone){

            throw new Error(
                "Zone d'affichage introuvable."
            );

        }

        var management =
            await masomoDoubleBuildManagementBox();

        hideLoader();

        var html = `

            <div style="
                width:100%;
                box-sizing:border-box;
            ">

                <div style="
                    background:white;
                    border-radius:20px;
                    padding:18px;
                    box-sizing:border-box;
                ">

                    <h2 style="
                        text-align:center;
                        color:#1f4cff;
                        margin-top:0;
                    ">
                        👨‍💼 Espace Responsable
                    </h2>

                    ${management}

                    <div

/* ============================================================
   CLE UNIQUE DE LA CAISSE COMMUNE
   ============================================================ */

function masomoCaisseGetSharedKey(
    schools
){

    var ids = [];

    for(
        var i = 0;
        i < schools.length;
        i++
    ){

        if(
            schools[i] &&
            schools[i].schoolId
        ){

            ids.push(
                String(
                    schools[i].schoolId
                )
            );

        }

    }


    if(
        ids.length === 0
    ){

        return "aucune_ecole";

    }


    /*
     * Trier les IDs permet d'avoir
     * exactement la même clé depuis
     * Primaire ou depuis Secondaire.
     */

    ids.sort();


    /*
     * Deux écoles :
     *
     * CAISSE-ID1-ID2
     */

    if(
        ids.length >= 2
    ){

        return (
            "CAISSE-" +
            ids[0] +
            "-" +
            ids[1]
        );

    }


    /*
     * Une seule école pour l'instant.
     */

    return (
        "CAISSE-" +
        ids[0]
    );

}

                "masomoCaisseMotif"
            ).value.trim();


        var beneficiaire =
            document.getElementById(
                "masomoCaisseBeneficiaire"
            ).value.trim();


        var montant =
            Number(
                document.getElementById(
                    "masomoCaisseMontant"
                ).value
            );


        var note =
            document.getElementById(
                "masomoCaisseNote"
            ).value.trim();


        if(
            !motif
        ){

            alert(
                "Veuillez indiquer le motif."
            );

            return;

        }


        if(
            !montant ||
            montant <= 0
        ){

            alert(
                "Veuillez entrer un montant valide."
            );

            return;

        }


        var phone =
            normalizePhone(
                window.currentPhone
            );


        if(!phone){

            alert(
                "Caissier introuvable."
            );

            return;

        }


        var schools =
            await masomoDoubleGetSchoolsForUser();


        var caisseKey =
            masomoCaisseGetSharedKey(
                schools
            );


        var ref =
            db.ref(
                "caisseCommune/" +
                caisseKey +
                "/operations"
            ).push();


        var operation = {

            id:
                ref.key,

            type:
                type,

            section:
                section,

            motif:
                motif,

            beneficiaire:
                beneficiaire,

            montant:
                montant,

            note:
                note,

            caissier:
                phone,

            createdAt:
                Date.now(),

            date:
                new Date().toLocaleDateString(
                    "fr-FR"
                ),

            heure:
                new Date().toLocaleTimeString(
                    "fr-FR"
                ),

            statut:
                "valide"

        };


        showLoader();


        await ref.set(
            operation
        );


        /*
         * Petit historique dans chaque école.
         *
         * Cela permet au Responsable de retrouver
         * l'opération depuis sa section.
         */

        var updates =
            {};


        for(
            var i = 0;
            i < schools.length;
            i++
        ){

            updates[
                "schools/" +
                schools[i].schoolId +
                "/caisseHistorique/" +
                ref.key
            ] =
                operation;

        }


        await db.ref().update(
            updates
        );


        hideLoader();


        alert(
            "✅ Opération enregistrée."
        );


        ouvrirCaisseCommune();

    }
    catch(error){

        hideLoader();

        console.error(
            "Erreur enregistrement caisse :",
            error
        );

        alert(
            error.message ||
            "Impossible d'enregistrer l'opération."
        );

    }

}

function masomoCaisseStartNotificationListener(){

    var phone =
        normalizePhone(
            window.currentPhone
        );


    if(!phone){
        return;
    }


    /*
     * Réponses du responsable
     */

    var messageRef =
        db.ref(
            "cashierMessages/" +
            phone
        );


    if(
        window.masomoCaisseMessageListener
    ){

        messageRef.off(
            "value",
            window.masomoCaisseMessageListener
        );

    }


    window.masomoCaisseMessageListener =
        function(snapshot){

            var dot =
                document.getElementById(
                    "masomoCaisseMessageDot"
                );


            if(!dot){
                return;
            }


            var unread =
                false;


            snapshot.forEach(
                function(item){

                    var data =
                        item.val() || {};


                    if(
                        data.read === false ||
                        data.lu === false
                    ){

                        unread =
                            true;

                    }

                }
            );


            dot.style.display =
                unread
                ? "block"
                : "none";

        };


    messageRef.on(
        "value",
        window.masomoCaisseMessageListener
    );

}

async function masomoCaisseSendMessage(){

    try{

        var subjectElement =
            document.getElementById(
                "masomoCaisseMessageSubject"
            );


        var field =
            document.getElementById(
                "masomoCaisseMessage"
            );


        if(
            !field ||
            !subjectElement
        ){

            return;

        }


        var subject =
            subjectElement.value.trim();


        var message =
            field.value.trim();


        if(!subject){

            alert(
                "Veuillez indiquer l'objet du message."
            );

            subjectElement.focus();

            return;

        }


        if(!message){

            alert(
                "Veuillez écrire votre message."
            );

            field.focus();

            return;

        }


        var phone =
            normalizePhone(
                window.currentPhone
            );


        if(!phone){

            alert(
                "Caissier introuvable."
            );

            return;

        }


        var schools =
            await masomoDoubleGetSchoolsForUser();


        if(
            !schools ||
            schools.length === 0
        ){

            alert(
                "Aucune école liée à ce compte."
            );

            return;

        }


        /*
         * =====================================================
         * UNE SEULE RÉFÉRENCE POUR LE MESSAGE
         * =====================================================
         */

        var id =
            db.ref().push().key;


        var createdAt =
            Date.now();


        /*
         * On prépare plusieurs chemins Firebase.
         *
         * Le message reste identique dans les écoles
         * concernées.
         */

        var updates =
            {};


        for(
            var i = 0;
            i < schools.length;
            i++
        ){

            var school =
                schools[i] || {};


            var schoolId =
                school.schoolId;


            if(!schoolId){

                continue;

            }


            var section =
                school.section ||
                "non-definie";


            var data = {

                id:
                    id,

                subject:
                    subject,

                message:
                    message,

                from:
                    phone,

                fromRole:
                    "cashier",

                senderRole:
                    "cashier",

                section:
                    section,

                schoolId:
                    schoolId,

                createdAt:
                    createdAt,

                read:
                    false,

                lu:
                    false,

                status:
                    "nouveau"

            };


            /*
             * Boîte du Responsable
             */

            updates[
                "schools/" +
                schoolId +
                "/responsableMessages/" +
                id
            ] =
                data;


            /*
             * Index spécifique caissier.
             * Permet de retrouver facilement
             * les messages envoyés.
             */

            updates[
                "schools/" +
                schoolId +
                "/cashierMessages/" +
                id
            ] =
                data;

        }


        showLoader();


        await db.ref().update(
            updates
        );


        hideLoader();


        var modal =
            document.getElementById(
                "masomoCaisseMessageModal"
            );


        if(modal){
            modal.remove();
        }


        alert(
            "✅ Message envoyé au responsable."
        );


        /*
         * Actualiser le point vert
         */

        if(
            typeof masomoCaisseStartNotificationListener ==
            "function"
        ){

            masomoCaisseStartNotificationListener();

        }

    }
    catch(error){

        hideLoader();

        console.error(
            "Erreur message caissier :",
            error
        );

        alert(
            error.message ||
            "Impossible d'envoyer le message."
        );

    }

}

   ============================================================ */

async function masomoCaisseSendDossier(){

    try{

        var titleElement =
            document.getElementById(
                "masomoCaisseDossierTitle"
            );


        var contentElement =
            document.getElementById(
                "masomoCaisseDossierContent"
            );


        var sectionElement =
            document.getElementById(
                "masomoCaisseDossierSection"
            );


        var montantElement =
            document.getElementById(
                "masomoCaisseDossierMontant"
            );


        if(
            !titleElement ||
            !contentElement ||
            !sectionElement
        ){

            return;

        }


        var title =
            titleElement.value.trim();


        var content =
            contentElement.value.trim();


        var section =
            sectionElement.value;


        var montant =
            montantElement
            ? Number(
                montantElement.value
              ) || 0
            : 0;


        if(!title){

            alert(
                "Veuillez donner un nom au dossier."
            );

            titleElement.focus();

            return;

        }


        if(!content){

            alert(
                "Veuillez renseigner le contenu du dossier."
            );

            contentElement.focus();

            return;

        }


        var phone =
            normalizePhone(
                window.currentPhone
            );


        if(!phone){

            alert(
                "Caissier introuvable."
            );

            return;

        }


        var schools =
            await masomoDoubleGetSchoolsForUser();


        if(
            !schools ||
            schools.length === 0
        ){

            alert(
                "Aucune école liée à ce compte."
            );

            return;

        }


        var id =
            db.ref().push().key;


        var createdAt =
            Date.now();


        var updates =
            {};


        for(
            var i = 0;
            i < schools.length;
            i++
        ){

            var school =
                schools[i] || {};


            var schoolId =
                school.schoolId;


            if(!schoolId){

                continue;

            }


            var schoolSection =
                school.section ||
                "non-definie";


            var dossier = {

                id:
                    id,

                title:
                    title,

                content:
                    content,

                amount:
                    montant,

                section:
                    section,

                schoolSection:
                    schoolSection,

                sharedBy:
                    phone,

                sharedByRole:
                    "cashier",

                role:
                    "cashier",

                schoolId:
                    schoolId,

                createdAt:
                    createdAt,

                status:
                    "nouveau",

                read:
                    false,

                lu:
                    false

            };


            /*
             * Dossier reçu par le Responsable
             */

            updates[
                "schools/" +
                schoolId +
                "/dossiersResponsable/" +
                id
            ] =
                dossier;


            /*
             * Copie dans les dossiers envoyés
             * du caissier.
             */

            updates[
                "schools/" +
                schoolId +
                "/cashierDossiers/" +
                id
            ] =
                dossier;

        }


        showLoader();


        await db.ref().update(
            updates
        );


        hideLoader();


        var modal =
            document.getElementById(
                "masomoCaisseDossierModal"
            );


        if(modal){
            modal.remove();
        }


        alert(
            "✅ Dossier partagé avec le responsable."
        );

    }
    catch(error){

        hideLoader();

        console.error(
            "Erreur partage dossier :",
            error
        );

        alert(
            error.message ||
            "Impossible de partager le dossier."
        );

    }

}


/* ============================================================
   MARQUER LES MESSAGES CAISSIER COMME LUS
   ============================================================ */

async function masomoCaisseMarquerMessagesLus(){

    try{

        var phone =
            normalizePhone(
                window.currentPhone
            );


        if(!phone){
            return;
        }


        var schools =
            await masomoDoubleGetSchoolsForUser();


        var updates =
            {};


        for(
            var i = 0;
            i < schools.length;
            i++
        ){

            var schoolId =
                schools[i].schoolId;


            if(!schoolId){
                continue;
            }


            var snap =
                await db.ref(
                    "schools/" +
                    schoolId +
                    "/cashierMessages"
                ).once("value");


            var data =
                snap.val() || {};


            var ids =
                Object.keys(data);


            for(
                var j = 0;
                j < ids.length;
                j++
            ){

                var item =
                    data[
                        ids[j]
                    ] || {};


                /*
                 * Ne modifier que les messages
                 * adressés au caissier.
                 */

                if(
                    item.toRole ==
                    "cashier" &&
                    (
                        item.to ==
                        phone ||
                        item.recipient ==
                        phone
                    )
                ){

                    updates[
                        "schools/" +
                        schoolId +
                        "/cashierMessages/" +
                        ids[j] +
                        "/read"
                    ] =
                        true;


                    updates[
                        "schools/" +
                        schoolId +
                        "/cashierMessages/" +
                        ids[j] +
                        "/lu"
                    ] =
                        true;

                }

            }

        }


        if(
            Object.keys(
                updates
            ).length > 0
        ){

            await db.ref().update(
                updates
            );

        }

    }
    catch(error){

        console.error(
            "Erreur lecture messages :",
            error
        );

    }

}

async function masomoDemanderAutorisationCaissier(){

    var phone =
        window.currentPhone;

    if(!phone){

        alert(
            "Administrateur introuvable."
        );

        return;

    }

    showLoader();

    try{

        var adminSnap =
            await db.ref(
                "users/" +
                phone
            ).once("value");

        if(!adminSnap.exists()){

            throw new Error(
                "Administrateur introuvable."
            );

        }

        var admin =
            adminSnap.val() || {};

        if(
            admin.role !=
            "admin"
        ){

            throw new Error(
                "Seul l'administrateur peut demander un code caissier."
            );

        }

        var schoolId =
            admin.schoolId;

        if(!schoolId){

            throw new Error(
                "École introuvable."
            );

        }

        var schoolSnap =
            await db.ref(
                "schools/" +
                schoolId
            ).once("value");

        if(!schoolSnap.exists()){

            throw new Error(
                "École introuvable."
            );

        }

        var school =
            schoolSnap.val() || {};

        var section =
            masomoDoubleGetSection(
                school
            );

        /*
         * Vérifier une demande existante
         */

        var requestsSnap =
            await db.ref(
                "cashierRequests"
            ).once("value");

        var exists =
            false;

        requestsSnap.forEach(
            function(child){

                var d =
                    child.val() || {};

                if(
                    d.schoolId ==
                    schoolId &&
                    d.statut ==
                    "pending"
                ){

                    exists =
                        true;

                }

            }
        );

        if(exists){

            throw new Error(
                "Une demande de caissier est déjà en attente."
            );

        }

        var ref =
            db.ref(
                "cashierRequests"
            ).push();

        await ref.set({

            demandeId:
                ref.key,

            schoolId:
                schoolId,

            schoolName:
                school.schoolName ||
                "",

            section:
                section,

            role:
                "cashier",

            demandePar:
                phone,

            demandeParNom:
                admin.name ||
                admin.nom ||
                admin.directorName ||
                "",

            statut:
                "pending",

            inviteCode:
                "",

            createdAt:
                Date.now(),

            validatedBy:
                "",

            validatedAt:
                0

        });

        hideLoader();

        var zone =
            document.getElementById(
                "generatedInvite"
            );

        if(zone){

            zone.style.display =
                "block";

            zone.innerHTML = `

                <div style="
                    background:#fff8e1;
                    border:1px solid #ffcc80;
                    border-radius:12px;
                    padding:15px;
                    text-align:center;
                ">

                    <h3 style="
                        color:#ef6c00;
                        margin-top:0;
                    ">
                        ⏳ Demande envoyée
                    </h3>

                    <p style="
                        color:#555;
                        font-size:13px;
                        line-height:1.5;
                    ">

                        La demande de caissier
                        a été envoyée à MASOMO.

                    </p>

                    <b>
                        ${
                            masomoDoubleEscape(
                                school.schoolName ||
                                ""
                            )
                        }
                    </b>

                    <br>

                    Section :
                    <b>
                        ${
                            masomoDoubleEscape(
                                section
                            )
                        }
                    </b>

                    <p style="
                        font-size:12px;
                        color:#777;
                    ">

                        Le code CAI apparaîtra
                        après validation MASOMO.

                    </p>

                </div>

            `;

        }

        masomoSurveillerCaissier(
            ref.key
        );

    }
    catch(error){

        hideLoader();

        console.error(

function masomoSurveillerCaissier(
    demandeId
){

    if(
        window.masomoCashierListenerId
    ){

        db.ref(
            "cashierRequests/" +
            window.masomoCashierListenerId
        ).off("value");

    }

    window.masomoCashierListenerId =
        demandeId;

    db.ref(
        "cashierRequests/" +
        demandeId
    ).on(
        "value",
        function(snapshot){

            if(
                !snapshot.exists()
            ){
                return;
            }

            var demande =
                snapshot.val() || {};

            if(
                demande.statut !=
                "approved"
            ){
                return;
            }

            if(
                !demande.inviteCode
            ){
                return;
            }

            var zone =
                document.getElementById(
                    "generatedInvite"
                );

            if(!zone){
                return;
            }

            zone.style.display =
                "block";

            zone.innerHTML = `

                <div style="
                    background:#e8f5e9;
                    border:1px solid #81c784;
                    border-radius:12px;
                    padding:15px;
                    text-align:center;
                ">

                    <h3 style="
                        color:#2e7d32;
                        margin-top:0;
                    ">
                        ✅ Caissier autorisé
                    </h3>

                    <p style="
                        color:#555;
                        font-size:13px;
                    ">
                        MASOMO a validé la demande.
                    </p>

                    <p style="
                        font-weight:bold;
                    ">
                        Code à remettre au caissier :
                    </p>

                    <h2 style="
                        color:#1f4cff;
                        letter-spacing:3px;
                    ">
                        ${
                            masomoDoubleEscape(
                                demande.inviteCode
                            )
                        }
                    </h2>

                </div>

            `;

            db.ref(
                "cashierRequests/" +
                demandeId
            ).off("value");

        }
    );

}

   MASOMO :
   AUTORISER CAISSIER
   ============================================================ */

async function accepterCaissierMasomo(
    demandeId
){

    if(
        !confirm(
            "Autoriser cette demande de caissier ?"
        )
    ){

        return;

    }

    showLoader();

    try{

        var snap =
            await db.ref(
                "cashierRequests/" +
                demandeId
            ).once("value");

        if(!snap.exists()){

            throw new Error(
                "Demande introuvable."
            );

        }

        var demande =
            snap.val() || {};

        if(
            demande.statut !=
            "pending"
        ){

            throw new Error(
                "Cette demande a déjà été traitée."
            );

        }

        var chars =
            "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

        var code =
            "CAI";

        for(
            var i = 0;
            i < 7;
            i++
        ){

            code +=
                chars.charAt(
                    Math.floor(
                        Math.random() *
                        chars.length
                    )
                );

        }

        var existing =
            await db.ref(
                "invitations/" +
                code
            ).once("value");

        if(existing.exists()){

            throw new Error(
                "Code déjà existant. Réessayez."
            );

        }

        await db.ref(
            "invitations/" +
            code
        ).set({

            code:
                code,

            schoolId:
                demande.schoolId,

            role:
                "cashier",

            approved:
                true,

            used:
                false,

            usedBy:
                "",

            usedAt:
                0,

            validatedBy:
                window.currentPhone,

            validatedAt:
                Date.now(),

            createdAt:
                Date.now()

        });

        await db.ref(
            "cashierRequests/" +
            demandeId
        ).update({

            statut:
                "approved",

            inviteCode:
                code,

            validatedBy:
                window.currentPhone,

            validatedAt:
                Date.now()

        });

        hideLoader();

        alert(
            "✅ Caissier autorisé.\n\n" +
            "Code : " +
            code
        );

        afficherDemandesCaissierMasomo();

    }
    catch(error){

        hideLoader();

        alert(
            error.message ||
            "Impossible d'autoriser le caissier."
        );

    }

}

async function refuserCaissierMasomo(

){

    var raison =

    if(

    ){

        return;

    }

    showLoader();

    try{

        await db.ref(
            "cashierRequests/" +
            demandeId
        ).update({

            statut:
                "rejected",

            raison:
                raison,

            validatedBy:
                window.currentPhone,

            validatedAt:
                Date.now()

        });

        hideLoader();

        alert(
            "Demande refusée."
        );

        afficherDemandesCaissierMasomo();

    }
    catch(error){

        hideLoader();

        alert(
            error.message ||
            "Impossible de refuser."
        );

    }

}


/* ============================================================
   AJOUTER L'ECOUTEUR DES DEMANDES CAISSIER A MASOMO
   ============================================================ */

function masomoInitialiserDemandesCaissier(){

    if(
        window.masomoCashierListener
    ){

        db.ref(
            "cashierRequests"
        ).off(
            "value",
            window.masomoCashierListener
        );

    }

    window.masomoCashierListener =
        function(snapshot){

            window.masomoCashierRequests =
                snapshot.val() || {};

            afficherDemandesCaissierMasomo();

        };

    db.ref(
        "cashierRequests"
    ).on(
        "value",
        window.masomoCashierListener
    );

}


/* ============================================================
   LANCER LE LISTENER QUAND MASOMO EST OUVERT
   ============================================================ */

var masomoDoubleOriginalOpenControle =
    window.openControleMasomo;

window.openControleMasomo =
    function(){

        if(
            typeof masomoDoubleOriginalOpenControle ==
            "function"
        ){

            masomoDoubleOriginalOpenControle();

        }

        setTimeout(
            function(){

                masomoInitialiserDemandesCaissier();

            },
            800
        );

    };


/* ============================================================
   FIN
   ============================================================ */

</script>

// SAUVEGARDER LA SESSION ET LE PROFIL EN CACHE
// Ne bloque jamais la connexion
// ============================================================

function saveSession(phone, user){

    var numero =
        normalizePhone(phone);


    if(!numero){

        return;

    }


    try{

        // Téléphone de session
        localStorage.setItem(
            "masomoUser",
            numero
        );


        // Profil utilisateur
        if(user){

            localStorage.setItem(
                "masomoUserData_" + numero,
                JSON.stringify(user)
            );

        }

    }
    catch(error){

        console.warn(
            "Cache session indisponible :",
            error
        );

    }

}

// récupérer connexion
function getSession(){

    return localStorage.getItem("masomoUser");

}

// ============================================================
// RÉCUPÉRER LE PROFIL UTILISATEUR DEPUIS LE CACHE
// Permet une ouverture rapide sans attendre Firebase
// ============================================================

function getCachedUser(phone){

    var numero =
        normalizePhone(phone);


    if(!numero){

        return null;

    }


    try{

        var data =
            localStorage.getItem(
                "masomoUserData_" + numero
            );


        if(!data){

            return null;

        }


        return JSON.parse(data);

    }
    catch(error){

        console.warn(
            "Impossible de lire le profil en cache :",
            error
        );

        return null;

    }

}

// supprimer connexion
function logout(){

    auth.signOut()
    .then(()=>{

        localStorage.removeItem("masomoUser");

        if(window.currentSchoolId){

            localStorage.removeItem(
                "adminData_"+window.currentSchoolId
            );

        }

        window.currentPhone = null;
        window.currentRole = null;
        window.currentSchoolId = null;
        window.loginUserData = null;
        window.currentInvite = null;

        location.reload();

    })
    .catch(error=>{

        alert(error.message);

    });

}

// CONNEXION UTILISATEUR
// Utilise le profil en cache immédiatement après Auth
// puis synchronise Firebase en arrière-plan
// ============================================================

async function loginUser(){

    let passwordElement =
        document.getElementById(
            "loginPassword"
        );


    let password =
        passwordElement
        ? passwordElement.value.trim()
        : "";


    if(!password){

        alert(
            "Veuillez entrer votre mot de passe."
        );

        return;

    }


    let login =
        window.loginUserData;


    if(!login){

        alert(
            "Utilisateur introuvable."
        );

        return;

    }


    if(!login.email){

        alert(
            "Ce compte n'est pas encore activé."
        );

        return;

    }


    let phone =
        normalizePhone(
            window.currentPhone ||
            login.phone ||
            ""
        );


    if(!phone){

        alert(
            "Numéro de téléphone introuvable."
        );

        return;

    }


    showLoader();


    try{

        // ====================================================
        // 1. AUTHENTIFICATION FIREBASE
        // ====================================================

        await auth.signInWithEmailAndPassword(

            login.email,

            password

        );


        let uid =
            auth.currentUser.uid;


        // ====================================================
        // 2. CHERCHER LE PROFIL DANS LE CACHE
        // ====================================================

        let cachedUser = null;


        try{

            if(
                typeof getCachedUser ===
                "function"
            ){

                cachedUser =
                    getCachedUser(phone);

            }

        }
        catch(e){

            console.warn(
                "Lecture cache impossible :",
                e
            );

        }


        if(!cachedUser){

            try{

                let localData =
                    localStorage.getItem(

                        "masomoUserData_" +
                        phone

                    );


                if(localData){

                    cachedUser =
                        JSON.parse(
                            localData
                        );

                }

            }
            catch(e){

                console.warn(
                    "Cache invalide."
                );

            }

        }


        // ====================================================
        // 3. SI LE PROFIL EST EN CACHE
        // OUVRIR IMMÉDIATEMENT L'ESPACE
        // ====================================================

        if(
            cachedUser &&
            cachedUser.role
        ){

            let user =
                Object.assign(
                    {},
                    cachedUser
                );


            user.phone =
                phone;


            user.uid =
                uid;


            /*
             * Variables globales immédiatement
             */

            window.currentPhone =
                phone;

            window.currentRole =
                user.role;

            window.currentTeacherClass =
                user.classe || "";

            window.currentSchoolId =
                user.schoolId || "";


            saveSession(
                phone
            );


            /*
             * Mettre le nouveau UID
             * dans le cache.
             */

            try{

                localStorage.setItem(

                    "masomoUserData_" +
                    phone,

                    JSON.stringify(
                        user
                    )

                );

            }
            catch(e){}


            hideLoader();


            // =================================================
            // OUVERTURE IMMÉDIATE
            // =================================================

            if(
                user.role ===
                "superadmin" ||

                normalizePhone(
                    phone
                ) ===
                normalizePhone(
                    "243994044329"
                )
            ){

                openControleMasomo();

            }

            else if(
                user.role ===
                "admin"
            ){

                openAdmin();

            }

            else if(
                user.role ===
                "teacher"
            ){

                openTeacher();

            }

            else if(
                user.role ===
                "parent"
            ){

                openParent();

            }

            else if(
                user.role ===
                "student"
            ){

                openStudent();

            }

            else if(
                user.role ===
                "cashier"
            ){

                if(
                    typeof openCashier ===
                    "function"
                ){

                    openCashier();

                }

                else if(
                    typeof openCaissier ===
                    "function"
                ){

                    openCaissier();

                }

            }

            else if(
                user.role ===
                "responsable"
            ){

                if(
                    typeof ouvrirEspaceResponsable ===
                    "function"
                ){

                    ouvrirEspaceResponsable();

                }

            }

            else{

                alert(
                    "Type de compte inconnu."
                );

            }


            // =================================================
            // 4. SYNCHRONISATION FIREBASE EN ARRIÈRE-PLAN
            // =================================================

            db.ref(
                "users/" +
                phone
            )
            .once("value")
            .then(function(snapshot){

                if(!snapshot.exists()){

                    console.warn(
                        "Profil Firebase introuvable."
                    );

                    return;

                }


                let firebaseUser =
                    snapshot.val() || {};


                firebaseUser.uid =
                    uid;


                window.loginUserData =
                    firebaseUser;


                /*
                 * Mettre à jour le cache
                 */

                try{

                    localStorage.setItem(

                        "masomoUserData_" +
                        phone,

                        JSON.stringify(
                            firebaseUser
                        )

                    );

                }
                catch(e){}


                /*
                 * Mettre à jour le UID
                 */

                return db.ref(
                    "users/" +
                    phone
                )
                .update({

                    uid:
                        uid

                });

            })
            .catch(function(error){

                console.warn(
                    "Synchronisation utilisateur :",
                    error
                );

            });


            return;

        }


        // ====================================================
        // 5. PAS DE CACHE
        // PREMIÈRE CONNEXION / ANCIEN APPAREIL
        // ====================================================

        let userSnap =
            await db.ref(
                "users/" +
                phone
            ).once("value");


        if(!userSnap.exists()){

            throw new Error(
                "Compte introuvable."
            );

        }


        let user =
            userSnap.val();


        user.uid =
            uid;


        if(!user.role){

            throw new Error(
                "Type de compte inconnu."
            );

        }


        /*
         * Sauvegarder le profil localement
         */

        try{

            localStorage.setItem(

                "masomoUserData_" +
                phone,

                JSON.stringify(
                    user
                )

            );

        }
        catch(e){}


        /*
         * Sauvegarder UID
         */

        let updates = [];


        updates.push(

            db.ref(
                "users/" +
                phone
            )
            .update({

                uid:
                    uid

            })

        );


        /*
         * UserIndex pour tous sauf superadmin
         */

        if(
            user.role !=
            "superadmin"
        ){

            updates.push(

                db.ref(
                    "userIndex/" +
                    uid
                )
                .set({

                    phone:
                        user.phone ||
                        phone,

                    schoolId:
                        user.schoolId ||
                        "",

                    role:
                        user.role ||
                        ""

                })

            );

        }


        await Promise.all(
            updates
        );


        hideLoader();


        /*
         * Première connexion :
         * utiliser le système existant.
         */

        continuerConnexion(
            user
        );


    }
    catch(error){

        hideLoader();

        console.error(
            "Erreur connexion :",
            error
        );


        switch(
            error.code
        ){

            case "auth/wrong-password":

            case "auth/invalid-credential":

                alert(
                    "Mot de passe incorrect."
                );

                break;


            case "auth/user-not-found":

                alert(
                    "Compte introuvable."
                );

                break;


            case "auth/invalid-email":

                alert(
                    "Adresse e-mail invalide."
                );

                break;


            case "auth/too-many-requests":

                alert(
                    "Trop de tentatives. Réessayez plus tard."
                );

                break;


            case "auth/network-request-failed":

                alert(
                    "Connexion Internet indisponible."
                );

                break;


            default:

                alert(

                    error.message ||
                    "Connexion impossible."

                );

        }

    }

}

function continuerConnexion(user){

        alert(
            "Utilisateur introuvable."
        );

        return;
    }


    if(user.mustChangePassword){

        ouvrirChangerMotDePasse();

        return;

        alert(
            "Type de compte inconnu."
        );

        return;
    }


    if(!user.phone){

        alert(
            "Numéro de téléphone introuvable."
        );

        return;
    }


    window.currentPhone =
        normalizePhone(
            user.phone
        );


    window.currentRole =
        user.role;


    window.currentTeacherClass =
        user.classe || "";


    window.currentSchoolId =
        user.schoolId || "";


    saveSession(
    window.currentPhone,
    user
);


    // ========================================================
    // MASOMO-ECOLE
    // ========================================================

    if(
        user.role == "superadmin" ||
        normalizePhone(user.phone) ==
        normalizePhone("243994044329")
    ){

        openControleMasomo();

        return;
    }


// ========================================================
// ADMIN
// Ouverture rapide avec les données déjà chargées
// Synchronisation de l'école sans double lecture inutile
// ========================================================

if(user.role == "admin"){

    if(!user.schoolId){

        alert(
            "Aucune école associée à ce compte."
        );

        return;
    }


    /*
     * Vérifier d'abord si l'école est déjà
     * disponible dans le cache local.
     */

    var adminCacheKey =
        "adminData_" +
        user.schoolId;


    var adminCache = null;


    try{

        var cacheData =
            localStorage.getItem(
                adminCacheKey
            );


        if(cacheData){

            adminCache =
                JSON.parse(
                    cacheData
                );

        }

    }
    catch(error){

        console.warn(
            "Cache administrateur invalide :",
            error
        );

        adminCache = null;

    }


    /*
     * ========================================================
     * CACHE DISPONIBLE
     * ========================================================
     *
     * On ouvre immédiatement l'espace.
     * Firebase sera vérifié en arrière-plan.
     */

    if(
        adminCache &&
        adminCache.school
    ){

        var cachedSchool =
            adminCache.school;


        /*
         * Vérification locale de l'état
         */

        if(
            cachedSchool.status == "active" &&
            cachedSchool.paymentStatus == "paid"
        ){

            openAdmin(
                user
            );


            /*
             * Actualisation silencieuse
             */

            synchroniserAdminArrierePlan(
                user.schoolId,
                user.phone
            );


            return;

        }

    }


    /*
     * ========================================================
     * PREMIÈRE CONNEXION OU CACHE ABSENT
     * ========================================================
     */

    showLoader();


    db.ref(
        "schools/" +
        user.schoolId
    )
    .once("value")

    .then(function(snapshot){

        if(!snapshot.exists()){

            hideLoader();


            alert(
                "École introuvable."
            );


            return;

        }


        var school =
            snapshot.val() || {};


        /*
         * Sauvegarder l'école dans le cache
         * pour les prochaines ouvertures.
         */

        try{

            localStorage.setItem(

                adminCacheKey,

                JSON.stringify({

                    school:
                        school,

                    schoolId:
                        user.schoolId,

                    phone:
                        user.phone

                })

            );

        }
        catch(error){

            console.warn(
                "Impossible de sauvegarder le cache admin :",
                error
            );

        }


        /*
         * Vérifier l'état réel de l'école
         */

        if(
            school.status == "active" &&
            school.paymentStatus == "paid"
        ){

            hideLoader();


            openAdmin(
                user
            );


            return;

        }


        hideLoader();


        afficherEcoleEnAttente(
            school
        );

    })

    .catch(function(error){

        hideLoader();


        console.error(
            "Erreur chargement école admin :",
            error
        );


        alert(
            error.message ||
            "Impossible de charger l'école."
        );

    });


    return;
}


    // ========================================================
    // ENSEIGNANT
    // ========================================================

    if(user.role == "teacher"){

        openTeacher();

        return;
    }


    // ========================================================
    // PARENT
    // ========================================================

    if(user.role == "parent"){

        openParent();

        return;
    }


    // ========================================================
    // ÉLÈVE
    // ========================================================

    if(user.role == "student"){

        openStudent();

        return;
    }


    // ========================================================
    // CAISSIER
    // ========================================================

    if(
        user.role == "caissier" ||
        user.role == "cashier"
    ){

        if(
            typeof ouvrirEspaceCaissier ==
            "function"
        ){

            ouvrirEspaceCaissier();

        }
        else{

            alert(
                "Espace caissier non disponible."
            );

function enregistrerNotes(){

let classe=document.getElementById("classeNotes").value;

let cours=document.getElementById("coursNotes").value;


let periode=document.getElementById("periodeNotes").value;

let coteMax=parseFloat(
document.getElementById("coteMax").value
);

let dateEvaluation=document.getElementById("dateEvaluation").value;

let coursNom=

document
.getElementById("coursNotes")

.options[
document.getElementById("coursNotes").selectedIndex
]

.getAttribute("data-name")||"";

if(!classe){

alert("Choisissez une classe.");

return;

}

if(!cours){

alert("Choisissez un cours.");

return;

}

if(!periode){

alert("Choisissez une période.");

return;

}

if(isNaN(coteMax)||coteMax<=0){

alert("Entrez une cotation valide.");

return;

}

showLoader();

let promesses=[];

db.ref(
"schools/"+window.currentSchoolId+
"/students"
)

.once("value")

.then(snapshot=>{

snapshot.forEach(item=>{

let eleve=item.val();

if(eleve.className!==classe)return;

let note=parseFloat(

document.getElementById(
"note_"+item.key
).value

);

if(isNaN(note))return;

let pourcentage=(note/coteMax)*100;

let mention="";

if(pourcentage>=80){

mention="Excellent";

}else if(pourcentage>=70){

mention="Très Bien";

}else if(pourcentage>=60){

mention="Bien";

}else if(pourcentage>=50){

mention="Satisfaisant";

}else{

mention="Échec";

}

let noteId="NOT-"+Date.now()+"-"+item.key;

promesses.push(

db.ref(

"schools/"+window.currentSchoolId+

"/notes/"+

item.key+

"/"+

noteId

).set({

id:noteId,

matricule:item.key,

nom:eleve.name,

classe:classe,

coursId:cours,

cours:coursNom,

periode:periode,

note:note,

coteMax:coteMax,

pourcentage:pourcentage,

mention:mention,

dateEvaluation:dateEvaluation,

enseignant:window.currentPhone,

timestamp:Date.now()

})

);

});

return Promise.all(promesses);

})

.then(()=>{

hideLoader();

alert("Les notes ont été enregistrées avec succès.");

ouvrirNotes();

})

.catch(error=>{

hideLoader();

alert(error.message);

});

}

function verifierBadgeDevoirsParent(matricule){

    let phone = normalizePhone(window.currentPhone);

    let badge = document.getElementById(
        "devoirBadge_" + matricule
    );

    if(!badge) return;

    // Par défaut : cacher le point vert
    badge.style.display = "none";

    Promise.all([

        // Dernière consultation des devoirs
        db.ref(
            "parents/" +
            phone +
            "/children/" +
            matricule +
            "/lastDevoirsSeen"
        ).once("value"),

        // Informations de l'enfant
        db.ref(
            "parents/" +
            phone +
            "/children/" +
            matricule
        ).once("value"),

        // Tous les devoirs
        db.ref("devoirs").once("value")

    ])

    .then(([seenSnap, childSnap, devoirsSnap]) => {

        let enfant = childSnap.val();

        if(!enfant){
            return;
        }

        // Dernière fois que le parent a consulté
        let lastSeen = Number(
            seenSnap.val() || 0
        );

        let nouveau = false;

        if(devoirsSnap.exists()){

            devoirsSnap.forEach(item => {

                let d = item.val();

                // Date de création du devoir
                let dateCreation = new Date(
                    d.dateCreation || 0
                ).getTime();

                // Vérifier que le devoir appartient
                // à l'école et à la classe de l'enfant
                if(

                    d.classe === enfant.className &&

                    d.idEcole === enfant.schoolId &&

                    dateCreation > lastSeen

                ){

                    nouveau = true;

                }

            });

        }

        // Afficher le point vert seulement
        // s'il existe un nouveau devoir
        if(nouveau){

            badge.style.display = "block";

        }else{

            badge.style.display = "none";

        }

    })

    .catch(error => {

        console.error(
            "Erreur badge devoirs :",
            error
        );

        badge.style.display = "none";

    });

}

function changerNiveauEcole(niveau){

const primary=
document.getElementById("primaryLevel");

const secondary=
document.getElementById("secondaryLevel");

const primarySection=
document.getElementById("primarySection");

const secondarySection=
document.getElementById("secondarySection");

const primaryCard=
document.getElementById("primaryCard");

const secondaryCard=
document.getElementById("secondaryCard");


if(niveau==="primary" && primary.checked){

secondary.checked=false;
secondary.disabled=true;

primary.disabled=false;

primarySection.style.display="block";
secondarySection.style.display="none";

secondaryCard.style.opacity="0.5";
primaryCard.style.opacity="1";


// décocher secondaire

document
.querySelectorAll(".secondaryClass,.secondaryOption")
.forEach(el=>{
el.checked=false;
});

return;

}


if(niveau==="secondary" && secondary.checked){

primary.checked=false;
primary.disabled=true;

secondary.disabled=false;

secondarySection.style.display="block";
primarySection.style.display="none";

primaryCard.style.opacity="0.5";
secondaryCard.style.opacity="1";


// décocher primaire

document
.querySelectorAll(".primaryClass")
.forEach(el=>{
el.checked=false;
});

return;

}


// Aucun niveau sélectionné

primary.disabled=false;
secondary.disabled=false;

primarySection.style.display="none";
secondarySection.style.display="none";

primaryCard.style.opacity="1";
secondaryCard.style.opacity="1";

}

async function finishJoin(){

showLoader();

try{

    var invite = window.currentInvite;

    if(!invite){

        hideLoader();

        alert("Invitation introuvable.");

        return;
    }


    var phone =
        normalizePhone(window.currentPhone);

    var role =
        invite.role;

    var schoolId =
        invite.schoolId;

    var matricule = "";


    if(role == "parent"){

        var matriculeElement =
            document.getElementById("matricule");

        if(!matriculeElement){

            throw new Error(
                "Champ matricule introuvable."
            );

        }

        matricule =
            matriculeElement.value
            .trim()
            .toUpperCase();


        if(!matricule){

            hideLoader();

            alert(
                "Veuillez saisir le matricule de l'élève."
            );

            return;
        }

    }


    // ============================================================
    // VÉRIFIER L'INVITATION
    // ============================================================

    var inviteSnap =
        await db.ref(
            "invitations/" +
            invite.code
        ).once("value");


    if(!inviteSnap.exists()){

        throw new Error(
            "Invitation introuvable."
        );

    }


    var inv =
        inviteSnap.val();


    if(inv.used){

        throw new Error(
            "Ce code d'invitation a déjà été utilisé."
        );

    }


    // ============================================================
    // PARENT
    // ============================================================

    if(role == "parent"){

        var parentPassword =
            document.getElementById(
                "joinPassword"
            ).value.trim();


        if(!parentPassword){

            throw new Error(
                "Veuillez choisir un mot de passe."
            );

        }


        var parentEmail =
            "par-" +
            phone +
            "@masomo.app";


        await auth.createUserWithEmailAndPassword(
            parentEmail,
            parentPassword
        );


        await auth.currentUser.getIdToken(true);


        var studentSnap =
            await db.ref(
                "schools/" +
                schoolId +
                "/students/" +
                matricule
            ).once("value");


        if(!studentSnap.exists()){

            throw new Error(
                "Matricule élève introuvable."
            );

        }


        var eleve =
            studentSnap.val();


        var parent = {

            phone: phone,

            email: parentEmail,

            uid: auth.currentUser.uid,

            role: "parent",

            schoolId: schoolId,

            studentMatricule: matricule,

            studentName:
                eleve.name,

            name:
                "Parent de " +
                eleve.name,

            authCreated: true,

            createdAt:
                Date.now()

        };


        await Promise.all([

            db.ref(
                "users/" +
                phone
            ).set(parent),

            db.ref(
                "loginIndex/" +
                phone
            ).set({

                email:
                    parentEmail

            }),

            db.ref(
                "schools/" +
                schoolId +
                "/members/" +
                phone
            ).set({

                phone: phone,

                role: "parent",

                name:
                    parent.name,

                studentMatricule:
                    matricule,

                createdAt:
                    Date.now()

            }),

            db.ref(
                "parents/" +
                phone +
                "/children/" +
                matricule
            ).set({

                matricule:
                    matricule,

                name:
                    eleve.name,

                className:
                    eleve.className,

                schoolId:
                    schoolId,

                role:
                    "student"

            }),

            db.ref(
                "invitations/" +
                invite.code
            ).update({

                used: true,

                usedBy:
                    phone,

                usedAt:
                    Date.now()

            })

        ]);


        hideLoader();

        alert(
            "École rejointe avec succès."
        );

        openParent();

        return;
    }


    // ============================================================
    // ENSEIGNANT
    // ============================================================

    if(role == "teacher"){

        var teacherPassword =
            document.getElementById(
                "joinPassword"
            ).value.trim();


        if(!teacherPassword){

            throw new Error(
                "Veuillez choisir un mot de passe."
            );

        }


        var teacherLoginSnap =
            await db.ref(
                "loginIndex/" +
                phone
            ).once("value");


        if(teacherLoginSnap.exists()){

            throw new Error(
                "Ce numéro est déjà inscrit."
            );

        }


        var teachersSnap =
            await db.ref(
                "schools/" +
                schoolId +
                "/teachers"
            ).once("value");


        if(!teachersSnap.exists()){

            throw new Error(
                "Aucun enseignant trouvé."
            );

        }


        var teacher = null;


        teachersSnap.forEach(
            function(child){

                var t =
                    child.val();


                if(
                    normalizePhone(
                        t.telephone
                    ) == phone
                ){

                    teacher =
                        t;

                }

            }
        );


        if(!teacher){

            throw new Error(
                "Cet enseignant n'est pas enregistré dans cette école."
            );

        }


        if(!teacher.email){

            throw new Error(
                "Cet enseignant ne possède pas d'adresse e-mail."
            );

        }


        teacher.phone =
            phone;

        teacher.linked =
            true;


        await auth.createUserWithEmailAndPassword(
            teacher.email,
            teacherPassword
        );


        await auth.currentUser.getIdToken(true);


        teacher.uid =
            auth.currentUser.uid;

        teacher.authCreated =
            true;


        await Promise.all([

            db.ref(
                "users/" +
                phone
            ).set(teacher),

            db.ref(
                "loginIndex/" +
                phone
            ).set({

                email:
                    teacher.email

            }),

            db.ref(
                "schools/" +
                schoolId +
                "/teachers/" +
                teacher.matricule
            ).update({

                linked:
                    true,

                authCreated:
                    true,

                phone:
                    phone,

                uid:
                    teacher.uid

            }),

            db.ref(
                "schools/" +
                schoolId +
                "/members/" +
                teacher.matricule
            ).update({

                phone:
                    phone,

                linked:
                    true,

                uid:
                    teacher.uid

            }),

            db.ref(
                "invitations/" +
                invite.code
            ).update({

                used:
                    true,

                usedBy:
                    phone,

                usedAt:
                    Date.now()

            })

        ]);


        hideLoader();

        alert(
            "École rejointe avec succès."
        );

        openTeacher();

        return;
    }


    // ============================================================
    // ÉLÈVE
    // ============================================================

    if(role == "student"){

        var studentPassword =
            document.getElementById(
                "joinPassword"
            ).value.trim();


        if(!studentPassword){

            throw new Error(
                "Veuillez choisir un mot de passe."
            );

        }


        var studentEmail =
            "stu-" +
            phone +
            "@masomo.app";


        await auth.createUserWithEmailAndPassword(
            studentEmail,
            studentPassword
        );


        await auth.currentUser.getIdToken(true);


        var student = {

            phone:
                phone,

            email:
                studentEmail,

            uid:
                auth.currentUser.uid,

            role:
                "student",

            schoolId:
                schoolId,

            name:
                "Nouvel élève",

            authCreated:
                true,

            createdAt:
                Date.now()

        };


        await Promise.all([

            db.ref(
                "users/" +
                phone
            ).set(student),

            db.ref(
                "loginIndex/" +
                phone
            ).set({

                email:
                    studentEmail

            }),

            db.ref(
                "schools/" +
                schoolId +
                "/members/" +
                phone
            ).set({

                phone:
                    phone,

                role:
                    "student",

                name:
                    student.name,

                uid:
                    student.uid,

                createdAt:
                    Date.now()

            }),

            db.ref(
                "invitations/" +
                invite.code
            ).update({

                used:
                    true,

                usedBy:
                    phone,

                usedAt:
                    Date.now()

            })

        ]);


        hideLoader();

        alert(
            "École rejointe avec succès."
        );

        openStudent();

        return;
    }


    // ============================================================
    // CAISSIER
    // Une seule personne par école
    // Le nouveau remplace automatiquement l'ancien
    // ============================================================

    if(role == "cashier"){

        var cashierPassword =
            document.getElementById(
                "joinPassword"
            ).value.trim();


        if(!cashierPassword){

            throw new Error(
                "Veuillez choisir un mot de passe."
            );

        }


        var cashierEmail =
            "cai-" +
            phone +
            "@masomo.app";


        await auth.createUserWithEmailAndPassword(
            cashierEmail,
            cashierPassword
        );


        await auth.currentUser.getIdToken(true);


        var ancienCaissierSnap =
            await db.ref(
                "schools/" +
                schoolId +
                "/caissier"
            ).once("value");


        var ancienCaissier =
            ancienCaissierSnap.val();


        var caissierData = {

            phone:
                phone,

            email:
                cashierEmail,

            uid:
                auth.currentUser.uid,

            role:
                "cashier",

            schoolId:
                schoolId,

            createdAt:
                Date.now()

        };


        await db.ref(
            "users/" +
            phone
        ).set(caissierData);


        await db.ref(
            "loginIndex/" +
            phone
        ).set({

            email:
                cashierEmail

        });


        await db.ref(
            "schools/" +
            schoolId +
            "/caissier"
        ).set({

            phone:
                phone,

            uid:
                auth.currentUser.uid,

            email:
                cashierEmail,

            replacedPhone:
                ancienCaissier
                ?
                ancienCaissier.phone || ""
                :
                "",

            updatedAt:
                Date.now()

        });


        await db.ref(
            "schools/" +
            schoolId +
            "/members/" +
            phone
        ).update({

            phone:
                phone,

            role:
                "cashier",

            uid:
                auth.currentUser.uid,

            createdAt:
                Date.now()

        });


        await db.ref(
            "invitations/" +
            invite.code
        ).update({

            used:
                true,

            usedBy:
                phone,

            usedAt:
                Date.now()

        });


        hideLoader();


        alert(
            "💰 Vous êtes maintenant le caissier de l'école."
        );


        if(
            typeof openCashier ==
            "function"
        ){

            openCashier();

        }
        else {

            openAdmin();

        }

        return;
    }


    // ============================================================
    // RESPONSABLE
    //
    // IMPORTANT :
    // Le responsable possède UN SEUL compte.
    //
    // Il peut être responsable :
    // - d'une seule école
    // - ou de deux écoles : primaire + secondaire
    //
    // Le compte administrateur qui a généré le code
    // n'est jamais transformé en responsable.
    // ============================================================

    if(role == "responsable"){

        var responsablePasswordElement =
            document.getElementById(
                "joinPassword"
            );


        var responsablePassword = "";


        if(responsablePasswordElement){

            responsablePassword =
                responsablePasswordElement.value.trim();

        }


        // ========================================================
        // VÉRIFIER SI CE NUMÉRO POSSÈDE DÉJÀ UN COMPTE
        // ========================================================

        var responsableLoginSnap =
            await db.ref(
                "loginIndex/" +
                phone
            ).once("value");


        // ========================================================
        // CAS 1 : RESPONSABLE DÉJÀ EXISTANT
        // ========================================================

        if(responsableLoginSnap.exists()){

            var responsableUserSnap =
                await db.ref(
                    "users/" +
                    phone
                ).once("value");


            if(!responsableUserSnap.exists()){

                throw new Error(
                    "Le compte associé à ce numéro est introuvable."
                );

            }


            var responsableExistant =
                responsableUserSnap.val();


            /*
             * Le numéro possède déjà un compte.
             * Il doit obligatoirement être responsable.
             */

            if(
                responsableExistant.role !=
                "responsable"
            ){

                throw new Error(
                    "Ce numéro possède déjà un autre type de compte."
                );

            }


            /*
             * Vérifier si cette école est déjà liée
             */

            var access =
                responsableExistant.schoolsAccess ||
                {};


            if(
                access[schoolId]
            ){

                throw new Error(
                    "Cette école est déjà liée à ce compte responsable."
                );

            }


            /*
             * Ajouter la nouvelle école
             */

            access[schoolId] = {

                schoolId:
                    schoolId,

                role:
                    "responsable",

                active:
                    true,

                joinedAt:
                    Date.now()

            };


            responsableExistant.schoolsAccess =
                access;


            responsableExistant.responsableActive =
                true;


            /*
             * Garder l'ancien schoolId pour compatibilité
             * avec l'ancien système.
             */

            if(
                !responsableExistant.schoolId
            ){

                responsableExistant.schoolId =
                    schoolId;

            }


            await db.ref(
                "users/" +
                phone
            ).update({

                schoolsAccess:
                    access,

                responsableActive:
                    true

            });


            /*
             * Ajouter le responsable
             * dans la nouvelle école
             */

            await db.ref(
                "schools/" +
                schoolId +
                "/responsable"
            ).set({

                phone:
                    phone,

                uid:
                    responsableExistant.uid || "",

                email:
                    responsableExistant.email || "",

                active:
                    true,

                updatedAt:
                    Date.now()

            });


            /*
             * Ajouter comme membre
             */

            await db.ref(
                "schools/" +
                schoolId +
                "/members/" +
                phone
            ).set({

                phone:
                    phone,

                role:
                    "responsable",

                uid:
                    responsableExistant.uid || "",

                createdAt:
                    Date.now()

            });


            /*
             * Marquer le nouveau code comme utilisé
             */

            await db.ref(
                "invitations/" +
                invite.code
            ).update({

                used:
                    true,

                usedBy:
                    phone,

                usedAt:
                    Date.now()

            });


            hideLoader();


            alert(
                "✅ Cette école a été ajoutée à votre espace responsable."
            );


            /*
             * Recharger les informations
             */

            window.currentPhone =
                phone;

            window.currentRole =
                "responsable";


            ouvrirEspaceResponsable();

            return;

        }


        // ========================================================
        // CAS 2 : NOUVEAU RESPONSABLE
        // ========================================================

        if(!responsablePassword){

            throw new Error(
                "Veuillez choisir un mot de passe."
            );

        }


        var responsableEmail =
            "res-" +
            phone +
            "@masomo.app";


        /*
         * Créer le compte Firebase Auth
         */

        await auth.createUserWithEmailAndPassword(
            responsableEmail,
            responsablePassword
        );


        await auth.currentUser.getIdToken(true);


        var nouveauResponsable = {

            phone:
                phone,

            email:
                responsableEmail,

            uid:
                auth.currentUser.uid,

            role:
                "responsable",

            schoolId:
                schoolId,

            responsableActive:
                true,

            authCreated:
                true,

            createdAt:
                Date.now(),

            schoolsAccess: {}

        };


        /*
         * Première école
         */

        nouveauResponsable.schoolsAccess[
            schoolId
        ] = {

            schoolId:
                schoolId,

            role:
                "responsable",

            active:
                true,

            joinedAt:
                Date.now()

        };


        await Promise.all([

            /*
             * Compte utilisateur
             */

            db.ref(
                "users/" +
                phone
            ).set(
                nouveauResponsable
            ),


            /*
             * Index connexion
             */

            db.ref(
                "loginIndex/" +
                phone
            ).set({

                email:
                    responsableEmail

            }),


            /*
             * Responsable de l'école
             */

            db.ref(
                "schools/" +
                schoolId +
                "/responsable"
            ).set({

                phone:
                    phone,

                uid:
                    auth.currentUser.uid,

                email:
                    responsableEmail,

                active:
                    true,

                updatedAt:
                    Date.now()

            }),


            /*
             * Membre de l'école
             */

            db.ref(
                "schools/" +

// ============================================================
// OUVRIR L'ESPACE ADMINISTRATEUR
//
// - Utilise le cache immédiatement
// - N'attend pas Firebase si les données locales existent
// - Une seule synchronisation arrière-plan
// - Évite les doubles lectures Firebase
// - Compatible avec actualiserAdmin(true)
// ============================================================

function openAdmin(user){

    window.currentRole =
        "admin";


    // ========================================================
    // RÉCUPÉRER LE PROFIL
    // ========================================================

    if(!user){

        try{

            user =
                getCachedUser(
                    window.currentPhone
                );

        }
        catch(error){

            console.warn(
                "Lecture cache utilisateur :",
                error
            );

        }

    }


    if(!user){

        alert(
            "Utilisateur introuvable."
        );

        return;

    }


    // ========================================================
    // INFORMATIONS COMPTE
    // ========================================================

    var phone =
        normalizePhone(
            user.phone ||
            window.currentPhone ||
            ""
        );


    var schoolId =
        user.schoolId ||
        window.currentSchoolId ||
        "";


    if(!schoolId){

        alert(
            "École introuvable pour ce compte."
        );

        return;

    }


    window.currentPhone =
        phone;


    window.currentSchoolId =
        schoolId;


    // ========================================================
    // CACHE ÉCOLE
    // ========================================================

    var cacheKey =
        "adminData_" +
        schoolId;


    var cache = null;


    try{

        cache =
            localStorage.getItem(
                cacheKey
            );

    }
    catch(error){

        console.warn(
            "Lecture cache école impossible :",
            error
        );

    }


    // ========================================================
    // SI CACHE DISPONIBLE
    // OUVERTURE IMMÉDIATE
    // ========================================================

    if(cache){

        try{

            var data =
                JSON.parse(
                    cache
                );


            if(
                data &&
                data.school
            ){

                var school =
                    data.school;


                window.adminCache =
                    school;


                window.currentSchool =
                    school;


                /*
                 * Vérification locale de l'accès.
                 *
                 * Aucun appel Firebase ici.
                 */

                if(
                    typeof verifierEssai ===
                    "function"
                ){

                    if(
                        !verifierEssai(
                            school
                        )
                    ){

                        return;

                    }

                }


                // =================================================
                // AFFICHAGE IMMÉDIAT
                // =================================================

                afficherAdmin(
                    school
                );


                surveillerEssai();


                // =================================================
                // UNE SEULE SYNCHRONISATION ARRIÈRE-PLAN
                // =================================================

                synchroniserAdminArrierePlan(
                    schoolId,
                    phone
                );


                return;

            }

        }
        catch(error){

            console.warn(
                "Cache admin invalide :",
                error
            );

        }

    }


    // ========================================================
    // PREMIÈRE OUVERTURE
    // Aucun cache disponible
    // ========================================================

    showLoader();


    db.ref(
        "schools/" +
        schoolId
    )
    .once("value")

    .then(function(snapshot){

        if(
            !snapshot.exists()
        ){

            throw new Error(
                "École introuvable."
            );

        }


        var school =
            snapshot.val() || {};


        // ====================================================
        // VÉRIFICATION ABONNEMENT / ESSAI
        // ====================================================

        if(
            typeof verifierEssai ===
            "function"
        ){

            if(
                !verifierEssai(
                    school
                )
            ){

                hideLoader();

                return;

            }

        }


        window.adminCache =
            school;


        window.currentSchool =
            school;


        // ====================================================
        // SAUVEGARDER LE CACHE
        // ====================================================

        try{

            localStorage.setItem(

                cacheKey,

                JSON.stringify({

                    school:
                        school,

                    schoolId:
                        schoolId,

                    phone:
                        phone

                })

            );

        }
        catch(error){

            console.warn(
                "Sauvegarde cache admin impossible :",
                error
            );

        }


        hideLoader();


        // ====================================================
        // AFFICHER L'ADMIN
        // ====================================================

        afficherAdmin(
            school
        );


        surveillerEssai();


    })

    .catch(function(error){

        hideLoader();


        console.error(
            "Erreur ouverture admin :",
            error
        );


        alert(
            error.message ||
            "Impossible de charger l'école."
        );

    });

}


// ============================================================
// SYNCHRONISER L'ADMIN EN ARRIÈRE-PLAN
// Ne bloque jamais l'affichage déjà ouvert
// ============================================================

function synchroniserAdminArrierePlan(
    schoolId,
    phone
){

    if(!schoolId){

        return;

    }


    db.ref(
        "schools/" +
        schoolId
    )
    .once("value")

    .then(function(snapshot){

        if(!snapshot.exists()){

            return;

        }


        var school =
            snapshot.val() || {};


        window.adminCache =
            school;


        try{

            localStorage.setItem(

                "adminData_" +
                schoolId,

                JSON.stringify({

                    school:
                        school,

                    schoolId:
                        schoolId,

                    phone:
                        phone

                })

            );

        }
        catch(error){

            console.warn(
                "Mise à jour cache admin :",
                error
            );

        }


        /*
         * Actualiser silencieusement
         * les données déjà affichées.
         */

        try{

            actualiserAdmin(
                true
            );

        }
        catch(error){

            console.warn(
                "Actualisation admin :",
                error
            );

        }

    })

    .catch(function(error){

        /*
         * Aucune alerte.
         * L'utilisateur continue à travailler
         * avec les données du cache.
         */

        console.warn(
            "Synchronisation arrière-plan :",
            error
        );

    });

}

// ============================================================
// ACTUALISER LES DONNÉES ADMIN
//
// - Charge les nouvelles données Firebase
// - Met à jour le cache
// - Ne reconstruit PAS l'espace admin lors d'une
//   actualisation silencieuse
// - Évite les ralentissements et clignotements
// ============================================================

async function actualiserAdmin(silencieux){

    if(
        !window.currentSchoolId
    ){

        return;

    }


    /*
     * Compatibilité avec les anciens appels :
     *
     * actualiserAdmin()
     * actualiserAdmin(true)
     */

    silencieux =
        silencieux === true;


    if(!silencieux){

        showLoader();

    }


    try{

        const schoolId =
            window.currentSchoolId;


        /*
         * ====================================================
         * CHARGER L'ÉCOLE
         * ====================================================
         */

        const snapshot =
            await db.ref(
                "schools/" +
                schoolId
            ).once("value");


        if(
            !snapshot.exists()
        ){

            if(!silencieux){

                hideLoader();

            }

            console.warn(
                "École introuvable :",
                schoolId
            );

            return;

        }


        const school =
            snapshot.val() || {};


        /*
         * ====================================================
         * METTRE À JOUR LE CACHE MÉMOIRE
         * ====================================================
         */

        window.adminCache =
            school;


        window.currentSchool =
            school;


        /*
         * ====================================================
         * METTRE À JOUR LE CACHE LOCAL
         * ====================================================
         */

        try{

            localStorage.setItem(

                "adminData_" +
                schoolId,

                JSON.stringify({

                    school:
                        school,

                    schoolId:
                        schoolId,

                    phone:
                        window.currentPhone

                })

            );

        }
        catch(cacheError){

            console.warn(
                "Impossible de mettre à jour le cache admin :",
                cacheError
            );

        }


        /*
         * ====================================================
         * VÉRIFIER L'ABONNEMENT
         * ====================================================
         */

        if(
            typeof verifierEssai ===
            "function"
        ){

            const autorise =
                verifierEssai(
                    school
                );


            if(!autorise){

                if(!silencieux){

                    hideLoader();

                }

                return;

            }

        }


        /*
         * ====================================================
         * ACTUALISATION DE L'INTERFACE
         *
         * IMPORTANT :
         *
         * En mode silencieux :
         * NE PAS appeler afficherAdmin().
         *
         * L'espace est déjà affiché.
         * On laisse donc l'écran tranquille.
         *
         * En mode normal :
         * on reconstruit l'interface.
         * ====================================================
         */

        if(!silencieux){

            if(
                document.querySelector(
                    ".admin-header"
                )
            ){

                afficherAdmin(
                    school
                );

            }

        }


        /*
         * ====================================================
         * FIN
         * ====================================================
         */

        if(!silencieux){

            hideLoader();

        }


    }
    catch(error){

        if(!silencieux){

            hideLoader();

            alert(
                error.message ||
                "Impossible d'actualiser l'école."
            );

        }
        else{

            console.warn(
                "Actualisation admin en arrière-plan :",
                error
            );

        }

    }

}

    const heureFin =
        prompt(

        prompt(

        !heureDebut.trim() ||
        !heureFin.trim() ||
        !matiere.trim()

        .jours[jour]
        .push({

                heureDebut.trim(),

            heureFin:

function supprimerCoursJourHoraire(index){

    if(!jour) return;

        !confirm(

            jour +

        )

async function enregistrerSemaineEmploiTemps(){

    const data =
        window.nouvelEmploiTemps;


    if(!data){
        alert("Aucune donnée à enregistrer.");
        return;
    }


    if(!data.enseignant){

        alert(
            "Veuillez choisir un enseignant."
        );

        return;

    }


    if(!data.classe){

        alert(
            "Veuillez choisir une classe."
        );

        return;

    }


    if(!data.salle){

        alert(
            "Veuillez indiquer une salle."
        );

        return;

    }


    let totalCours = 0;


    Object.values(data.jours)
        .forEach(liste => {

            totalCours += liste.length;

        });


    if(totalCours === 0){

        alert(
            "Ajoutez au moins une matière."
        );

        return;

    }


    if(
        !confirm(
            "Enregistrer les " +
            totalCours +
            " cours de cette semaine ?"
        )
    ){

        return;

    }


    showLoader();


    try {

        const updates = {};


        Object.entries(data.jours)
        .forEach(([jour,liste]) => {

            liste.forEach(cours => {

                const key =
                    db.ref().push().key;


                updates[
                    "schools/" +
                    data.schoolId +
                    "/emploisTemps/" +
                    key
                ] = {

                    jour: jour,

                    heureDebut:
                        cours.heureDebut,

                    heureFin:
                        cours.heureFin,

                    matiere:
                        cours.matiere,

                    enseignant:
                        data.enseignant,

                    enseignantNom:
                        data.enseignantNom,

                    classe:
                        data.classe,

                    salle:
                        data.salle,

                    section:
                        data.section,

                    createdAt:
                        Date.now()

                };

            });

        });


        await db.ref().update(updates);


        hideLoader();


        alert(
            "✅ Emploi du temps enregistré avec succès."
        );


        window.nouvelEmploiTemps = null;


        ouvrirGestionEmploiTemps();


    }
    catch(error){

        hideLoader();


        console.error(
            "Erreur enregistrement semaine :",
            error
        );


        alert(
            "Erreur lors de l'enregistrement."
        );

    }

}





function afficherTempsRestant(school){

let abonnementActif=
school.subscriptionEnd &&
school.subscriptionEnd>Date.now();

let fin=abonnementActif
?school.subscriptionEnd
:school.trialEnd;

if(!fin) return "";

let restant=fin-Date.now();

if(restant<=0){

return `

<div style="
background:#D32F2F;
color:white;
padding:10px;
border-radius:12px;
margin-top:8px;
text-align:center;
">

<b>

${abonnementActif
?"⛔ Abonnement expiré"
:"⛔ Essai expiré"}

</b>

</div>

`;

}

let jours=Math.floor(restant/86400000);

let heures=Math.floor((restant%86400000)/3600000);

let minutes=Math.floor((restant%3600000)/60000);

let secondes=Math.floor((restant%60000)/1000);

let couleur=restant<=10*60*1000
?"#D32F2F"
:"#2E7D32";

return `

<div style="
background:${couleur};
color:white;

${abonnementActif
?"💳 Abonnement restant"
:"🎁 Essai restant"}

</div>

<div id="compteurAbonnement"
data-fin="${fin}"
style="
font-size:22px;
font-family:monospace;
font-weight:bold;
letter-spacing:2px;
">

${String(jours).padStart(2,"0")} :
${String(heures).padStart(2,"0")} :
${String(minutes).padStart(2,"0")} :
${String(secondes).padStart(2,"0")}

</div>

<div style="
font-size:11px;
margin-top:5px;
opacity:.8;
">

J H M S

</div>

</div>

`;

}

function lancerCompteurExpiration(){

clearInterval(window.compteurExpiration);

window.compteurExpiration=setInterval(function(){

if(!window.adminCache) return;

let abonnementActif =
window.adminCache.subscriptionEnd &&
window.adminCache.subscriptionEnd > Date.now();

let fin = abonnementActif
? window.adminCache.subscriptionEnd
: window.adminCache.trialEnd;

if(!fin) return;

let restant=fin-Date.now();

if(restant<0){

clearInterval(window.compteurExpiration);

actualiserAdmin(true);

return;

}

let jours=Math.floor(restant/86400000);

restant%=86400000;

let heures=Math.floor(restant/3600000);

restant%=3600000;

let minutes=Math.floor(restant/60000);

restant%=60000;

let secondes=Math.floor(restant/1000);

let el=document.getElementById("compteurAbonnement");

if(el){

el.innerHTML=

jours.toString().padStart(2,"0")+

" : "+

heures.toString().padStart(2,"0")+

" : "+

minutes.toString().padStart(2,"0")+

" : "+

secondes.toString().padStart(2,"0");

}

},1000);

}

function saveTeacher(){

    showLoader();

    let telephone = document.getElementById("telephone").value.replace(/\D/g,"");

    // Retirer le 0 initial
    if(telephone.startsWith("0")){
        telephone = telephone.substring(1);
    }

    // Ajouter 243
    if(telephone && !telephone.startsWith("243")){
        telephone = "243"+telephone;
    }

    telephone = normalizePhone(telephone);

    // Matricule enseignant
    let matricule = "ENS-"+Date.now();

    // Email technique pour Firebase Auth
    let authEmail = matricule.toLowerCase()+"@masomo.app";

    let data = {

        matricule: matricule,

        nom: document.getElementById("nom").value.trim(),

        postnom: document.getElementById("postnom").value.trim(),

        prenom: document.getElementById("prenom").value.trim(),

        name:
            document.getElementById("nom").value.trim()+" "+
            document.getElementById("postnom").value.trim()+" "+
            document.getElementById("prenom").value.trim(),

        email: authEmail,

        classe: document.getElementById("classeEns").value,

        role: "teacher",

        sexe: document.getElementById("sexe").value,

        dateNaissance: document.getElementById("dateNaissance").value,

        lieuNaissance: document.getElementById("lieuNaissance").value,

        dateEngagement: document.getElementById("dateEngagement").value,

        matiere: document.getElementById("matiere").value,

        telephone: telephone,

        adresse: document.getElementById("adresse").value,

        schoolId: window.currentSchoolId,

        linked: false,

        authCreated: false,

        createdAt: Date.now()

    };

    Promise.all([

        db.ref("schools/"+window.currentSchoolId+"/teachers/"+matricule).set(data),

        db.ref("schools/"+window.currentSchoolId+"/members/"+matricule).set({

            matricule: matricule,

            name: data.name,

            phone: telephone,

            classe: data.classe,

            role: "teacher",

            linked: false,

            createdAt: Date.now()

        })

    ])

    .then(()=>{

        hideLoader();

        alert("Enseignant enregistré avec succès.\n\nGénérez maintenant un code d'invitation pour qu'il rejoigne l'école.");

        teacherRecords();

    })

    .catch(error=>{

        hideLoader();

        alert(error.message);

    });

}

        actualiserAdmin(true);

        return;

    let adminPhone = window.currentPhone;

    showLoader();

        let admin = snapshot.val();

        hideLoader();

        window.adminCache = school;

            school: school,
            schoolId: window.currentSchoolId,
            phone: window.currentPhone

        }));

        afficherFormulaireAjoutEleve(school);

    });

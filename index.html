function finishJoin(){

let matricule=

document.getElementById(
"matricule"
)?.value.trim() || "";

let phone=
window.currentPhone;

let invite=
window.currentInvite;

showLoader();


// si matricule vide

if(matricule===""){

db.ref(
"users/"+phone
)

.set({

phone:phone,

role:invite.role,

schoolId:invite.schoolId,

name:"Nouvel utilisateur",

createdAt:
new Date()
.toISOString()

})

.then(()=>{

hideLoader();

alert(
"Compte créé"
);

if(invite.role==="student"){
openStudent();
}
else if(invite.role==="teacher"){
openTeacher();
}
else{
openParent();
}

})

.catch(error=>{

hideLoader();

alert(
error.message
);

});

return;

}


// si matricule rempli

db.ref(
"eleves/"+matricule
)

.once("value")

.then(snapshot=>{

if(!snapshot.exists()){

throw new Error(
"Matricule introuvable"
);

}

let eleve=
snapshot.val();

if(eleve.linked){

throw new Error(
"Élève déjà lié"
);

}


let userData={

matricule:
eleve.matricule,

nom:
eleve.nom,

postnom:
eleve.postnom,

prenom:
eleve.prenom,

name:
eleve.name,

phone:
phone,

role:
"student",

className:
eleve.className,

schoolId:
eleve.schoolId,

fatherName:
eleve.fatherName || "",

fatherPhone:
eleve.fatherPhone || "",

motherName:
eleve.motherName || "",

motherPhone:
eleve.motherPhone || "",

province:
eleve.province || "",

territoire:
eleve.territoire || "",

secteur:
eleve.secteur || "",

linked:true,

createdAt:
eleve.createdAt

};

return Promise.all([

db.ref(
"users/"+phone
).set(userData),

db.ref(
"eleves/"+matricule
)

.update({

phone:phone,
linked:true

}),

db.ref(
"schools/"
+
eleve.schoolId+
"/members/"
+
phone
)

.set({

name:
eleve.name,

role:
"student",

phone:
phone,

createdAt:
Date.now()

})

]);

})

.then(()=>{

hideLoader();

alert(
"Compte lié avec succès"
);

openStudent();

})

.catch(error=>{

hideLoader();

alert(
error.message
);

});

}

// ================= VALIDATION TELEPHONE =================

function validatePhone(){

const input=
document.getElementById("phone");

const country=
document.getElementById("countryCode");

const btn=
document.getElementById("continueBtn");

const status=
document.getElementById("phoneStatus");


if(
!input ||
!country ||
!btn ||
!status
){
return;
}


// garder uniquement chiffres

let number=
input.value.replace(/\D/g,"");


// traitement RDC

if(

country.value==="+243" &&
number.startsWith("0")

){

number=
number.substring(1);

}


// limites

const maxLength=

country.value==="+243"
?9
:15;

number=
number.substring(0,maxLength);

input.value=
number;


// validation

const isValid=

country.value==="+243"
?number.length===9
:number.length>=6;


// mise à jour interface

btn.disabled=!isValid;

btn.classList.toggle(
"active",
isValid
);

input.classList.toggle(
"validInput",
isValid
);


status.innerHTML=

isValid
?"✓ Numéro valide"
:"Numéro incomplet";


status.style.color=

isValid
?"green"
:"#777";

}

function afficherElevesTable(eleves){

let tbody =
document.getElementById("tableEleves");

tbody.innerHTML="";

eleves.forEach(e=>{

onclick="voirFicheEleve('${e.matricule}')"

">

`;

});

}


// ================= FILTRE =================

function filtrerEleves(){

let texte=
document
.getElementById(
"rechercheEleve"
)
.value
.toLowerCase();

let classe=
document
.getElementById(
"filtreClasse"
)
.value;


let resultat=

window.elevesCache.filter(e=>{

let nom=`

${e.nom||""}
${e.postnom||""}
${e.prenom||e.name||""}

`
.toLowerCase();

let okNom=
nom.includes(
texte
);

let okClasse=

classe===""

||

e.className===
classe;

return(
okNom &&
okClasse
);

});


afficherElevesTable(
resultat
);

}
